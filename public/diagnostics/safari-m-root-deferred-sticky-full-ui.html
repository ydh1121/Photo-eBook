<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    (function(){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','/?safariDiagSource=1',false);
      xhr.send(null);
      var html=xhr.responseText;
      var override='\n<style id="safariDiagnosticOverride">\n'+
        'html[data-theme="light"],html[data-theme="light"] body{background:#fff!important;background-color:#fff!important}\n'+
        'html[data-theme="dark"],html[data-theme="dark"] body{background:#0d0f13!important;background-color:#0d0f13!important}\n'+
        '.ios-webkit-chrome:not(.safari-nav-sticky-armed) .nav-shell,.ios-webkit-chrome:not(.safari-nav-sticky-armed) .nav-shell.is-compact,.ios-webkit-chrome:not(.safari-nav-sticky-armed) .nav-shell.is-scrolled{position:relative!important;top:auto!important}\n'+
        '.ios-webkit-chrome.safari-nav-sticky-armed .nav-shell,.ios-webkit-chrome.safari-nav-sticky-armed .nav-shell.is-compact,.ios-webkit-chrome.safari-nav-sticky-armed .nav-shell.is-scrolled{position:-webkit-sticky!important;position:sticky!important;top:0!important}\n'+
        '</style>\n';
      var armScript='\n<script id="safariDiagnosticArmSticky">(function(){function start(){var root=document.documentElement;if(!root.classList.contains("ios-webkit-chrome"))return;var vv=window.visualViewport;var baseline=vv?vv.height:window.innerHeight;var armed=false;function arm(){if(armed)return;armed=true;root.classList.add("safari-nav-sticky-armed");}function check(){if(armed)return;var current=vv?vv.height:window.innerHeight;var compactGrowth=current-baseline;if(compactGrowth>24||window.scrollY>140)arm();}window.addEventListener("scroll",check,{passive:true});if(vv)vv.addEventListener("resize",check,{passive:true});window.addEventListener("pageshow",function(){baseline=vv?vv.height:window.innerHeight;});}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();})();<\/script>\n';
      html=html.replace('</head>',override+'</head>');
      html=html.replace('</body>',armScript+'</body>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</head>
<body></body>
</html>
