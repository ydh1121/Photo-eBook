<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Safari minimal chrome control</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    body{min-height:220vh;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
    .band{height:42vh}
    .a{background:linear-gradient(135deg,#f7f7f9 0 50%,#dbe8ff 50%)}
    .b{background:linear-gradient(135deg,#ffe5d6 0 50%,#e0f5df 50%)}
    .c{background:linear-gradient(135deg,#e6ddff 0 50%,#fff0b8 50%)}
    .d{background:linear-gradient(135deg,#dcecff 0 50%,#f8dff1 50%)}
    .e{height:60vh;background:linear-gradient(135deg,#d8f1ec 0 50%,#e4e7ff 50%)}
  </style>
</head>
<body>
  <div class="band a"></div>
  <div class="band b"></div>
  <div class="band c"></div>
  <div class="band d"></div>
  <div class="e"></div>
</body>
</html>
