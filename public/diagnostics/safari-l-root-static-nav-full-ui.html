<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    (function(){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','/?safariDiagSource=1',false);
      xhr.send(null);
      var html=xhr.responseText;
      var override='\n<style id="safariDiagnosticOverride">\n'+
        'html[data-theme="light"],html[data-theme="light"] body{background:#fff!important;background-color:#fff!important}\n'+
        'html[data-theme="dark"],html[data-theme="dark"] body{background:#0d0f13!important;background-color:#0d0f13!important}\n'+
        '.ios-webkit-chrome .nav-shell,.ios-webkit-chrome .nav-shell.is-compact,.ios-webkit-chrome .nav-shell.is-scrolled{position:relative!important;top:auto!important}\n'+
        '</style>\n';
      html=html.replace('</head>',override+'</head>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</head>
<body></body>
</html>
