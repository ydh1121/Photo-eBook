<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>플랫폼 빌더</title>
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/builder-v1.css?v=2">
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/builder-sandbox-v1.css?v=1">
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/server.css?v=1">
</head>
<body>
  <div class="ui-dashboard builder-shell" data-builder-view="page">
    <header class="builder-topbar">
      <div class="builder-brand"><strong>플랫폼 빌더</strong><span>더미 페이지에서 UI와 블록을 조정합니다</span></div>
      <nav class="builder-admin-nav" aria-label="관리 도구">
        <button type="button" data-builder-view-button="page" aria-pressed="true">페이지 편집</button>
        <button type="button" data-builder-view-button="library" aria-pressed="false">UI 라이브러리</button>
        <a href="/block-lab/">블록 랩</a>
        <a href="/editor-lab/">페이지 에디터</a>
        <a href="/qa/video-editor/">QA</a>
      </nav>
      <div class="ui-dashboard__top-actions builder-server-slot"></div>
    </header>

    <section class="builder-toolbar" aria-label="빌더 도구">
      <div class="builder-toolbar__group">
        <label class="builder-page-select">캔버스
          <select id="builderPageSelect"><option value="/ui-dashboard/sandbox/">범용 더미 페이지</option></select>
        </label>
        <button type="button" id="builderEditToggle" class="builder-toggle" aria-pressed="true">편집 모드 켬</button>
        <button type="button" id="builderAddAd">본문 광고 추가</button>
        <button type="button" id="builderAdLeft" class="builder-desktop-ad-control">좌측 플로팅 광고</button>
        <button type="button" id="builderAdRight" class="builder-desktop-ad-control">우측 플로팅 광고</button>
        <button type="button" id="builderOpenBlockPalette">블록 추가</button>
      </div>
      <div class="builder-toolbar__group builder-toolbar__group--right">
        <button type="button" id="builderResetPage">더미 초기화</button>
        <button type="button" id="builderSaveLayout">현재 조립 저장</button>
      </div>
    </section>

    <section class="builder-library-tools" id="builderLibraryTools" hidden>
      <div class="builder-library-intro"><strong>UI 라이브러리</strong><span>운영 UI와 같은 클래스·CSS를 더미 문맥에서 가져와 맨바닥에서 확인합니다.</span></div>
      <div class="builder-library-filters" id="builderLibraryFilters" role="group" aria-label="UI 종류"></div>
    </section>

    <main class="builder-stage"><div class="builder-canvas-shell" id="builderCanvasShell"><iframe id="builderFrame" class="builder-frame" title="더미 페이지 편집 화면" src="/ui-dashboard/sandbox/"></iframe><div class="builder-frame-status" id="builderFrameStatus">더미 UI 캔버스를 불러오는 중</div></div></main>
    <div class="builder-panel-layer" id="builderPanelLayer" aria-live="polite"></div>
    <div class="builder-mobile-dock" id="builderMobileDock" hidden></div>

    <aside class="builder-block-palette" id="builderBlockPalette" aria-hidden="true">
      <header><div><small>페이지 조립</small><strong>블록 추가</strong></div><button type="button" data-close-block-palette aria-label="닫기">×</button></header>
      <div class="builder-block-filter" id="builderBlockFilter"></div><div class="builder-block-list" id="builderBlockList"></div>
      <p class="builder-palette-note">승인 전 블록은 더미 조립 화면에서만 시험합니다. 실제 공개 페이지에는 자동 반영하지 않습니다.</p>
    </aside>
  </div>

  <script src="/data/ui-capabilities/v1/manifest.js?v=3"></script>
  <script src="/data/block-registry/v1/manifest.js?v=3"></script>
  <script src="/assets/js/ui-dashboard/builder-v1.js?v=1"></script>
  <script src="/assets/js/ui-dashboard/builder-boundaries-v1.js?v=1"></script>
  <script src="/assets/js/ui-dashboard/builder-sandbox-ads-v1.js?v=1"></script>
  <script src="/assets/js/ui-dashboard/server.js?v=2"></script>
</body>
</html>
