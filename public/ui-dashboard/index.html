<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>페이지 UI 대시보드</title>
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/dashboard.css?v=1">
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/parity-v2.css?v=1">
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/live-preview-v3.css?v=1">
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/server.css?v=1">
  <link rel="stylesheet" href="/assets/styles/ui-dashboard/preset-lifecycle.css?v=1">
</head>
<body>
  <div class="ui-dashboard">
    <header class="ui-dashboard__top">
      <div class="ui-dashboard__top-inner">
        <div class="ui-dashboard__brand"><strong>페이지 UI 대시보드</strong><span>페이지 공통 기능을 직접 조작하고 설정을 저장합니다 · 검색 노출 제외</span></div>
        <div class="ui-dashboard__top-actions"><button type="button" id="uiPresetExport">설정 내보내기</button></div>
      </div>
    </header>

    <div class="ui-dashboard__layout">
      <aside class="ui-pane ui-pane--left">
        <div class="ui-pane-head"><small>페이지 UI</small><h1>UI 기능</h1></div>
        <div id="uiCapabilityList" class="ui-capability-list"></div>
      </aside>

      <main class="ui-pane ui-workspace" id="uiWorkspace"></main>

      <aside class="ui-pane ui-pane--right">
        <div class="ui-pane-head"><small>저장된 설정</small><h2>설정 preset</h2></div>
        <section class="ui-preset-create">
          <label>설정 이름<input id="uiPresetName" type="text" placeholder="사진 상단 메뉴 · 파란 진행 표시"></label>
          <div class="ui-preset-actions"><button type="button" id="uiPresetSave">현재 설정 저장</button></div>
        </section>
        <div id="uiPresetList" class="ui-preset-list"></div>
      </aside>
    </div>
  </div>

  <script src="/data/ui-capabilities/v1/manifest.js?v=2"></script>
  <script src="/assets/js/ui-dashboard/dashboard.js?v=3"></script>
  <script src="/assets/js/ui-dashboard/server.js?v=2"></script>
  <script src="/assets/js/ui-dashboard/preset-lifecycle.js?v=2"></script>
</body>
</html>
