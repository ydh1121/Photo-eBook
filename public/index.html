      if(ios&&/WebKit/i.test(ua))document.documentElement.classList.add('ios-webkit-chrome');
      try{
        const key='photoRoadmapThemeV1';
        const choice=['light','dark','system'].includes(localStorage.getItem(key))?localStorage.getItem(key):'light';
        const dark=choice==='dark'||(choice==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeChoice=choice;
        document.documentElement.dataset.theme=dark?'dark':'light';
        document.documentElement.style.colorScheme=dark?'dark':'light';
      }catch{
        document.documentElement.dataset.themeChoice='light';
        document.documentElement.dataset.theme='light';
      }
    })();
  </script>
