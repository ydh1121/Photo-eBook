<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>영상편집 QA Preview</title>
  <link rel="stylesheet" href="/assets/styles/block-lab/lab.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/a11y.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/refinement-v2.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/new-blocks-v2.css?v=1">
  <link rel="stylesheet" href="/assets/styles/qa-page/page.css?v=1">
</head>
<body>
  <div class="qa-page" data-theme="light" data-preview="desktop">
    <header class="qa-toolbar">
      <div class="qa-toolbar__inner">
        <div class="qa-toolbar__label"><strong>Video Editor QA</strong><span>UI 검토용 / 검색 노출 제외</span></div>
        <div class="qa-segment" aria-label="화면 폭">
          <button type="button" data-qa-preview="mobile" aria-pressed="false">390</button>
          <button type="button" data-qa-preview="tablet" aria-pressed="false">768</button>
          <button type="button" data-qa-preview="desktop" aria-pressed="true">1180</button>
        </div>
        <div class="qa-segment" aria-label="테마">
          <button type="button" data-qa-theme="light" aria-pressed="true">Light</button>
          <button type="button" data-qa-theme="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
    </header>
    <div class="qa-stage"><div id="qaCanvas" class="qa-canvas"></div></div>
    <footer class="qa-footer">candidate renderer와 QA draft를 연결한 검토 화면입니다. production 공개 페이지가 아닙니다.</footer>
  </div>

  <script src="/assets/js/blocks/block-registry.js?v=2"></script>
  <script src="/data/block-registry/v1/manifest.js?v=1"></script>
  <script src="/assets/js/blocks/block-renderers.js?v=1"></script>
  <script src="/assets/js/blocks/block-renderers-extended.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-interactions-extended.js?v=1"></script>
  <script src="/data/qa/video-editor-draft-v1.js?v=1"></script>
  <script src="/assets/js/qa-page/video-editor.js?v=1"></script>
</body>
</html>
