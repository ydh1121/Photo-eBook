  <title>플랫폼 관리 · 블록 연구실</title>
  <link rel="stylesheet" href="/assets/styles/admin/admin-shell-v1.css?v=2" data-admin-shell-style>
  <link rel="stylesheet" href="/assets/styles/block-lab/lab.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/a11y.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/refinement-v2.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/new-blocks-v2.css?v=1">
  <link rel="stylesheet" href="/assets/styles/block-lab/photography-parity-v1.css?v=1">

<body>
  <div class="block-lab" data-theme="light" data-preview="fluid">
    <header class="lab-topbar">
      <div class="lab-topbar__inner">
        <div class="lab-brand"><strong>블록 연구실</strong><span id="labCount">28개</span></div>
        <div class="lab-controls">
          <a href="/ui-dashboard/">UI 라이브러리</a>
          <select class="lab-filter" id="labCategory" aria-label="블록 분류"><option value="all">전체 블록</option><option value="foundation">기본</option><option value="content">콘텐츠</option><option value="data">비교·데이터</option><option value="media">미디어</option><option value="action">실행</option><option value="resource">자료</option><option value="monetization">광고</option></select>
          <div class="lab-segment" aria-label="테마 미리보기"><button type="button" data-theme-value="light" aria-pressed="true">밝게</button><button type="button" data-theme-value="dark" aria-pressed="false">어둡게</button></div>
          <div class="lab-segment" aria-label="화면 너비 미리보기"><button type="button" data-preview-value="fluid" aria-pressed="true">맞춤</button><button type="button" data-preview-value="mobile" aria-pressed="false">390</button><button type="button" data-preview-value="tablet" aria-pressed="false">768</button><button type="button" data-preview-value="desktop" aria-pressed="false">1180</button></div>
        </div>
      </div>
    </header>

    <div class="lab-layout">
      <aside class="lab-sidebar"><div class="lab-sidebar__intro"><small>RESEARCH ONLY</small><h1>신규 블록을 연구합니다</h1><p>구조와 변형, 스타일을 시험하는 공간입니다. 여기의 코드는 라이브러리나 에디터가 직접 사용하지 않습니다.</p></div><nav class="lab-nav" id="labNav" aria-label="연구 블록 목록"></nav></aside>
      <main class="lab-main"><section class="lab-intro"><span class="lab-intro__tag">연구용</span><h2>블록을 충분히 검토한 뒤 공통 모듈로 승격합니다</h2><p>나와 GPT가 구조와 동작을 확인하고 합의한 블록만 연구실 밖의 공통 모듈 코드로 옮깁니다.</p><div class="lab-intro__notes"><span>공개 페이지 직접 반영 없음</span><span>라이브러리 직접 연결 없음</span></div></section><section class="lab-specimens" id="labSpecimens" aria-live="polite"></section></main>
    </div>
  </div>

  <script src="/assets/js/admin/admin-shell-v1.js?v=3" data-admin-shell-loader></script>
  <script src="/assets/js/blocks/block-registry.js?v=2"></script>

  <script src="/assets/js/blocks/block-renderers-extended.js?v=1"></script>
  <script src="/assets/js/blocks/block-renderers-parity.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-data.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-data-extended.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-parity-data.js?v=2"></script>
  <script src="/assets/js/blocks/block-registry-health.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-interactions-extended.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-app.js?v=2"></script>
  <script src="/assets/js/block-lab/lab-review.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-variant-review.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-style-presets.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-style-lifecycle.js?v=1"></script>
  <script src="/assets/js/block-lab/lab-review-server.js?v=3"></script>
</body>
