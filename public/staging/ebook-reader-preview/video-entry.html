d568b760d49e4ac0a07c","bytes":55198,"width":1467,"height":1067},"video-window-light":{"src":"assets/0a8ad4813609a226a0ae2d87e7add4d00216709cb23b9b6346d45d39f834a2b1.webp","sha256":"0a8ad4813609a226a0ae2d87e7add4d00216709cb23b9b6346d45d39f834a2b1","bytes":42974,"width":1467,"height":987}},"sourceSha256":"9bb80546640364f340569c7bbbdd19716fbf51e937541e9efa96d2c77d64e4c2","bodyPageCount":24,"frontMatterExcluded":true},"pages":{"video-entry.finished-video":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.finished-video\",\n  \"pageNumber\": 1,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"다섯 장면으로 만드는 30초 영상\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"종이와 펜을 놓은 장면에서 시작해 책에 꽂힌 책갈피로 마무리합니다. 다섯 장면을 각각 6초로 연결하고 모임 정보를 자막으로 넣습니다. 완성 파일은 휴대전화에서 처음부터 끝까지 재생해 사진·자막·소리가 의도대로 이어지는지 확인합니다.\",\n      \"blockId\": \"video-entry.finished-video.b01\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"교육용 자체 기획\",\n      \"text\": \"‘토요일 책갈피 만들기’는 연습용 가상 행사이며 실제 모집이 아닙니다. 전 구간에 ‘연습용 · 실제 모집 아님’을 표시하고 영상 설명문에도 같은 사실을 밝힙니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.finished-video.b02\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-finished\",\n      \"alt\": \"책에 끼운 연노랑 책갈피의 완성 모습을 보여주는 사진\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"caption\": \"30초 영상의 마지막 장면으로 사용할 학습용 제작 예시입니다.\",\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\",\n      \"blockId\": \"video-entry.finished-video.b03\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"이번 결과물의 기준\",\n      \"columns\": [\n        \"항목\",\n        \"목표\"\n      ],\n      \"rows\": [\n        [\n          \"길이·화면\",\n          \"5장면 × 6초 = 30초 · 세로 9:16\"\n        ],\n        [\n          \"자막\",\n          \"활동·일시·준비물·정원·비용·신청 안내 연습\"\n        ],\n        [\n          \"소리\",\n          \"직접 녹음한 소리 또는 의도한 무음\"\n        ],\n        [\n          \"검사\",\n          \"앱 밖에서 재생하고 원본과 완성본을 구분해 보관\"\n        ]\n      ],\n      \"blockId\": \"video-entry.finished-video.b04\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진 앱에서 파일을 열 수 있으면 시작할 수 있습니다. 편집 경험은 필요하지 않습니다. 이 샘플은 공식 문서를 바탕으로 썼으며 실제 Android에서 모든 단계를 실행한 검증본은 아닙니다.\",\n      \"blockId\": \"video-entry.finished-video.b05\"\n    }\n  ]\n}\n","video-entry.materials-and-inputs":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.materials-and-inputs\",\n  \"pageNumber\": 2,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"원본과 연습 자료 준비\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"직접 촬영할 때는 연노랑 종이, 파란 펜, 읽던 책 한 권과 스마트폰을 준비하세요. 작은 종이는 가로 약 4cm, 세로 약 15cm로 준비하면 화면을 구성하기 편합니다. 이 치수는 촬영 연습용 예시이며 모임의 확정 제공 규격을 뜻하지 않습니다.\",\n      \"blockId\": \"video-entry.materials-and-inputs.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"시작 자료 두 경로\",\n      \"columns\": [\n        \"경로\",\n        \"입력\",\n        \"남길 기록\"\n      ],\n      \"rows\": [\n        [\n          \"직접 촬영\",\n          \"7~9쪽 방법으로 찍은 동영상 5개\",\n          \"직접 촬영·촬영일·사용한 파일\"\n        ],\n        [\n          \"편집부터 연습\",\n          \"재료·그리기·글쓰기·끼우기·완성 사진 5장\",\n          \"학습용 제작 사진 사용·촬영 실습 미실행\"\n        ]\n      ],\n      \"blockId\": \"video-entry.materials-and-inputs.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"제공 사진은 촬영 구도와 편집 순서를 설명하기 위한 제작 예시입니다. 사진 다섯 장으로 만든 결과는 사진 영상이라고 표시합니다. 사람의 손이 실제로 움직이는 촬영 영상이나 Android 앱 조작 녹화로 소개하지 않습니다.\",\n      \"blockId\": \"video-entry.materials-and-inputs.b03\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"폴더와 파일 이름 예시\",\n      \"text\": \"bookmark-practice/\\n01_materials.mp4\\n02_drawing.mp4\\n03_lettering.mp4\\n04_in-book.mp4\\n05_finished.mp4\\ncaption-note.txt\\nbookmark_30s_v01.mp4\",\n      \"blockId\": \"video-entry.materials-and-inputs.b04\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"위 파일명은 자신이 만들 파일에 붙일 이름입니다. 이 이름을 적었다고 동영상 원본이 제공된 것은 아닙니다. 원본을 편집 앱 밖에도 보관하고, 완성 파일은 별도 이름으로 저장합니다.\",\n      \"blockId\": \"video-entry.materials-and-inputs.b05\"\n    }\n  ]\n}\n","video-entry.five-shot-plan":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.five-shot-plan\",\n  \"pageNumber\": 3,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"촬영 전에 정하는 다섯 장면\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"장면마다 보여줄 일이 하나씩 있으면 촬영과 편집이 단순해집니다. 재료를 한 번에 다 설명하려고 카메라를 빠르게 움직일 필요는 없습니다. 같은 책상에서 카메라와 손의 위치를 바꾸며 아래 다섯 장면을 나눠 찍습니다.\",\n      \"blockId\": \"video-entry.five-shot-plan.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"30초 촬영·편집 계획\",\n      \"columns\": [\n        \"완성 시간\",\n        \"화면\",\n        \"자막\"\n      ],\n      \"rows\": [\n        [\n          \"00:00~00:06\",\n          \"재료 전체\",\n          \"토요일 책갈피 만들기\"\n        ],\n        [\n          \"00:06~00:12\",\n          \"무늬를 그리는 손\",\n          \"11월 14일(토)\\n14:00~15:00\"\n        ],\n        [\n          \"00:12~00:18\",\n          \"책갈피에 글을 적는 손\",\n          \"종이·파란 펜 제공\\n읽던 책 1권 준비\"\n        ],\n        [\n          \"00:18~00:24\",\n          \"책 사이에 끼우기\",\n          \"정원 6명\\n참가비 무료\"\n        ],\n        [\n          \"00:24~00:30\",\n          \"책과 완성 책갈피\",\n          \"신청 안내 문구 연습\\n계정 메시지 ‘책갈피’\"\n        ]\n      ],\n      \"blockId\": \"video-entry.five-shot-plan.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"‘연습용 · 실제 모집 아님’은 다섯 구간 모두에서 유지합니다. 장소는 영상 설명문에 ‘부산의 동네 모임 공간(연습용 가상 장소)’로 적습니다. 화면에 모든 안내를 작게 밀어 넣지 말고, 짧은 자막과 설명문의 역할을 나눕니다.\",\n      \"blockId\": \"video-entry.five-shot-plan.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"장면의 역할 말하기\",\n      \"goal\": \"각 장면에서 독자가 알게 될 것을 정한다.\",\n      \"steps\": [\n        \"재료, 과정, 사용, 완성 장면을 소리 내어 설명합니다.\",\n        \"자막의 날짜·정원·준비물을 사실 카드와 대조합니다.\"\n      ],\n      \"expectedOutput\": \"다섯 장면의 촬영 메모\",\n      \"checks\": [\n        \"같은 완성 사진만 다섯 번 반복하지 않는가?\",\n        \"근거 없는 장소나 혜택을 추가하지 않았는가?\"\n      ],\n      \"blockId\": \"video-entry.five-shot-plan.b04\"\n    }\n  ]\n}\n","video-entry.frame-size-rate":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.frame-size-rate\",\n  \"pageNumber\": 4,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"세로 화면과 화질의 기초\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"화면 비율은 가로와 세로의 관계입니다. 9:16은 세로로 긴 화면을 뜻합니다. 해상도는 화면을 이루는 픽셀 수이며, 이 과제의 목표는 가로 1080·세로 1920픽셀입니다. 30fps는 1초에 30장의 화면을 재생한다는 뜻입니다.\",\n      \"blockId\": \"video-entry.frame-size-rate.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"이번 촬영의 작업값\",\n      \"columns\": [\n        \"값\",\n        \"선택 이유\",\n        \"주의할 점\"\n      ],\n      \"rows\": [\n        [\n          \"세로 9:16\",\n          \"휴대전화 세로 화면에서 볼 연습 영상\",\n          \"중간에 휴대전화를 가로로 돌리지 않음\"\n        ],\n        [\n          \"1080p 수준\",\n          \"책갈피와 짧은 자막을 확인할 작업 목표\",\n          \"카메라·앱의 실제 지원 여부 확인\"\n        ],\n        [\n          \"30fps\",\n          \"일반 속도의 손동작을 기록하는 연습값\",\n          \"빠른 동작을 느리게 보여주는 실습은 별도\"\n        ]\n      ],\n      \"blockId\": \"video-entry.frame-size-rate.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이 값은 모든 플랫폼에 공통인 의무 규격이나 화질 보장이 아닙니다. 카메라 앱에서 동영상 모드와 실제 표시되는 촬영값을 확인하세요. 제조사마다 설정 이름이 다르므로 ‘특정 메뉴를 세 번 누른다’는 식으로 경로를 만들어 쓰지 않습니다.\",\n      \"blockId\": \"video-entry.frame-size-rate.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"시험 촬영 재생\",\n      \"goal\": \"촬영값과 방향을 스스로 확인한다.\",\n      \"steps\": [\n        \"세로로 3초 시험 촬영합니다.\",\n        \"사진 앱에서 재생해 옆으로 누워 보이지 않는지 확인합니다.\",\n        \"파일 정보에서 확인 가능한 크기와 길이를 적습니다.\"\n      ],\n      \"expectedOutput\": \"재생되는 시험 파일과 확인값\",\n      \"checks\": [\n        \"확인되지 않은 프레임 값을 추정해 기록하지 않았는가?\",\n        \"원본부터 작은 글씨가 흐리지 않은가?\"\n      ],\n      \"blockId\": \"video-entry.frame-size-rate.b04\"\n    }\n  ]\n}\n","video-entry.window-light":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.window-light\",\n  \"pageNumber\": 5,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"종이의 색과 무늬가 보이는 자리\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"창에서 들어오는 부드러운 빛이 종이 옆면을 비추게 책상을 배치해보세요. 창을 정면 배경으로 두면 종이가 어둡게 보일 수 있습니다. 카메라를 움직이기 전에 종이의 방향을 조금 돌려 파란 무늬와 손 그림자가 어떻게 바뀌는지 비교합니다.\",\n      \"blockId\": \"video-entry.window-light.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"video-window-light\",\n      \"alt\": \"창 옆 책상에 종이를 놓고 빛의 옆 방향에서 휴대전화로 촬영하는 배치도\",\n      \"width\": 1467,\n      \"height\": 987,\n      \"caption\": \"교육용 배치도입니다. 실제 카메라 앱 화면이나 촬영 결과의 증거는 아닙니다.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"video-entry.window-light.b02\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"배경 정리\",\n          \"text\": \"책·종이·펜 외에 활동을 설명하지 않는 물건을 치웁니다. 밝은 무지 배경을 쓰면 종이와 손이 구분되는지 판단하기 쉽습니다.\",\n          \"output\": \"주제가 분명한 촬영 자리\"\n        },\n        {\n          \"title\": \"빛 비교\",\n          \"text\": \"같은 종이를 창 쪽과 반대쪽에서 각각 짧게 찍습니다. 파란 선과 손 그림자가 더 잘 보이는 쪽을 고릅니다.\",\n          \"output\": \"비교한 시험 장면 두 개\"\n        },\n        {\n          \"title\": \"흰 부분 검사\",\n          \"text\": \"종이가 너무 밝아 무늬가 사라지거나 너무 어두워 파란 선이 묻히는지 재생해봅니다.\",\n          \"output\": \"무늬가 보이는 밝기\"\n        }\n      ],\n      \"blockId\": \"video-entry.window-light.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이 실습은 조명 장비 구매를 전제로 하지 않습니다. 현재 자리에서 비교할 수 있는 방향과 거리를 바꾸는 데 집중하세요. 한 장면마다 빛을 크게 바꾸면 편집할 때 종이 색이 달라 보일 수 있으므로 같은 자리를 유지합니다.\",\n      \"blockId\": \"video-entry.window-light.b04\"\n    }\n  ]\n}\n","video-entry.steady-and-focused":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.steady-and-focused\",\n  \"pageNumber\": 6,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"손이 움직여도 카메라는 안정되게\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"종이를 움직이는 손과 카메라를 든 손이 함께 흔들리면 무엇을 보여주는지 따라가기 어렵습니다. 휴대전화를 안전한 받침에 기대거나 촬영을 도와줄 사람에게 부탁하세요. 책상 밖으로 떨어질 위치에 세워두지 않습니다.\",\n      \"blockId\": \"video-entry.steady-and-focused.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"video-shot-distances\",\n      \"alt\": \"재료가 모두 보이는 전체 장면, 손과 종이가 보이는 중간 장면, 파란 무늬가 보이는 가까운 장면\",\n      \"width\": 1467,\n      \"height\": 987,\n      \"caption\": \"거리마다 전달하는 정보가 달라집니다. 확대 수치를 외우기보다 화면에 무엇이 남는지 살펴보세요.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"video-entry.steady-and-focused.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"찍을 종이와 손이 있는 부분의 선명도를 미리보기에서 확인합니다. 가까이 다가갔더니 초점이 흐려지면 조금 물러나세요. 디지털 확대를 크게 하는 대신 촬영 거리와 종이 위치를 조절해 같은 구도를 비교합니다.\",\n      \"blockId\": \"video-entry.steady-and-focused.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"흔들림 점검\",\n      \"goal\": \"자막을 읽을 수 있을 만큼 안정된 장면을 만든다.\",\n      \"steps\": [\n        \"카메라를 고정한 상태로 손을 움직이며 5초 찍습니다.\",\n        \"재생하면서 책상 모서리와 책갈피가 함께 흔들리는지 봅니다.\",\n        \"흔들렸다면 받침을 바꾸고 다시 찍습니다.\"\n      ],\n      \"expectedOutput\": \"안정된 시험 장면 한 개\",\n      \"checks\": [\n        \"배경 전체가 불필요하게 움직이지 않는가?\",\n        \"손이 종이의 핵심 부분을 계속 가리지 않는가?\"\n      ],\n      \"blockId\": \"video-entry.steady-and-focused.b04\"\n    }\n  ]\n}\n","video-entry.shoot-materials":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.shoot-materials\",\n  \"pageNumber\": 7,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"첫 장면은 재료 전체\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"첫 장면에는 연노랑 종이와 파란 펜, 책이 함께 들어갑니다. 보는 사람이 활동에 쓸 물건을 한눈에 파악할 수 있도록 배치하세요. 책갈피는 화면 가운데 근처에 놓고 위나 아래에 짧은 제목이 들어갈 여유를 둡니다.\",\n      \"blockId\": \"video-entry.shoot-materials.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-materials\",\n      \"alt\": \"나무 책상 위의 연노랑 종이, 파란 펜, 크림색 책\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"caption\": \"촬영할 재료 배치의 학습용 예시입니다.\",\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\",\n      \"blockId\": \"video-entry.shoot-materials.b02\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"동작 없이 시작\",\n          \"text\": \"휴대전화를 세로로 고정하고 재료가 모두 보이는지 살핍니다. 녹화를 시작한 직후 잠깐 기다려 손이 빠지는 시간을 남깁니다.\",\n          \"output\": \"편집할 앞부분 여유\"\n        },\n        {\n          \"title\": \"10초 안팎 촬영\",\n          \"text\": \"재료를 보여주는 장면을 유지합니다. 이 촬영 길이는 완성본에서 안정된 6초를 고르기 위한 작업 예산입니다.\",\n          \"output\": \"첫 장면 원본\"\n        },\n        {\n          \"title\": \"바로 재생\",\n          \"text\": \"영상의 중간 6초 동안 재료가 가려지지 않는지 확인하고 01_materials라는 이름으로 구분합니다.\",\n          \"output\": \"사용할 첫 원본\"\n        }\n      ],\n      \"blockId\": \"video-entry.shoot-materials.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"종이 크기를 설명하려고 작은 자를 화면 끝에 넣을 필요는 없습니다. 이 영상의 목적은 모임 소개입니다. 재료와 완성 모습을 분명하게 보여주는 데 필요한 물건만 남겨보세요.\",\n      \"blockId\": \"video-entry.shoot-materials.b04\"\n    }\n  ]\n}\n","video-entry.shoot-making":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.shoot-making\",\n  \"pageNumber\": 8,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"무늬와 글씨를 나누어 찍기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"두 번째 장면은 파란 펜으로 무늬를 그리는 손, 세 번째는 짧은 글을 적는 손입니다. 두 동작을 한 장면에서 급하게 끝내면 편집할 때 잘라 쓸 여유가 적습니다. 같은 종이와 펜을 유지하고 동작을 나눠 촬영합니다.\",\n      \"blockId\": \"video-entry.shoot-making.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-drawing\",\n      \"alt\": \"성인의 손이 연노랑 종이에 파란 잎무늬를 그리는 가까운 장면\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"caption\": \"무늬가 만들어지는 부분을 손가락으로 가리지 않게 촬영해봅니다.\",\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\",\n      \"blockId\": \"video-entry.shoot-making.b02\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"그리기 장면\",\n          \"text\": \"종이의 빈 부분이 보이게 손을 놓습니다. 작은 잎무늬 하나를 천천히 그리며 10초 안팎 찍습니다.\",\n          \"output\": \"02_drawing 원본\"\n        },\n        {\n          \"title\": \"글쓰기 장면\",\n          \"text\": \"‘오늘 한 쪽’처럼 직접 만든 짧은 말을 적습니다. 다른 책의 문장을 옮기지 않아도 활동을 보여줄 수 있습니다.\",\n          \"output\": \"03_lettering 원본\"\n        },\n        {\n          \"title\": \"끊기는 위치 찾기\",\n          \"text\": \"재생하며 펜이 종이에서 떨어지는 순간을 살펴봅니다. 동작 끝의 여유를 남기면 다음 장면으로 연결하기 쉽습니다.\",\n          \"output\": \"고를 6초 구간 메모\"\n        }\n      ],\n      \"blockId\": \"video-entry.shoot-making.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진 예시의 글자와 실제 촬영한 글씨가 같아야 할 필요는 없습니다. 사진은 구도 설명용이고, 최종 영상에서는 본인이 실제로 만든 결과를 씁니다. 완성품이 바뀌었다면 뒤의 사용 장면도 같은 책갈피로 다시 찍습니다.\",\n      \"blockId\": \"video-entry.shoot-making.b04\"\n    }\n  ]\n}\n","video-entry.shoot-use-finish":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.shoot-use-finish\",\n  \"pageNumber\": 9,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"쓰임새와 완성 모습으로 마무리\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"네 번째 장면에서는 책갈피를 책 사이에 끼웁니다. 다섯 번째는 손을 뺀 뒤 책과 책갈피를 함께 보여줍니다. 보는 사람이 직접 만든 물건을 어디에 쓰는지 알아야 모임의 활동이 완결됩니다.\",\n      \"blockId\": \"video-entry.shoot-use-finish.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-in-book\",\n      \"alt\": \"책 사이로 연노랑 책갈피를 넣는 성인의 손\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"caption\": \"손을 움직이는 장면 뒤에 완성 모습을 보여줄 여유를 남깁니다.\",\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\",\n      \"blockId\": \"video-entry.shoot-use-finish.b02\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"끼우기 촬영\",\n          \"text\": \"책을 살짝 열고 책갈피를 천천히 끼웁니다. 책의 긴 본문이 주제가 되지 않게 거리와 방향을 정합니다.\",\n          \"output\": \"04_in-book 원본\"\n        },\n        {\n          \"title\": \"완성 장면 촬영\",\n          \"text\": \"손을 화면 밖으로 빼고 책갈피 윗부분을 보여줍니다. 신청 안내 자막을 읽을 시간을 생각해 정지된 화면을 유지합니다.\",\n          \"output\": \"05_finished 원본\"\n        },\n        {\n          \"title\": \"연속성 비교\",\n          \"text\": \"앞 장면과 종이 색·무늬·책이 같은지 확인합니다. 같은 활동의 과정으로 보이면 다음 단계로 갑니다.\",\n          \"output\": \"연결 가능한 원본 다섯 개\"\n        }\n      ],\n      \"blockId\": \"video-entry.shoot-use-finish.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"마지막 장면에서 카메라를 크게 흔들며 끝내면 안내 문장을 읽기 어렵습니다. 촬영을 멈추는 손동작도 원본에 남을 수 있으므로 끝부분에 여유를 두고, 편집에서 안정된 구간만 골라 사용합니다.\",\n      \"blockId\": \"video-entry.shoot-use-finish.b04\"\n    }\n  ]\n}\n","video-entry.inspect-originals":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.inspect-originals\",\n  \"pageNumber\": 10,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"편집 전에 원본 다섯 개 검사\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"촬영한 자리에서 원본을 확인하면 다시 찍기 쉽습니다. 완성 영상을 만든 뒤 흐린 장면을 발견하면 순서와 자막을 다시 맞춰야 할 수 있습니다. 각 파일에서 사용할 6초를 찾고 시작·끝 시각을 메모하세요.\",\n      \"blockId\": \"video-entry.inspect-originals.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"설명용 원본 점검 예시\",\n      \"columns\": [\n        \"파일\",\n        \"원본 길이 예시\",\n        \"사용 구간 예시\",\n        \"판단\"\n      ],\n      \"rows\": [\n        [\n          \"01_materials\",\n          \"10초\",\n          \"2~8초\",\n          \"손이 빠진 뒤 재료가 보임\"\n        ],\n        [\n          \"02_drawing\",\n          \"10초\",\n          \"1~7초\",\n          \"무늬와 펜 끝이 보임\"\n        ],\n        [\n          \"03_lettering\",\n          \"10초\",\n          \"2~8초\",\n          \"글 적는 동작이 끊기지 않음\"\n        ],\n        [\n          \"04_in-book\",\n          \"10초\",\n          \"1~7초\",\n          \"끼우는 동작과 결과가 이어짐\"\n        ],\n        [\n          \"05_finished\",\n          \"10초\",\n          \"2~8초\",\n          \"제목 없이도 완성품이 보임\"\n        ]\n      ],\n      \"blockId\": \"video-entry.inspect-originals.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"위 길이와 구간은 계산을 설명하기 위한 예시입니다. 자신의 파일이 9초라면 그 안에서 6초를 고릅니다. 안정된 구간이 3초뿐이라면 속도를 억지로 늦추기 전에 다시 찍거나 편집 연습용 사진으로 대체할지 정하세요.\",\n      \"blockId\": \"video-entry.inspect-originals.b03\"\n    },\n    {\n      \"type\": \"checklist\",\n      \"items\": [\n        \"다섯 파일을 실제로 재생했다.\",\n        \"각 파일에서 사용할 구간을 정했다.\",\n        \"개인정보·상점 음악·다른 사람 목소리 등 불필요한 내용이 있는지 들었다.\",\n        \"사진을 썼다면 사진 영상임을 기록했다.\"\n      ],\n      \"blockId\": \"video-entry.inspect-originals.b04\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"다음 단계로 가는 기준\",\n      \"text\": \"다섯 장면에서 모두 사용할 부분을 확보했으면 편집을 시작합니다. 한 장면이라도 대상이 안 보이거나 파일이 열리지 않으면 그 원본부터 다시 준비하세요.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.inspect-originals.b05\"\n    }\n  ]\n}\n","video-entry.capcut-free-boundary":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.capcut-free-boundary\",\n  \"pageNumber\": 11,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"CapCut 설치와 무료 경로\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"공식 Android 앱 이름은 CapCut - Video Editor, 개발사는 Bytedance Pte. Ltd.입니다. 아래 Google Play 링크에서 확인합니다. 이 실습은 본인 소재, 기본 분할, 수동 글자, 직접 녹음한 소리를 중심으로 구성하며 유료 템플릿·AI 생성·유료 음악을 필수로 쓰지 않습니다.\",\n      \"blockId\": \"video-entry.capcut-free-boundary.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"무료로 진행하기 위한 선택\",\n      \"columns\": [\n        \"작업\",\n        \"이 샘플의 선택\",\n        \"결제 표시가 보이면\"\n      ],\n      \"rows\": [\n        [\n          \"영상 소재\",\n          \"직접 촬영 또는 제공 사진\",\n          \"유료 스톡·템플릿을 넣지 않음\"\n        ],\n        [\n          \"자막\",\n          \"Text → Add Text로 수동 입력\",\n          \"Pro 글꼴·스타일을 기본 형태로 교체\"\n        ],\n        [\n          \"음악\",\n          \"직접 녹음한 소리 또는 무음\",\n          \"유료·권리 미확인 음악 제거\"\n        ],\n        [\n          \"출력\",\n          \"1080p·30fps를 목표로 화면 확인\",\n          \"유료 요소 제거 후 조건 재확인\"\n        ]\n      ],\n      \"blockId\": \"video-entry.capcut-free-boundary.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"공식 도움말은 Pro 요소가 들어 있으면 출력에 구독이 필요할 수 있다고 설명합니다. Standard와 Pro는 구독 설명에 쓰이는 이름이며 Standard를 무료 요금제라고 단정하지 않습니다. 무료 체험 가입도 이번 실습의 필수 단계가 아닙니다.\",\n      \"blockId\": \"video-entry.capcut-free-boundary.b03\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"확인 상태\",\n      \"text\": \"공식 앱·영문 문서 확인일은 2026-11-06입니다. 한국 계정의 현재 한국어 화면, 앱 버전, 무료 출력·워터마크 조건은 Android 실기에서 확인하지 못했습니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.capcut-free-boundary.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"CapCut - Video Editor 공식 Android 앱\",\n          \"url\": \"https://play.google.com/store/apps/details?hl=ko&id=com.lemon.lvoverseas\",\n          \"publisher\": \"Bytedance Pte. Ltd. / Google Play\"\n        },\n        {\n          \"title\": \"What's the Difference Between CapCut Standard and CapCut Pro Subscription\",\n          \"url\": \"https://www.capcut.com/help/capcut-standard-vs-pro\",\n          \"publisher\": \"CapCut\"\n        },\n        {\n          \"title\": \"Why Am I Prompted to Join CapCut Pro When Exporting?\",\n          \"url\": \"https://www.capcut.com/help/capcut-pro-export-prompt\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.capcut-free-boundary.b05\"\n    }\n  ]\n}\n","video-entry.new-project":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.new-project\",\n  \"pageNumber\": 12,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"새 프로젝트에 소재 가져오기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"프로젝트는 어떤 원본의 어느 부분을 어떤 순서로 쓸지 저장하는 편집 작업입니다. 완성 동영상 파일과 구분하세요. 공식 모바일 안내에 적힌 경로는 New project → 소재 선택 → Add입니다. 영문 메뉴명 뒤의 한국어 설명은 뜻을 돕기 위한 것이며 실제 한국어 버튼 표기를 확인한 것은 아닙니다.\",\n      \"blockId\": \"video-entry.new-project.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"새 작업 시작\",\n          \"text\": \"CapCut의 New project(새 프로젝트 만들기)를 선택합니다. 템플릿 적용이나 AI 자동 생성으로 시작하지 않습니다.\",\n          \"output\": \"소재 선택 단계\"\n        },\n        {\n          \"title\": \"다섯 원본 선택\",\n          \"text\": \"재료, 그리기, 글쓰기, 끼우기, 완성 순서로 준비한 원본을 선택합니다. 사진 연습 경로라면 같은 순서의 사진 다섯 장을 고릅니다.\",\n          \"output\": \"선택한 소재 다섯 개\"\n        },\n        {\n          \"title\": \"가져오기\",\n          \"text\": \"공식 문서의 Add(추가)에 해당하는 동작을 실행합니다. 편집 화면에 다섯 장면이 들어왔는지 확인합니다.\",\n          \"output\": \"타임라인에 들어온 장면\"\n        }\n      ],\n      \"blockId\": \"video-entry.new-project.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진 접근 권한 때문에 파일이 보이지 않는다면 필요한 원본에 접근할 수 있는지 기기의 권한 설명을 확인합니다. 원본을 지우거나 앱 데이터를 초기화할 필요는 없습니다. 들어온 장면의 순서가 달라도 다음 쪽에서 바로잡을 수 있습니다.\",\n      \"blockId\": \"video-entry.new-project.b03\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"메뉴 근거\",\n      \"text\": \"영문 공식 모바일 안내 확인 / 한국어 Android 실행 미검증. 메뉴가 다르면 현재 화면의 기능 설명과 공식 도움말을 대조하고, 확인하지 못한 단계는 실행 기록에 남깁니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.new-project.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Create Instagram Reels with the CapCut mobile app\",\n          \"url\": \"https://www.capcut.com/resource/best-reel-videos\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.new-project.b05\"\n    }\n  ]\n}\n","video-entry.timeline-order":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.timeline-order\",\n  \"pageNumber\": 13,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"타임라인은 재생 순서표\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"타임라인은 화면과 소리가 언제 시작하고 끝나는지 보여주는 편집 줄입니다. 왼쪽부터 재생 순서가 이어지고, 현재 위치를 가리키는 선을 재생 헤드라고 부릅니다. 장면 하나를 눌렀을 때 선택 표시가 그 장면에 있는지 확인하고 수정하세요.\",\n      \"blockId\": \"video-entry.timeline-order.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"video-timeline-30s\",\n      \"alt\": \"0·6·12·18·24·30초 경계에 재료, 그리기, 글쓰기, 끼우기, 완성 장면이 놓인 시간선\",\n      \"width\": 1467,\n      \"height\": 1040,\n      \"caption\": \"교육용 시간선입니다. CapCut 화면을 촬영한 이미지가 아닙니다.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"video-entry.timeline-order.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"공식 모바일 안내는 장면을 드래그해 순서를 바꾸는 방법을 설명합니다. 잘못 들어온 장면을 이동한 뒤 첫 장면부터 재생해 실제 순서를 확인하세요. 화면 아래의 텍스트 줄은 장면 자체와 별개일 수 있으므로 사진·동영상 줄과 혼동하지 않습니다.\",\n      \"blockId\": \"video-entry.timeline-order.b03\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"작업 중 확인할 것\",\n      \"columns\": [\n        \"확인 대상\",\n        \"정상 결과\"\n      ],\n      \"rows\": [\n        [\n          \"장면 순서\",\n          \"재료 → 그리기 → 글쓰기 → 끼우기 → 완성\"\n        ],\n        [\n          \"선택 대상\",\n          \"고칠 장면에 선택 표시가 있음\"\n        ],\n        [\n          \"전체 흐름\",\n          \"같은 종이와 책의 제작 과정으로 읽힘\"\n        ]\n      ],\n      \"blockId\": \"video-entry.timeline-order.b04\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"중간 점검\",\n      \"goal\": \"다섯 장면이 모두 있는지 확인한다.\",\n      \"steps\": [\n        \"아직 자막을 넣지 않은 상태로 재생합니다.\",\n        \"다섯 장면의 이름을 순서대로 말합니다.\"\n      ],\n      \"expectedOutput\": \"빠짐없이 정렬된 다섯 장면\",\n      \"checks\": [\n        \"순서가 바뀌면 이 단계에서 바로잡았는가?\",\n        \"같은 장면을 잘못 두 번 넣지 않았는가?\"\n      ],\n      \"blockId\": \"video-entry.timeline-order.b05\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Create Instagram Reels with the CapCut mobile app\",\n          \"url\": \"https://www.capcut.com/resource/best-reel-videos\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.timeline-order.b06\"\n    }\n  ]\n}\n","video-entry.trim-six-seconds":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.trim-six-seconds\",\n  \"pageNumber\": 14,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"각 장면을 6초로 다듬기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"앞뒤 불필요한 부분을 줄이는 작업을 트리밍이라고 합니다. 원본에서 시작과 끝을 정하면 필요한 순간만 남길 수 있습니다. 첫 원본의 길이가 10초이고 2~8초를 사용한다면 남는 길이는 8−2=6초입니다. 원본 길이와 완성본 길이를 따로 생각하세요.\",\n      \"blockId\": \"video-entry.trim-six-seconds.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"video-trim-vs-split\",\n      \"alt\": \"10초 원본에서 앞 2초와 뒤 2초를 제외해 6초를 쓰는 그림과 가운데를 두 조각으로 나누는 그림\",\n      \"width\": 1467,\n      \"height\": 1067,\n      \"caption\": \"트리밍은 사용하는 범위를 줄이고, 분할은 한 장면을 여러 조각으로 나눕니다.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"video-entry.trim-six-seconds.b02\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"사용 구간 선택\",\n          \"text\": \"10쪽에 적은 원본 구간을 기준으로 앞뒤를 줄입니다. 앱에 표시되는 시작·끝과 재생 결과를 함께 확인합니다.\",\n          \"output\": \"첫 장면 6초\"\n        },\n        {\n          \"title\": \"다섯 장면 정리\",\n          \"text\": \"다른 장면도 필요한 동작이 남는 6초로 정리합니다. 사진을 사용한다면 사진 한 장의 표시 시간을 6초로 맞춥니다.\",\n          \"output\": \"5장면의 길이\"\n        },\n        {\n          \"title\": \"합계 확인\",\n          \"text\": \"끝 시각이 30초인지 확인합니다. 6×5=30초입니다. 추가된 엔딩이나 빈 구간이 있으면 원인을 살핍니다.\",\n          \"output\": \"30초 길이의 편집\"\n        }\n      ],\n      \"blockId\": \"video-entry.trim-six-seconds.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"공식 모바일 자료는 Split과 Delete를 이용해 불필요한 구간을 빼는 방법을 설명합니다. 현재 화면에서 끝부분을 조절하기 어렵다면 다음 쪽의 분할 절차로 구간을 나누어 제거합니다. 정확한 한국어 버튼 위치는 실기 확인 전까지 고정하지 않습니다.\",\n      \"blockId\": \"video-entry.trim-six-seconds.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Create Instagram Reels with the CapCut mobile app\",\n          \"url\": \"https://www.capcut.com/resource/best-reel-videos\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.trim-six-seconds.b05\"\n    }\n  ]\n}\n","video-entry.split-and-recover":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.split-and-recover\",\n  \"pageNumber\": 15,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"분할과 삭제를 구분하기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"분할은 장면을 두 조각으로 나누는 동작입니다. 나누었다고 어느 부분이 자동으로 사라지는 것은 아닙니다. 필요 없는 조각을 확인한 뒤 삭제합니다. 잘못된 장면을 없애지 않도록 선택 표시와 미리보기를 함께 보세요.\",\n      \"blockId\": \"video-entry.split-and-recover.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"경계 정하기\",\n          \"text\": \"대상 장면을 선택하고 남길 구간의 시작점에 재생 위치를 맞춥니다. 공식 모바일 문서의 Split(분할)을 사용합니다.\",\n          \"output\": \"앞 조각과 뒤 조각\"\n        },\n        {\n          \"title\": \"남길 구간 분리\",\n          \"text\": \"남길 구간의 끝에서도 나누면 앞·가운데·뒤 세 조각이 됩니다. 가운데가 원하는 6초인지 재생합니다.\",\n          \"output\": \"보존할 조각 확인\"\n        },\n        {\n          \"title\": \"불필요한 조각 삭제\",\n          \"text\": \"앞뒤에서 필요 없는 조각을 하나씩 선택해 Delete(삭제)합니다. 남은 장면의 앞뒤를 재생하며 연결을 확인합니다.\",\n          \"output\": \"의도한 구간만 남은 장면\"\n        }\n      ],\n      \"blockId\": \"video-entry.split-and-recover.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"실수했다면 현재 화면의 실행 취소 기능을 확인해 바로 되돌립니다. 실행 취소로 복원할 수 없으면 보관한 원본을 다시 가져와 해당 장면만 정리합니다. 편집 화면에서 조각을 삭제하는 일과 휴대전화에서 원본 파일을 삭제하는 일은 구분해야 합니다.\",\n      \"blockId\": \"video-entry.split-and-recover.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"분할 후 남을 길이 계산\",\n      \"goal\": \"남긴 구간의 길이를 계산한다.\",\n      \"steps\": [\n        \"10초 원본을 2초와 8초에서 나눴다고 가정합니다.\",\n        \"가운데 조각의 길이와 나머지 두 조각의 길이를 적습니다.\"\n      ],\n      \"expectedOutput\": \"가운데 6초, 앞 2초, 뒤 2초\",\n      \"checks\": [\n        \"분할만 하면 6초 파일이 저장된다고 생각하지 않았는가?\"\n      ],\n      \"solution\": \"분할 후 가운데 6초를 사용하고 필요 없는 조각을 빼야 합니다. 파일 저장은 내보내기 단계에서 합니다.\",\n      \"blockId\": \"video-entry.split-and-recover.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Create Instagram Reels with the CapCut mobile app\",\n          \"url\": \"https://www.capcut.com/resource/best-reel-videos\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.split-and-recover.b05\"\n    }\n  ]\n}\n","video-entry.manual-captions":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.manual-captions\",\n  \"pageNumber\": 16,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"자막 다섯 개를 직접 입력\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"말이 없는 장면에도 행사 정보를 설명하는 글을 넣을 수 있습니다. 이 과제는 수동 입력을 사용합니다. 공식 모바일 도움말의 경로는 Text → Add Text입니다. 화면에 들어갈 문장을 직접 적고 각 문장이 나타나는 시간을 맞춥니다.\",\n      \"blockId\": \"video-entry.manual-captions.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"첫 글자 넣기\",\n          \"text\": \"Text(글자) → Add Text(글자 추가)에서 ‘토요일 책갈피 만들기’를 입력합니다. 첫 장면의 0~6초 동안 보이게 조정합니다.\",\n          \"output\": \"첫 제목 자막\"\n        },\n        {\n          \"title\": \"나머지 네 문장 입력\",\n          \"text\": \"3쪽 시간표의 문장을 한 개씩 넣습니다. 다음 문장이 시작할 때 이전 문장이 겹쳐 남지 않는지 확인합니다.\",\n          \"output\": \"다섯 개의 안내 자막\"\n        },\n        {\n          \"title\": \"연습 표시 유지\",\n          \"text\": \"‘연습용 · 실제 모집 아님’을 별도 글자로 넣어 0~30초에 걸쳐 보이게 합니다. 핵심 활동을 가리지 않는 위치를 고릅니다.\",\n          \"output\": \"전 구간에 남는 사례 표시\"\n        }\n      ],\n      \"blockId\": \"video-entry.manual-captions.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"공식 도움말은 현재 모바일 앱에서 SRT·TXT 자막 파일을 직접 가져오는 경로를 지원하지 않는다고 안내합니다. 제공 자막표는 직접 입력할 문장과 시간을 대조하는 자료입니다. PC의 파일 가져오기 경로를 모바일 버튼처럼 설명하지 않습니다.\",\n      \"blockId\": \"video-entry.manual-captions.b03\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"직접 입력을 쓰는 이유\",\n      \"text\": \"자동 자막은 음성을 인식하는 기능입니다. 이 사례의 날짜·정원·신청 안내를 정확하게 넣는 일은 직접 입력과 대조로 마칠 수 있습니다. 유료 자동 자막이나 AI 음성은 필수로 쓰지 않습니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.manual-captions.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"How Do I Import Subtitles?\",\n          \"url\": \"https://www.capcut.com/help/how-to-import-subtitles\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.manual-captions.b05\"\n    }\n  ]\n}\n","video-entry.caption-reading":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.caption-reading\",\n  \"pageNumber\": 17,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"휴대전화에서 자막을 읽어보기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"편집 화면을 확대하면 잘 보이는 글도 실제 세로 재생에서는 작을 수 있습니다. 휴대전화를 평소 보는 거리로 두고 영상을 재생하세요. 배경과 글자 색이 섞이지 않고, 장면이 넘어가기 전에 한 번 읽을 수 있는지 확인합니다.\",\n      \"blockId\": \"video-entry.caption-reading.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"video-caption-legibility\",\n      \"alt\": \"밝은 종이 위의 작은 흰 글씨와 어두운 바탕을 둔 큰 두 줄 글씨의 비교\",\n      \"width\": 1467,\n      \"height\": 987,\n      \"caption\": \"이번 과제의 비교 예시입니다. 읽히지 않는 글자는 크기·배경·문장 길이를 함께 조정합니다.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"video-entry.caption-reading.b02\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"발견한 문제와 수정\",\n      \"columns\": [\n        \"문제\",\n        \"수정 방향\"\n      ],\n      \"rows\": [\n        [\n          \"종이와 글자가 같은 밝기\",\n          \"글자 뒤에 단순한 고대비 배경 또는 윤곽 사용\"\n        ],\n        [\n          \"한 줄이 너무 김\",\n          \"뜻이 나뉘는 곳에서 두 줄로 정리\"\n        ],\n        [\n          \"화면 끝에 붙음\",\n          \"가장자리와 핵심 동작을 피해 안쪽으로 이동\"\n        ],\n        [\n          \"마지막 글자가 잘림\",\n          \"실제 재생 화면에서 위치와 크기 재조정\"\n        ]\n      ],\n      \"blockId\": \"video-entry.caption-reading.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"원고의 시간·준비물·정원을 소리 내어 읽고 사실 카드와 맞춰보세요. 수정할 때는 텍스트 줄을 선택해야 합니다. CapCut 공식 도움말은 Text에서 대상 텍스트 트랙을 선택한 뒤 내용을 고치는 방법을 설명합니다.\",\n      \"blockId\": \"video-entry.caption-reading.b04\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"무음 재생 점검\",\n      \"goal\": \"소리 없이 핵심 안내를 이해한다.\",\n      \"steps\": [\n        \"소리를 끄고 30초를 봅니다.\",\n        \"날짜·시간·책 1권·6명·무료를 찾아 적습니다.\"\n      ],\n      \"expectedOutput\": \"다섯 정보가 읽히는 자막\",\n      \"checks\": [\n        \"작은 글씨를 오래 바라봐야만 읽히지 않는가?\",\n        \"연습용 표시가 사라지는 구간은 없는가?\"\n      ],\n      \"blockId\": \"video-entry.caption-reading.b05\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Why Can't I Edit or Modify the Text?\",\n          \"url\": \"https://www.capcut.com/help/edit-the-text\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.caption-reading.b06\"\n    }\n  ]\n}\n","video-entry.own-sound":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.own-sound\",\n  \"pageNumber\": 18,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"소리를 한 가지 기준으로 정하기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이번 기본 결과물은 직접 녹음한 소리 또는 의도한 무음으로 완성합니다. 펜이 종이에 닿는 소리처럼 활동과 연결되는 소리는 남길 수 있습니다. 배경의 상점 음악이나 다른 사람의 대화가 함께 들어갔다면 해당 부분을 다시 촬영하거나 소리를 제거하는 선택을 합니다.\",\n      \"blockId\": \"video-entry.own-sound.b01\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"선택 실습용 짧은 음성 원고\",\n      \"text\": \"연습용 책갈피 모임을 소개합니다.\\n종이에 무늬와 짧은 글을 적어보세요.\\n읽던 책에 끼우면 작은 책갈피가 됩니다.\\n이 영상은 실제 모집 안내가 아닙니다.\",\n      \"blockId\": \"video-entry.own-sound.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"직접 설명을 더하고 싶다면 공식 모바일 글에서 안내하는 Record audio 기능을 찾습니다. 조용한 자리에서 한 문장씩 말하고 녹음 뒤 바로 재생하세요. 현재 앱의 한국어 이름·입구·권한 요청은 실제 화면을 확인해야 하며 이 샘플에서는 실행하지 못했습니다.\",\n      \"blockId\": \"video-entry.own-sound.b03\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"원래 소리 듣기\",\n          \"text\": \"다섯 장면의 원본 소리를 듣고 유지·제거할 부분을 적습니다.\",\n          \"output\": \"소리 사용 메모\"\n        },\n        {\n          \"title\": \"선택한 소리만 남기기\",\n          \"text\": \"말소리가 있다면 내용이 들리도록 조정하고 장면마다 갑자기 커지지 않는지 이어서 듣습니다. 고정된 음량 숫자를 정답으로 쓰지 않습니다.\",\n          \"output\": \"들어본 30초 편집\"\n        },\n        {\n          \"title\": \"선택 기록\",\n          \"text\": \"사진 영상에 녹음을 넣지 않았다면 ‘의도한 무음’이라고 기록합니다. 재생하지 않은 음성을 검수 완료로 쓰지 않습니다.\",\n          \"output\": \"소리 검사 상태\"\n        }\n      ],\n      \"blockId\": \"video-entry.own-sound.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Adding Voiceovers with CapCut — Record audio\",\n          \"url\": \"https://www.capcut.com/resource/how-to-add-voice-in-a-video\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.own-sound.b05\"\n    }\n  ]\n}\n","video-entry.music-permission":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.music-permission\",\n  \"pageNumber\": 19,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"음악이 무료여도 용도를 확인\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"음악을 누를 수 있다는 사실과 외부에 올려도 되는 이용허락은 구분해야 합니다. 이 기본 과제는 음악 없이도 끝낼 수 있습니다. 음악을 추가하는 선택 실습에서는 곡별 허용 용도·게시 플랫폼·저작자 표시 조건을 읽고 근거를 보관하세요.\",\n      \"blockId\": \"video-entry.music-permission.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"공식 안내에서 확인한 구분\",\n      \"columns\": [\n        \"자료\",\n        \"확인할 조건\"\n      ],\n      \"rows\": [\n        [\n          \"CapCut Sounds\",\n          \"개인 오락·비상업적 이용 조건\"\n        ],\n        [\n          \"CapCut Commercial Sounds\",\n          \"약관에 열거된 CapCut·TikTok·TikTok for Business 밖의 이용은 별도 권리 확인\"\n        ],\n        [\n          \"YouTube 오디오 보관함\",\n          \"트랙별 저작자 표시 조건, YouTube 외 사용의 별도 확인\"\n        ],\n        [\n          \"직접 녹음\",\n          \"내가 만든 소리인지, 배경에 다른 음악·대화가 들어갔는지\"\n        ]\n      ],\n      \"blockId\": \"video-entry.music-permission.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"CapCut의 2026-01-22 소재 약관을 기준으로 정리했습니다. 공식 홍보 글의 ‘copyright-free’ 한 문장만으로 Instagram이나 YouTube에서도 모든 음악을 제한 없이 쓸 수 있다고 판단하지 않습니다. 실제로 사용할 곡과 계정에 적용되는 약관을 다시 확인하세요.\",\n      \"blockId\": \"video-entry.music-permission.b03\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"음악 사용 기록\",\n      \"text\": \"곡명·제작자:\\n받은 곳과 원문 링크:\\n확인일:\\n허용 용도·게시 플랫폼:\\n필요한 출처 문구:\\n이번 영상에 사용 / 사용하지 않음:\",\n      \"blockId\": \"video-entry.music-permission.b04\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"음악 선택 판단\",\n      \"goal\": \"허용 범위가 불명확할 때 다음 행동을 정한다.\",\n      \"steps\": [\n        \"무료로 보이는 곡의 외부 게시 조건을 찾지 못했다고 가정합니다.\",\n        \"이번 과제를 마칠 방법을 적습니다.\"\n      ],\n      \"expectedOutput\": \"음악을 빼고 직접 녹음 또는 무음으로 완성\",\n      \"checks\": [\n        \"무료라는 이유로 외부 사용 가능을 단정하지 않았는가?\"\n      ],\n      \"blockId\": \"video-entry.music-permission.b05\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"CapCut Materials License Agreement\",\n          \"url\": \"https://www.capcut.com/clause/material-license-agreement?lang=en\",\n          \"publisher\": \"CapCut / ByteDance Pte. Ltd.\"\n        },\n        {\n          \"title\": \"오디오 보관함에 있는 음악 및 음향 효과 사용하기\",\n          \"url\": \"https://support.google.com/youtube/answer/3376882?hl=ko\",\n          \"publisher\": \"Google / YouTube\"\n        }\n      ],\n      \"blockId\": \"video-entry.music-permission.b06\"\n    }\n  ]\n}\n","video-entry.export-file":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.export-file\",\n  \"pageNumber\": 20,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"편집 결과를 파일로 내보내기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"내보내기는 편집 순서와 글자·소리를 실제 재생 파일로 만드는 단계입니다. 공식 모바일 안내는 Export에서 해상도를 선택해 기기에 저장하는 흐름을 설명합니다. 이 과제는 30초·세로 9:16을 유지하고 1080p·30fps를 목표로 삼습니다. 실제 설정 제공 여부는 화면에서 확인합니다.\",\n      \"blockId\": \"video-entry.export-file.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"내보내기 전 재생\",\n          \"text\": \"처음과 끝뿐 아니라 6·12·18·24초의 장면 전환을 봅니다. 자막이 다음 장면까지 잘못 남아 있는지 확인합니다.\",\n          \"output\": \"출력 전 점검\"\n        },\n        {\n          \"title\": \"Export 열기\",\n          \"text\": \"표시되는 해상도·프레임·기타 조건을 읽습니다. Pro나 결제 요구가 나오면 유료 요소를 제거하고 조건을 다시 확인합니다.\",\n          \"output\": \"실제로 선택한 출력값\"\n        },\n        {\n          \"title\": \"완료 파일 찾기\",\n          \"text\": \"출력 완료 뒤 휴대전화의 사진·파일 앱에서 결과를 찾고 재생합니다. 앱 안의 프로젝트 목록만 보고 출력되었다고 판단하지 않습니다.\",\n          \"output\": \"재생 가능한 최종 파일\"\n        }\n      ],\n      \"blockId\": \"video-entry.export-file.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"파일 이름은 bookmark_30s_v01처럼 버전을 붙여 원본과 구분합니다. 출력 형식은 실제 저장된 파일 정보로 확인하고, MP4가 아닐 때 확장자만 바꾸지 않습니다. 화면에서 지원하는 형식이나 별도 변환의 필요성을 확인하세요.\",\n      \"blockId\": \"video-entry.export-file.b03\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"무료 출력의 경계\",\n      \"text\": \"공식 문서는 유료 요소 제거를 안내하지만 계정·지역·버전에 따른 출력·워터마크 설명 차이가 있습니다. 이번 Android 환경에서 무료·무워터마크 출력을 검증했다고 표시하지 않습니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.export-file.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"CapCut Tutorial for Beginners — mobile phone section\",\n          \"url\": \"https://www.capcut.com/resource/capcut-tutorial-for-beginners\",\n          \"publisher\": \"CapCut\"\n        },\n        {\n          \"title\": \"Why Am I Prompted to Join CapCut Pro When Exporting?\",\n          \"url\": \"https://www.capcut.com/help/capcut-pro-export-prompt\",\n          \"publisher\": \"CapCut\"\n        },\n        {\n          \"title\": \"CapCut Pro export conditions by platform\",\n          \"url\": \"https://www.capcut.com/help/join-capcut-pro-for-exporting\",\n          \"publisher\": \"CapCut\"\n        }\n      ],\n      \"blockId\": \"video-entry.export-file.b05\"\n    }\n  ]\n}\n","video-entry.finished-reference":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.finished-reference\",\n  \"pageNumber\": 21,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"완성본과 대조할 30초 기준표\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"아래 표는 완성 파일을 검사할 때 사용할 기준입니다. 시간표를 작성한 것과 실제 동영상을 출력한 것은 다릅니다. 자신의 결과를 재생하면서 각 구간의 장면과 자막을 대조하고, 사진 영상이라면 그 형식을 결과물 설명에 적습니다.\",\n      \"blockId\": \"video-entry.finished-reference.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"최종 30초의 장면·자막\",\n      \"columns\": [\n        \"시간\",\n        \"화면\",\n        \"안내 문장\"\n      ],\n      \"rows\": [\n        [\n          \"00:00~00:06\",\n          \"재료 전체\",\n          \"토요일 책갈피 만들기\"\n        ],\n        [\n          \"00:06~00:12\",\n          \"무늬를 그리는 손\",\n          \"11월 14일(토)\\n14:00~15:00\"\n        ],\n        [\n          \"00:12~00:18\",\n          \"책갈피에 글을 적는 손\",\n          \"종이·파란 펜 제공\\n읽던 책 1권 준비\"\n        ],\n        [\n          \"00:18~00:24\",\n          \"책 사이에 끼우기\",\n          \"정원 6명\\n참가비 무료\"\n        ],\n        [\n          \"00:24~00:30\",\n          \"책과 완성 책갈피\",\n          \"신청 안내 문구 연습\\n계정 메시지 ‘책갈피’\"\n        ]\n      ],\n      \"blockId\": \"video-entry.finished-reference.b02\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"영상 설명문 완성 예시\",\n      \"text\": \"[교육용 자체 기획 · 실제 모집 아님]\\n‘토요일 책갈피 만들기’를 소개하는 30초 편집 연습입니다.\\n연습 설정: 2026-11-14(토) 14:00~15:00\\n장소: 부산의 동네 모임 공간(연습용 가상 장소)\\n정원 6명 · 참가비 무료\\n연노랑 종이·파란 펜 제공, 읽던 책 1권 준비.\\n신청 안내 문구는 계정 메시지로 ‘책갈피’를 보내는 방식으로 연습했습니다. 실제 신청을 받지 않습니다.\\n사용 소재가 직접 촬영인지 학습용 제작 사진인지 실제 작업에 맞게 표시합니다.\",\n      \"blockId\": \"video-entry.finished-reference.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"소리를 쓰지 않았다면 마지막 문장에 ‘소리 없이 보는 사진 영상’처럼 실제 상태를 덧붙입니다. 직접 촬영했다면 ‘직접 촬영한 다섯 장면’이라고 설명할 수 있습니다. 생성 사진을 움직이는 실제 촬영물로 소개하지 않습니다.\",\n      \"blockId\": \"video-entry.finished-reference.b04\"\n    }\n  ]\n}\n","video-entry.troubleshooting":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.troubleshooting\",\n  \"pageNumber\": 22,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"막힌 원인에 맞춰 돌아가기\",\n  \"blocks\": [\n    {\n      \"type\": \"table\",\n      \"caption\": \"자주 생기는 문제와 복구\",\n      \"columns\": [\n        \"증상\",\n        \"확인\",\n        \"돌아갈 단계\"\n      ],\n      \"rows\": [\n        [\n          \"장면이 검게 나오거나 열리지 않음\",\n          \"원본이 사진 앱에서 열리는지\",\n          \"원본 보관 위치 확인 후 해당 장면 다시 가져오기\"\n        ],\n        [\n          \"글자를 눌러도 수정되지 않음\",\n          \"대상 텍스트 줄을 선택했는지\",\n          \"Text에서 해당 텍스트 트랙 선택\"\n        ],\n        [\n          \"30초보다 길어짐\",\n          \"추가 엔딩·빈 구간·장면 길이\",\n          \"각 6초와 마지막 시각 재확인\"\n        ],\n        [\n          \"출력 중 Pro 가입 요구\",\n          \"유료 소재·효과·글꼴·출력 옵션\",\n          \"해당 요소 제거·기본 형태로 교체\"\n        ],\n        [\n          \"출력 파일이 안 보임\",\n          \"완료 표시와 기기 저장 결과\",\n          \"프로젝트 보존 후 저장 위치·기기 여유 공간 확인\"\n        ]\n      ],\n      \"blockId\": \"video-entry.troubleshooting.b01\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"문제를 해결하려고 앱 데이터를 지우거나 앱을 삭제하면 로컬 프로젝트가 사라질 수 있다고 CapCut은 안내합니다. 원본과 작업 상태를 보존한 채 작은 부분부터 확인하세요. 출력을 못 했다면 ‘편집 완료·출력 미완료’로 상태를 나누어 적습니다.\",\n      \"blockId\": \"video-entry.troubleshooting.b02\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"결제 없이 검토할 대안\",\n      \"text\": \"유료 요소를 제거해도 막히면 원본을 보존하고 무료 편집 앱인 YouTube Create를 검토할 수 있습니다. 공식 Android 경로는 로그인 → 홈 더하기 → 미디어 선택 → 가져오기이며, 저장은 프로젝트 더보기 → 내보내기 → 화질 → 내보내기입니다. 세부 편집은 해당 앱 도움말을 따라 다시 해야 하며 CapCut 프로젝트가 그대로 이전된다고 가정하지 않습니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"video-entry.troubleshooting.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"대체 앱의 설치 가능 기기와 국가 조건, 실제 출력도 확인해야 합니다. 이 샘플에서 그 Android 실행을 대신 완료한 것은 아닙니다. 음악을 쓰지 않은 원본을 유지하면 앱을 옮길 때 음악 라이선스와 저장 제한을 함께 떠안지 않아도 됩니다.\",\n      \"blockId\": \"video-entry.troubleshooting.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Why Can't I Edit or Modify the Text?\",\n          \"url\": \"https://www.capcut.com/help/edit-the-text\",\n          \"publisher\": \"CapCut\"\n        },\n        {\n          \"title\": \"Why Am I Prompted to Join CapCut Pro When Exporting?\",\n          \"url\": \"https://www.capcut.com/help/capcut-pro-export-prompt\",\n          \"publisher\": \"CapCut\"\n        },\n        {\n          \"title\": \"YouTube Create 자세히 알아보기\",\n          \"url\": \"https://support.google.com/youtube/answer/13521392?hl=ko\",\n          \"publisher\": \"Google / YouTube\"\n        },\n        {\n          \"title\": \"YouTube Create로 프로젝트 시작 또는 관리하기\",\n          \"url\": \"https://support.google.com/youtube/answer/13521789?hl=ko\",\n          \"publisher\": \"Google / YouTube\"\n        },\n        {\n          \"title\": \"YouTube Create로 동영상 미리보기, 업로드, 저장하기\",\n          \"url\": \"https://support.google.com/youtube/answer/13521602?co=GENIE.Platform%3DAndroid&hl=ko-KO\",\n          \"publisher\": \"Google / YouTube\"\n        }\n      ],\n      \"blockId\": \"video-entry.troubleshooting.b05\"\n    }\n  ]\n}\n","video-entry.playback-check":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.playback-check\",\n  \"pageNumber\": 23,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"원본과 완성 파일을 따로 검수\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"편집 앱의 미리보기와 저장된 동영상은 서로 다른 확인 대상입니다. 최종 파일을 다른 앱에서 열고 화면과 소리를 검사하세요. 재생 중 멈추지 않고 한번 보고, 문제가 있던 구간만 다시 확인하는 순서로 진행합니다.\",\n      \"blockId\": \"video-entry.playback-check.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"전체 재생\",\n          \"text\": \"처음부터 끝까지 보면서 다섯 장면의 순서와 끝 시각을 확인합니다. 원치 않는 엔딩·검은 화면이 남으면 편집으로 돌아갑니다.\",\n          \"output\": \"전체 흐름 검사\"\n        },\n        {\n          \"title\": \"글자 대조\",\n          \"text\": \"일시·6명·무료·읽던 책 1권을 사실 카드와 대조합니다. 마지막 신청 안내도 연습임이 드러나는지 읽습니다.\",\n          \"output\": \"사실·가독성 검사\"\n        },\n        {\n          \"title\": \"소리 대조\",\n          \"text\": \"이어폰 또는 기기 스피커로 실제 들어봅니다. 무음이라면 의도한 선택인지 기록합니다. 소리 파일이 있다는 사실만으로 들었다고 쓰지 않습니다.\",\n          \"output\": \"음성·무음 상태 기록\"\n        },\n        {\n          \"title\": \"보관\",\n          \"text\": \"원본 다섯 개, 자막 메모, 완성본, 검사 기록을 구분해 보관합니다. 나중에 수정할 때 원본부터 다시 찾지 않게 합니다.\",\n          \"output\": \"다시 편집할 수 있는 작업 묶음\"\n        }\n      ],\n      \"blockId\": \"video-entry.playback-check.b02\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"내 검사 기록 남기기\",\n      \"goal\": \"검사한 것과 미완료를 구분한다.\",\n      \"steps\": [\n        \"앱·기기·확인 날짜를 실제 값으로 적습니다.\",\n        \"길이·화면 크기·소리·사실 대조 결과를 적습니다.\",\n        \"안 한 검사는 미실행으로 남깁니다.\"\n      ],\n      \"expectedOutput\": \"재생 검사 기록\",\n      \"checks\": [\n        \"앱 버전과 기기를 추정하지 않았는가?\",\n        \"출력하지 못한 파일을 검사 완료로 쓰지 않았는가?\"\n      ],\n      \"blockId\": \"video-entry.playback-check.b03\"\n    }\n  ]\n}\n","video-entry.assessment-and-solutions":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"video-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"video-entry.assessment-and-solutions\",\n  \"pageNumber\": 24,\n  \"chapterId\": \"first-bookmark-video\",\n  \"title\": \"완성 기준과 다시 할 연습\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이 장의 결과는 촬영·편집·검수를 연결한 30초 영상입니다. 아래 네 항목을 따로 점검하세요. 사진 자료로 편집을 끝냈다면 편집 과제는 평가하되 촬영은 미실행으로 남깁니다. 앱 화면을 직접 확인하지 않은 교재 제작 과정과 학습자가 실제 수행한 과정도 구분합니다.\",\n      \"blockId\": \"video-entry.assessment-and-solutions.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"30초 영상의 평가 기준\",\n      \"columns\": [\n        \"기준\",\n        \"완료\",\n        \"수정 후 재확인\",\n        \"아직 없음\"\n      ],\n      \"rows\": [\n        [\n          \"장면\",\n          \"5장면에 재료·과정·사용·완성이 보임\",\n          \"한 장면이 흐리거나 역할이 중복\",\n          \"필요 장면이 빠짐\"\n        ],\n        [\n          \"편집\",\n          \"각 6초·합계 30초, 순서가 맞음\",\n          \"길이·순서·빈 구간 오류\",\n          \"편집 결과가 없음\"\n        ],\n        [\n          \"안내\",\n          \"자막과 사실 카드가 일치, 연습 표시 유지\",\n          \"일시·준비물 또는 표시가 틀림\",\n          \"자막이 없음\"\n        ],\n        [\n          \"출력·검수\",\n          \"저장 파일을 재생하고 소리·권리 상태 기록\",\n          \"파일은 있으나 일부 검사 미실행\",\n          \"출력 파일 없음\"\n        ]\n      ],\n      \"blockId\": \"video-entry.assessment-and-solutions.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"풀이 1. 10초 원본의 2~8초는 6초입니다. 풀이 2. 분할한 조각은 그대로 남으므로 필요 없는 부분을 선택해 삭제해야 합니다. 풀이 3. 무료 음악이어도 외부 게시 조건이 불명확하면 음악을 제외합니다. 풀이 4. 자막이 다음 장면까지 남으면 글자 줄의 끝 시각을 고칩니다.\",\n      \"blockId\": \"video-entry.assessment-and-solutions.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"다른 소재로 한 번 더\",\n      \"goal\": \"같은 편집 원리로 새 결과를 만든다.\",\n      \"steps\": [\n        \"책갈피 대신 직접 만든 카드나 작은 물건을 고릅니다.\",\n        \"다섯 장면의 역할과 한 줄 설명을 새로 씁니다.\",\n        \"원본 보관부터 재생 검사까지 다시 진행합니다.\"\n      ],\n      \"expectedOutput\": \"자신의 소재를 사용한 30초 영상\",\n      \"checks\": [\n        \"이 샘플의 모임 정보를 새 소재에 그대로 붙이지 않았는가?\",\n        \"실제 한 작업만 완료라고 기록했는가?\"\n      ],\n      \"blockId\": \"video-entry.assessment-and-solutions.b04\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이 장은 본문 24쪽의 입문 샘플입니다. 실제 조판과 화면 검수, Android 메뉴·무료 출력 실행 확인을 거쳐 보완해야 하며 400쪽 정규 교재가 완성되었다는 뜻은 아닙니다.\",\n      \"blockId\": \"video-entry.assessment-and-solutions.b05\"\n    }\n  ]\n}\n"}};const pageId=decodeURIComponent(location.hash.slice(1));window.reviewReader=PlatformModuleRegistry.mount(document.getElementById('host'),'ebook-reader',{publication,baseUrl:document.baseURI,pageId},{consumer:'export',onReaderNavigate(value){history.replaceState(history.state,'','#'+encodeURIComponent(value.pageId));}});PlatformModuleStyleRuntime?.apply?.('ebook-reader',document.getElementById('host'),{});</script><noscript>교재를 읽으려면 JavaScript를 켜 주세요.</noscript></body></html>
