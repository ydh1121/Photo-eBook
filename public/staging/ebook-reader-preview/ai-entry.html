sets/619ae28a8152a6aead6b942d7dab60930479160be9ffd568b760d49e4ac0a07c.webp","sha256":"619ae28a8152a6aead6b942d7dab60930479160be9ffd568b760d49e4ac0a07c","bytes":55198,"width":1467,"height":1067},"video-window-light":{"src":"assets/0a8ad4813609a226a0ae2d87e7add4d00216709cb23b9b6346d45d39f834a2b1.webp","sha256":"0a8ad4813609a226a0ae2d87e7add4d00216709cb23b9b6346d45d39f834a2b1","bytes":42974,"width":1467,"height":987}},"sourceSha256":"b27bce8925a9468338a4ae58ec7d85432b97cb8114b0a8cc17939a6d29da34fa","bodyPageCount":24,"frontMatterExcluded":true},"pages":{"ai-entry-project-outcome":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-project-outcome\",\n  \"pageNumber\": 1,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"안내문과 촬영 준비표를 함께 만들기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-project-outcome-opening\",\n      \"type\": \"paragraph\",\n      \"text\": \"동네 모임을 알리려면 날짜와 준비물이 한눈에 들어오는 글이 필요합니다. 모임을 짧은 영상으로 소개할 때는 찍어야 할 장면도 정해야 합니다. 이번 장에서는 같은 행사 자료를 바탕으로 안내문 한 편과 촬영 준비표 한 장을 만듭니다. AI에게 글을 맡긴 다음, 자료에 있던 사실이 그대로 남았는지 확인하고 필요한 부분을 고칩니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-project-outcome-approach\",\n      \"type\": \"paragraph\",\n      \"text\": \"스마트폰에서 글을 입력하고 복사하는 정도면 시작할 수 있습니다. ChatGPT의 무료 텍스트 대화를 중심으로 실습하며, 연노랑 종이와 파란 펜, 읽던 책 한 권을 준비하면 마지막 촬영 점검까지 이어집니다. 답변이 교재와 똑같이 나올 필요는 없습니다. 숫자와 조건이 맞고, 읽는 사람이 언제 무엇을 준비할지 알 수 있으면 됩니다. 예시 응답은 학습을 위해 작성한 글이며 앱 실행 기록을 옮긴 것이 아닙니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-project-outcome-bookmark-example\",\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-finished\",\n      \"alt\": \"크림색 책과 잎무늬를 그린 연노랑 책갈피, 파란 펜을 놓은 AI 생성 학습 예시\",\n      \"caption\": \"세 분야에서 함께 만드는 책갈피. 실제 행사 사진이 아닌 자체 기획 실습용 이미지입니다.\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\"\n    },\n    {\n      \"blockId\": \"ai-entry-project-outcome-deliverables\",\n      \"type\": \"table\",\n      \"caption\": \"이번 장을 끝내고 남길 것\",\n      \"columns\": [\n        \"결과물\",\n        \"완료 기준\"\n      ],\n      \"rows\": [\n        [\n          \"행사 안내문\",\n          \"날짜·시간·장소·정원·비용·준비물·신청 방식이 자료와 일치\"\n        ],\n        [\n          \"촬영 준비표\",\n          \"정해진 다섯 장면과 각 장면에 필요한 재료·동작·확인점 포함\"\n        ],\n        [\n          \"수정 기록\",\n          \"틀리거나 빠진 내용 두 가지와 고친 이유 기록\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-project-outcome-workflow\",\n      \"type\": \"list\",\n      \"ordered\": true,\n      \"items\": [\n        \"확정 자료에서 공개할 내용만 추립니다.\",\n        \"목적과 원하는 형식을 적어 질문합니다.\",\n        \"답변을 자료 및 공식 출처와 대조합니다.\",\n        \"수정 요청을 보내고 최종본을 직접 확정합니다.\"\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-project-outcome-fiction\",\n      \"type\": \"callout\",\n      \"title\": \"자체 기획 실습\",\n      \"text\": \"모든 행사 조건은 교재용 가정입니다. 실제 모임이나 가게를 소개하거나 참가자를 모집하는 글이 아닙니다.\",\n      \"tone\": \"note\"\n    }\n  ]\n}\n","ai-entry-fact-card":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-fact-card\",\n  \"pageNumber\": 2,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"이 자료만 행사 사실로 사용하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-fact-card-read-source\",\n      \"type\": \"paragraph\",\n      \"text\": \"아래 표가 이번 작업의 원본입니다. AI 답변과 다르면 이 표를 기준으로 고칩니다. 특히 무료라는 조건과 준비물은 참여 여부에 영향을 줍니다. 날짜만 맞고 비용이 달라져도 완성된 안내문으로 볼 수 없습니다. 표를 읽으며 바꾸면 안 되는 값을 손가락으로 짚어 보세요. 새로운 문장을 쓰더라도 이 값들은 유지합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-fact-card-unknown\",\n      \"type\": \"paragraph\",\n      \"text\": \"빈칸을 그럴듯한 말로 채우지 마세요. 장소는 이름과 주소가 없는 가상 공간입니다. 부산에 있는 실제 가게를 검색해 주소를 붙이면 다른 모임의 정보가 됩니다. 주차나 엘리베이터도 제공된 자료에 없습니다. 독자가 궁금해할 정보라도 사실을 새로 정할 권한은 AI에게 주지 않습니다. 필요한 항목은 별도의 확인 목록에 남기고, 연습용 안내문에는 넣지 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-fact-card-facts\",\n      \"type\": \"table\",\n      \"caption\": \"공통 행사 자료 · 가정 예제\",\n      \"columns\": [\n        \"항목\",\n        \"확정한 내용\"\n      ],\n      \"rows\": [\n        [\n          \"행사명\",\n          \"토요일 책갈피 만들기\"\n        ],\n        [\n          \"일시\",\n          \"2026년 11월 14일(토) 14:00~15:00\"\n        ],\n        [\n          \"장소\",\n          \"부산의 동네 모임 공간(연습용 가상 장소)\"\n        ],\n        [\n          \"정원 / 참가비\",\n          \"6명 / 무료\"\n        ],\n        [\n          \"제공 재료\",\n          \"연노랑 종이, 파란 펜\"\n        ],\n        [\n          \"개인 준비물\",\n          \"읽던 책 1권\"\n        ],\n        [\n          \"신청 방법 예시\",\n          \"계정 메시지로 '책갈피' 보내기\"\n        ],\n        [\n          \"없는 정보\",\n          \"상호·주소·연락처·예약 URL·후기·주차·엘리베이터\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-fact-card-source-check\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"날짜와 요일을 한 묶음으로 읽었습니다.\",\n        \"14:00~15:00의 시작과 끝을 구분했습니다.\",\n        \"제공 재료와 개인 준비물을 구분했습니다.\",\n        \"신청 방법도 실제 모집이 아닌 연습 조건임을 확인했습니다.\"\n      ]\n    }\n  ]\n}\n","ai-entry-roles-and-evidence":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-roles-and-evidence\",\n  \"pageNumber\": 3,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"AI에게 맡길 일과 직접 확인할 일\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-roles-and-evidence-roles\",\n      \"type\": \"paragraph\",\n      \"text\": \"행사 자료를 짧은 글로 바꾸거나 촬영 목록으로 정리하는 일에는 AI를 이용합니다. 날짜가 맞는지, 종이가 실제 준비됐는지, 촬영 장소를 사용할 수 있는지는 사람이 확인해야 합니다. 잘 읽히는 문장을 얻는 일과 그 문장의 사실을 확정하는 일을 나누면 무엇을 고쳐야 하는지 분명해집니다. 이번 실습에서는 글을 만드는 동안에도 자료표를 닫지 않고 가까이 둡니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-roles-and-evidence-search\",\n      \"type\": \"paragraph\",\n      \"text\": \"검색은 이미 공개된 문서를 찾아 확인할 때 씁니다. ChatGPT 앱을 누가 배포하는지 알고 싶다면 공식 안내를 엽니다. 가상 모임의 주차장을 찾는 검색은 하지 않습니다. 공개된 원문이 없는 항목이기 때문입니다. AI가 자신 있게 답하거나 출처처럼 보이는 주소를 붙여도 내용이 맞는다는 보장은 없습니다. 주소를 열어 해당 문장이 실제로 있는지 읽어야 합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-roles-and-evidence-jobs\",\n      \"type\": \"table\",\n      \"caption\": \"같은 질문도 근거가 다릅니다\",\n      \"columns\": [\n        \"확인할 것\",\n        \"확인할 곳\"\n      ],\n      \"rows\": [\n        [\n          \"행사 날짜·정원·참가비\",\n          \"이 장의 공통 행사 자료\"\n        ],\n        [\n          \"공식 ChatGPT 앱 게시자\",\n          \"OpenAI 도움말의 설치 안내\"\n        ],\n        [\n          \"영상에 쓸 장면 순서\",\n          \"이 실습에서 정한 촬영 계획\"\n        ],\n        [\n          \"실제 재료·빛·촬영 가능 여부\",\n          \"촬영 전에 직접 확인할 환경\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-roles-and-evidence-sort\",\n      \"type\": \"exercise\",\n      \"title\": \"판단해 보기\",\n      \"goal\": \"확정 자료와 새로 생긴 주장을 구분합니다.\",\n      \"steps\": [\n        \"“무료 모임이므로 주차도 무료다”라는 문장을 읽습니다.\",\n        \"자료표에서 이를 뒷받침하는 항목을 찾습니다.\"\n      ],\n      \"expectedOutput\": \"“참가비 무료”와 “주차 무료”를 구분한 한 문장\",\n      \"checks\": [\n        \"주차 정보가 없다는 이유를 적었는가\"\n      ],\n      \"solution\": \"참가비가 무료라는 사실로 주차 조건을 알 수 없습니다. 주차 문장을 빼고 확인할 항목으로 남깁니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-roles-and-evidence-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Does ChatGPT tell the truth?\",\n          \"url\": \"https://help.openai.com/en/articles/8313428-does-chatgpt-tell-the-truth\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"Searching the web with ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/9237897-searching-the-web-with-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-privacy-before-input":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-privacy-before-input\",\n  \"pageNumber\": 4,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"입력할 정보만 따로 복사하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-privacy-before-input-privacy\",\n      \"type\": \"paragraph\",\n      \"text\": \"실제 일을 하다 보면 행사 자료와 개인 연락처가 한 메모에 섞여 있습니다. 안내문을 쓰는 데 필요한 내용만 새 메모로 옮긴 뒤 AI에 보냅니다. 이름을 지웠어도 사진 속 명찰이나 대화 상대의 계정명이 남아 있을 수 있으므로 이번 실습은 텍스트로 작성합니다. 계정 비밀번호나 인증번호는 행사 자료에 넣지 않습니다. AI가 요청하더라도 로그인 입력칸과 대화 입력칸을 혼동하지 마세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-privacy-before-input-minimal\",\n      \"type\": \"paragraph\",\n      \"text\": \"사람의 이름이 없어도 “참가자 여섯 명”처럼 작업에 필요한 조건은 전달할 수 있습니다. 여기서 공개 신청 방식은 계정 메시지로 정해져 있으므로 개인 전화번호가 필요하지 않습니다. 정보가 빠졌다고 AI가 물으면 “자료에 없으니 안내문에서 제외해 줘”라고 답합니다. 입력 전에는 정리한 메모를 한 번 더 읽고, 복사 범위에 다른 사람의 메시지가 붙지 않았는지 확인하세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-privacy-before-input-redaction\",\n      \"type\": \"table\",\n      \"caption\": \"입력 전과 후 · 개인정보는 기호로만 표시한 예시\",\n      \"columns\": [\n        \"섞여 있는 내부 메모\",\n        \"AI에 전달할 내용\"\n      ],\n      \"rows\": [\n        [\n          \"담당자 [실제 이름], 개인 번호 [실제 연락처]\",\n          \"담당자와 개인 연락처는 제외\"\n        ],\n        [\n          \"참가자별 이름·연락처가 붙은 명단\",\n          \"정원 6명\"\n        ],\n        [\n          \"계정 메시지 신청 안내와 로그인 인증번호\",\n          \"신청 방식만 유지, 인증번호 제외\"\n        ],\n        [\n          \"주차 문의에 대한 담당자의 미확정 추측\",\n          \"주차 정보는 제공하지 않음\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-privacy-before-input-reply\",\n      \"type\": \"template\",\n      \"title\": \"추가 정보를 요구받았을 때\",\n      \"text\": \"개인 연락처와 참가자 명단은 제공하지 않을게. 행사 안내에 필요한 공개 정보만 사용해 줘. 자료에 없는 조건은 추측하지 말고, 확인할 항목으로 따로 적어 줘.\"\n    },\n    {\n      \"blockId\": \"ai-entry-privacy-before-input-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"The ChatGPT home page\",\n          \"url\": \"https://help.openai.com/en/articles/9125172-the-chatgpt-home-page\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-official-app":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-official-app\",\n  \"pageNumber\": 5,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"공식 Android 앱 준비하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-official-app-install\",\n      \"type\": \"paragraph\",\n      \"text\": \"설치할 때는 앱 이름과 아이콘만 보지 말고 게시자를 확인합니다. OpenAI의 설치 안내는 Google Play에서 게시자가 OpenAI인지 확인하도록 설명합니다. 아래 출처의 공식 도움말에서 Android용 앱 링크를 여는 방법이 출발점입니다. 스토어 검색을 이용한다면 “OpenAI ChatGPT”를 검색한 뒤 같은 게시자인지 확인하세요. 호환 조건은 해당 기기에 표시되는 스토어 안내를 따릅니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-official-app-account\",\n      \"type\": \"paragraph\",\n      \"text\": \"앱을 열었을 때 로그인 화면이 나오면 이미 쓰는 계정의 가입 방식을 선택합니다. Google 계정으로 가입했다면 같은 Google 계정으로 로그인해야 대화 기록을 이어 찾기 쉽습니다. 처음 만드는 계정은 화면에 표시된 가입 절차를 따릅니다. 비밀번호와 인증번호는 그 인증 화면에서만 입력하세요. 이 장은 유료 구독 없이 진행하므로 결제 화면에서 요금제를 고르는 단계가 없습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-official-app-install-path\",\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"공식 링크 열기\",\n          \"text\": \"아래 OpenAI 모바일 앱 도움말에서 “ChatGPT in Google Play” 링크를 엽니다.\",\n          \"output\": \"Google Play의 앱 상세 화면\"\n        },\n        {\n          \"title\": \"게시자 확인과 설치\",\n          \"text\": \"앱 이름 ChatGPT와 게시자 OpenAI를 확인한 뒤, 기기에 표시되는 설치 버튼을 누릅니다.\",\n          \"output\": \"설치가 끝난 공식 앱\"\n        },\n        {\n          \"title\": \"계정으로 들어가기\",\n          \"text\": \"앱을 열고 Log in 또는 화면에 표시되는 로그인·가입 절차를 따릅니다. 기존 계정은 처음 가입한 방식을 사용합니다.\",\n          \"output\": \"메시지를 입력할 수 있는 대화 화면\"\n        },\n        {\n          \"title\": \"버전 기록\",\n          \"text\": \"사이드바 → 프로필 아이콘 → Settings → About → ChatGPT for Android 순으로 버전을 찾습니다.\",\n          \"output\": \"사용한 날짜와 앱 버전을 적은 메모\"\n        }\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-official-app-verification\",\n      \"type\": \"callout\",\n      \"title\": \"화면 안내의 확인 범위\",\n      \"text\": \"2026년 11월 6일 공식 문서 기준입니다. 이 원고에서는 Android 기기를 직접 실행하지 않았습니다. 영문 메뉴명은 공식 문서 표기이며, 한국어 설명이 기기의 실제 번역과 같다는 뜻은 아닙니다.\",\n      \"tone\": \"note\"\n    },\n    {\n      \"blockId\": \"ai-entry-official-app-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"ChatGPT iOS and Android app FAQ\",\n          \"url\": \"https://help.openai.com/en/articles/8142208-chatgpt-ios-and-android-app-faq\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"Why can't I log in to ChatGPT?\",\n          \"url\": \"https://help.openai.com/en/articles/7426629-why-cant-i-log-in-to-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-free-route":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-free-route\",\n  \"pageNumber\": 6,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"무료 텍스트 대화로 끝내기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-free-route-plan\",\n      \"type\": \"paragraph\",\n      \"text\": \"이번 작업은 행사 자료를 텍스트로 붙여 넣고 답변을 고치는 과정입니다. OpenAI의 무료 이용 안내를 기준으로 구성했으며, 이미지 생성이나 파일 업로드가 있어야 풀리는 과제는 없습니다. 무료 계정으로 시작하고 실습 중 화면에 나타나는 사용 안내를 읽으세요. 기능을 쓰다 한도 안내가 나오면 어떤 기능의 한도인지 확인하고, 허용된 시점에 이어 하거나 저장해 둔 글을 직접 다듬습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-free-route-paid\",\n      \"type\": \"paragraph\",\n      \"text\": \"유료 플랜은 사용 한도나 제공 기능에서 차이가 있습니다. 그 차이가 이번 안내문의 사실 정확성을 대신 보장하지는 않습니다. 이 장에서는 모델 이름이나 월 요금을 고정하지 않습니다. 현재 플랜이 제공하는 기능과 결제 조건은 바뀔 수 있기 때문입니다. 화면에 유료 전환을 권하는 문구가 보이더라도 이 과제를 위해 선택할 필요는 없습니다. 작성한 자료와 요청문을 메모로 남기면 실습을 쉬었다 이어가기 편합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-free-route-free-paid\",\n      \"type\": \"table\",\n      \"caption\": \"이 장에서 필요한 선택\",\n      \"columns\": [\n        \"항목\",\n        \"진행 방법\"\n      ],\n      \"rows\": [\n        [\n          \"기본 안내문과 촬영표\",\n          \"무료 텍스트 대화 사용\"\n        ],\n        [\n          \"검색이 필요한 앱 정보\",\n          \"공식 도움말 링크를 직접 열거나 사용 가능한 검색 이용\"\n        ],\n        [\n          \"이미지·파일 도구의 한도 안내\",\n          \"해당 도구를 멈추고 제공된 텍스트 자료로 계속\"\n        ],\n        [\n          \"유료 구독·별도 API 서비스\",\n          \"이 실습의 준비물에 포함되지 않음\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-free-route-limits\",\n      \"type\": \"callout\",\n      \"title\": \"숫자를 외워 둘 필요는 없습니다\",\n      \"text\": \"사용 한도는 기능·계정·시점에 따라 달라질 수 있습니다. 현재 화면의 안내와 아래 공식 무료 이용 문서를 확인하세요.\",\n      \"tone\": \"note\"\n    },\n    {\n      \"blockId\": \"ai-entry-free-route-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"ChatGPT Free Tier FAQ\",\n          \"url\": \"https://help.openai.com/en/articles/9275245-chatgpt-free-tier-faq\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"The ChatGPT home page\",\n          \"url\": \"https://help.openai.com/en/articles/9125172-the-chatgpt-home-page\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-conversation-actions":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-conversation-actions\",\n  \"pageNumber\": 7,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"입력·후속 질문·복사 익히기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-conversation-actions-chat\",\n      \"type\": \"paragraph\",\n      \"text\": \"ChatGPT에서 대화를 열고 메시지 입력칸에 문장을 적은 다음 전송합니다. 지금은 긴 요청을 보내기 전에 입력할 위치와 대화를 다시 여는 방법을 확인하세요. 새 주제를 시작할 때는 New chat를 선택합니다. 행사 안내문을 고칠 때는 같은 대화에서 수정 내용을 보내면 앞서 보낸 자료와 답변을 함께 다루기 좋습니다. 입력한 문장이 전송된 메시지로 보이는지 확인한 뒤 다음 요청을 보냅니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-conversation-actions-copy\",\n      \"type\": \"paragraph\",\n      \"text\": \"복사와 공유는 목적이 다릅니다. 이 실습은 답변의 글만 메모로 옮깁니다. Android 공식 안내에 따르면 응답 아래 버튼이나 더보기 메뉴에 Copy가 표시될 수 있고, 응답 텍스트를 길게 눌러 선택하는 방법도 있습니다. 복사한 뒤 메모에 붙여 넣어 첫 줄과 마지막 줄이 모두 들어갔는지 읽으세요. 대화 전체를 공유하는 링크를 만들 필요는 없습니다. 잘못 복사했다면 원래 응답으로 돌아가 범위를 다시 선택합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-conversation-actions-paths\",\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"대화 시작\",\n          \"text\": \"ChatGPT → New chat → 메시지 입력칸 → 문장 입력 → 전송 순으로 진행합니다.\",\n          \"output\": \"보낸 문장과 그 아래 응답\"\n        },\n        {\n          \"title\": \"같은 대화에서 고치기\",\n          \"text\": \"현재 대화의 입력칸에 “날짜는 그대로 두고 첫 문장만 짧게 해 줘”처럼 바꿀 범위를 적습니다.\",\n          \"output\": \"앞선 글을 바탕으로 한 새 응답\"\n        },\n        {\n          \"title\": \"글 복사\",\n          \"text\": \"응답 아래 동작 버튼 또는 ••• → Copy를 찾습니다. 다른 경로로는 응답 글 길게 누르기 → Android 선택 메뉴를 이용합니다.\",\n          \"output\": \"메모에 붙여 넣을 텍스트\"\n        },\n        {\n          \"title\": \"이어서 읽기\",\n          \"text\": \"ChatGPT → 메뉴 아이콘(두 줄) → 사이드바 → 해당 대화를 선택합니다.\",\n          \"output\": \"저장된 대화가 다시 열린 화면\"\n        }\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-conversation-actions-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"What is ChatGPT: FAQ\",\n          \"url\": \"https://help.openai.com/en/articles/12677804-what-is-chatgpt-faq\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"ChatGPT iOS and Android app FAQ\",\n          \"url\": \"https://help.openai.com/en/articles/8142208-chatgpt-ios-and-android-app-faq\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-data-settings":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-data-settings\",\n  \"pageNumber\": 8,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"데이터 설정을 알고 시작하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-data-settings-settings\",\n      \"type\": \"paragraph\",\n      \"text\": \"입력 내용을 모델 개선에 사용할지 정하는 설정과, 어떤 내용을 입력할지 판단하는 일은 따로 챙깁니다. 개인 계정의 일반 대화에서 모델 개선에 제공하지 않으려면 공식 문서의 데이터 설정 경로를 따라 해당 항목을 끕니다. 설정을 바꿔도 이 실습에는 개인정보가 필요하지 않습니다. 앞쪽에서 정리한 공개 정보 메모만 사용하세요. 조직 계정은 관리자가 허용한 설정 범위가 다를 수 있습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-data-settings-temporary\",\n      \"type\": \"paragraph\",\n      \"text\": \"임시 대화는 이 장을 진행하는 데 꼭 필요한 선택은 아닙니다. 현재 공식 안내는 임시 상태를 유지하는 동안 기록에 남지 않고 모델 개선에 쓰이지 않는다고 설명합니다. 대화를 시작하기 전에 개인화 여부를 고르며, 일반 대화로 저장하면 그때부터 계정의 설정을 따릅니다. 안전을 위해 최대 30일 동안 사본이 보관될 수 있어 즉시 완전 삭제와 같은 뜻으로 이해하면 안 됩니다. 연습을 다시 보려면 최종 글을 별도 메모로 남기세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-data-settings-data-path\",\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"일반 대화의 데이터 설정\",\n          \"text\": \"ChatGPT → 사이드바 → 프로필 아이콘으로 Settings 열기 → Data controls → Improve the model for everyone 끄기.\",\n          \"output\": \"해당 항목의 꺼짐 상태\"\n        },\n        {\n          \"title\": \"임시 대화를 선택한다면\",\n          \"text\": \"새 대화 → Temporary → 첫 메시지 전 Personalized 또는 Unpersonalized 선택 → 메시지 입력. 화면에 이 항목이 없으면 아래 공식 안내를 확인합니다.\",\n          \"output\": \"선택한 대화 방식과 개인화 상태\"\n        }\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-data-settings-retention\",\n      \"type\": \"callout\",\n      \"title\": \"저장하기 전에 구분하기\",\n      \"text\": \"임시 대화에서 복사한 최종 글을 메모에 보관하는 것과, 임시 대화 자체를 일반 대화로 저장하는 것은 서로 다른 동작입니다.\",\n      \"tone\": \"note\"\n    },\n    {\n      \"blockId\": \"ai-entry-data-settings-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Data controls in ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/7730893-data-controls-in-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"Temporary chat in ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/8914046-temporary-chat-in-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-first-question":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-first-question\",\n  \"pageNumber\": 9,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"짧은 첫 질문을 보내기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-first-question-first\",\n      \"type\": \"paragraph\",\n      \"text\": \"새 대화에서 아래 질문을 보내세요. 행사 이름과 만들 글의 종류만 알려 주는 질문입니다. 일부러 상세 조건을 넣지 않았습니다. 답변을 받으면 어떤 정보가 더 필요한지 살펴봅니다. AI가 날짜나 장소를 다시 물으면 정상적인 진행입니다. 바로 완성된 글을 내놓더라도 그 안의 조건을 행사 자료와 비교하기 전에는 사용하지 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-question-observe\",\n      \"type\": \"paragraph\",\n      \"text\": \"첫 응답에서 새로 등장한 숫자나 장소에 밑줄을 긋는다고 생각하며 읽어 보세요. 우리 자료의 어느 줄에서 나온 내용인지 설명하지 못하면 표시를 남깁니다. 이 과정을 거치면 다음 질문에 무엇을 더 넣어야 할지 알 수 있습니다. 예를 들어 날짜를 되물었다면 자료의 날짜와 시간을 다음 요청에 함께 넣습니다. 필요한 정보가 빠졌을 때 알아차리고 보완하는 연습입니다. 화면의 답변을 복사해 “첫 응답”이라는 제목으로 메모에 보관하세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-question-first-prompt\",\n      \"type\": \"template\",\n      \"title\": \"첫 질문\",\n      \"text\": \"부산에서 열 “토요일 책갈피 만들기” 모임의 짧은 안내문을 써 줘.\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-question-first-response\",\n      \"type\": \"exercise\",\n      \"title\": \"내 첫 응답 관찰\",\n      \"goal\": \"AI가 자료를 더 요구하는지, 임의로 내용을 채우는지 확인합니다.\",\n      \"steps\": [\n        \"위 질문을 보내고 응답을 끝까지 읽습니다.\",\n        \"행사 자료에 없는데 새로 생긴 내용에 표시합니다.\",\n        \"답변이 조건을 물었다면 질문한 항목을 그대로 메모합니다.\"\n      ],\n      \"expectedOutput\": \"첫 응답과 “더 알려 줄 정보” 세 항목\",\n      \"checks\": [\n        \"날짜·시간을 확인했는가\",\n        \"장소·비용을 확인했는가\",\n        \"답변을 최종 안내문과 구분해 저장했는가\"\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-first-question-different-output\",\n      \"type\": \"callout\",\n      \"title\": \"답변이 교재와 달라도 괜찮습니다\",\n      \"text\": \"AI가 질문만 했으면 다음 쪽의 비교 예시를 읽고, 제공 자료와 형식을 넣는 단계로 이어가세요. 예시 문장을 얻으려고 같은 질문을 반복할 필요는 없습니다.\",\n      \"tone\": \"note\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-question-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Prompt engineering best practices for ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/10032626-prompt-engineering-best-practices-for-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"Does ChatGPT tell the truth?\",\n          \"url\": \"https://help.openai.com/en/articles/8313428-does-chatgpt-tell-the-truth\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-first-response-review":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-first-response-review\",\n  \"pageNumber\": 10,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"그럴듯한 초안에서 없는 정보 찾기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-first-response-review-example\",\n      \"type\": \"paragraph\",\n      \"text\": \"아래는 부족한 질문에 어떤 문제가 생길 수 있는지 보여 주려고 교재에서 작성한 응답 예시입니다. 실제 앱에서 관찰한 답변이나 행사 정보가 아닙니다. 처음 보면 모임 안내처럼 읽히지만 정원과 비용이 자료와 다르고, 장소 표현도 확인되지 않았습니다. 이런 문장을 바로 복사하면 글의 분위기를 다듬는 동안 사실까지 바뀐 상태로 전달하게 됩니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-response-review-diagnose\",\n      \"type\": \"paragraph\",\n      \"text\": \"오류는 세 종류로 나눠 표시하면 고치기 쉽습니다. 자료와 다른 값에는 “불일치”, 자료에 없는 내용에는 “추가”, 꼭 필요한데 빠진 항목에는 “누락”이라고 적습니다. 좋고 나쁘다는 느낌만 말하지 말고 문장의 어느 부분이 문제인지 남겨 보세요. 다음 요청에서 그 표시를 그대로 사용하면 고칠 범위가 선명해집니다. 분위기 표현은 사실 대조를 마친 뒤에 다듬습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-response-review-faulty-draft\",\n      \"type\": \"callout\",\n      \"title\": \"오류 찾기용 응답 예시\",\n      \"text\": \"“이번 토요일 오후, 부산의 아늑한 공방에서 책갈피를 만들어요. 선착순 10명, 참가비 5,000원이며 주차가 가능합니다. 아래 예약 링크로 신청하세요.” 이 문장은 사용하면 안 되는 비교용 초안입니다.\",\n      \"tone\": \"warning\"\n    },\n    {\n      \"blockId\": \"ai-entry-first-response-review-diagnosis\",\n      \"type\": \"table\",\n      \"caption\": \"어디를 고칠지 기록하기\",\n      \"columns\": [\n        \"초안의 표현\",\n        \"표시와 이유\"\n      ],\n      \"rows\": [\n        [\n          \"10명 / 5,000원\",\n          \"불일치: 자료는 6명 / 무료\"\n        ],\n        [\n          \"공방 / 주차 가능 / 예약 링크\",\n          \"추가: 장소 종류와 주차 조건, 링크가 제공되지 않음\"\n        ],\n        [\n          \"이번 토요일 오후\",\n          \"누락: 2026년 11월 14일(토), 14:00~15:00이 드러나지 않음\"\n        ],\n        [\n          \"준비물 언급 없음\",\n          \"누락: 읽던 책 1권을 알려야 함\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-first-response-review-hold\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"자료에 없는 말을 지우거나 확인 목록으로 옮겼습니다.\",\n        \"숫자와 비용의 원래 값을 찾았습니다.\",\n        \"독자에게 필요한 준비물과 신청 방식을 찾았습니다.\"\n      ]\n    }\n  ]\n}\n","ai-entry-complete-request":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-complete-request\",\n  \"pageNumber\": 11,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"목적·대상·자료·형식으로 요청하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-complete-request-structure\",\n      \"type\": \"paragraph\",\n      \"text\": \"이번에는 독자가 누구이고 무엇을 알아야 하는지 설명합니다. 목적은 모임 안내문 작성, 대상은 동네 성인 독자, 자료는 확정된 행사 조건입니다. 형식은 제목과 짧은 소개, 항목별 안내로 정합니다. 이 네 가지를 적으면 답변을 평가할 기준도 함께 생깁니다. “좋게 써 줘”라고 했을 때보다 빠진 항목을 찾거나 수정할 이유를 말하기 쉽습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-complete-request-constraint\",\n      \"type\": \"paragraph\",\n      \"text\": \"자료를 넣을 때는 바꿔도 되는 표현과 그대로 둘 사실을 구분합니다. 제목 아래 소개 문장은 새로 써도 되지만 시간과 비용은 그대로 두도록 요청하세요. 확인되지 않은 항목은 본문 밖에 모으게 합니다. 한 번에 완벽한 답을 얻으려고 복잡한 역할 이름을 붙일 필요는 없습니다. 전달할 자료와 결과의 모양을 분명히 적고, 나온 글을 읽은 뒤 추가로 고칩니다. 아래 요청은 그대로 복사해 사용해도 됩니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-complete-request-full-prompt\",\n      \"type\": \"template\",\n      \"title\": \"자료를 모두 넣은 요청\",\n      \"text\": \"동네 성인 독자가 읽을 모임 안내문을 써 줘.\\n목적: 날짜, 준비물, 신청 방식을 쉽게 찾게 하기.\\n형식: 제목 → 소개 2문장 이내 → 일시·장소·정원·참가비·제공 재료·준비물·신청 방법을 항목별로 정리.\\n말투: 차분한 존댓말. 과장, 후기, 추천 문구는 넣지 않기.\\n아래 사실의 값은 바꾸지 말고, 없는 정보는 추측하지 마.\\n글의 앞뒤에 실제 모집이 아닌 가상의 자체 기획 실습임을 밝혀 줘.\\n\\n가상의 자체 기획 실습이며 실제 모집이 아닙니다.\\n행사명: 토요일 책갈피 만들기\\n일시: 2026년 11월 14일(토) 14:00~15:00\\n장소: 부산의 동네 모임 공간(연습용 가상 장소)\\n정원: 6명\\n참가비: 무료\\n제공 재료: 연노랑 종이, 파란 펜\\n개인 준비물: 읽던 책 1권\\n신청 방법: 계정 메시지로 '책갈피' 보내기\\n제공하지 않은 정보: 상호, 주소, 연락처, 예약 URL, 후기, 주차, 엘리베이터\\n제공하지 않은 정보는 만들어 쓰지 않습니다.\\n\\n완성문 아래에 “추가로 확인할 정보”를 따로 적어 줘. 확인할 정보가 아직 확정된 것처럼 안내문에 넣지는 마.\"\n    },\n    {\n      \"blockId\": \"ai-entry-complete-request-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Prompt engineering best practices for ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/10032626-prompt-engineering-best-practices-for-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-improved-draft":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-improved-draft\",\n  \"pageNumber\": 12,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"개선된 초안을 항목별로 읽기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-improved-draft-reading\",\n      \"type\": \"paragraph\",\n      \"text\": \"아래는 자료와 형식을 보완한 뒤 얻을 수 있는 초안을 교재용으로 작성한 예입니다. 자신의 답변이 더 길거나 소개 문장이 달라도 괜찮습니다. 날짜와 시간, 장소, 비용과 준비물이 어디에 있는지 차례로 찾아보세요. 핵심 값이 한곳에 모여 있으면 휴대폰에서 읽을 때도 확인하기 쉽습니다. 아직 검사를 마치지 않은 글이므로 메모 제목에는 “검토 중”이라고 적습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-improved-draft-separate\",\n      \"type\": \"paragraph\",\n      \"text\": \"본문 아래의 확인 목록도 읽습니다. 주차나 주소가 적혀 있다고 해서 행사 정보가 생긴 것은 아닙니다. 확인 목록은 사람에게 남겨 둔 질문입니다. 이번 실습은 가상 장소를 사용하므로 주소를 더 조사하지 않고, 실제 모집을 하지 않는다는 표시를 유지합니다. 안내문과 확인 목록을 함께 복사했다면 최종 글을 저장할 때 어느 범위까지가 공개용 문장인지 구분해 두세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-improved-draft-draft\",\n      \"type\": \"template\",\n      \"title\": \"검토할 초안 예시\",\n      \"text\": \"[가상의 자체 기획 실습 · 실제 모집 아님]\\n토요일 책갈피 만들기\\n연노랑 종이와 파란 펜으로 책갈피를 만들어 봅니다. 읽던 책 1권을 가져오세요.\\n일시: 2026년 11월 14일(토) 14:00~15:00\\n장소: 부산의 동네 모임 공간(연습용 가상 장소)\\n정원 6명 / 참가비 무료\\n제공 재료: 연노랑 종이, 파란 펜\\n개인 준비물: 읽던 책 1권\\n신청 방법 예시: 계정 메시지로 '책갈피' 보내기\\n연습용 안내문으로 실제 신청을 받지 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-improved-draft-pending-info\",\n      \"type\": \"callout\",\n      \"title\": \"초안 밖의 확인 목록\",\n      \"text\": \"상호·주소·주차·엘리베이터·연락처·예약 URL은 제공되지 않았습니다. 이번 가상 모임의 확정 정보로 추가하지 않습니다.\",\n      \"tone\": \"note\"\n    }\n  ]\n}\n","ai-entry-fact-comparison":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-fact-comparison\",\n  \"pageNumber\": 13,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"숫자·이름·날짜를 직접 대조하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-fact-comparison-comparison\",\n      \"type\": \"paragraph\",\n      \"text\": \"답변을 쓴 AI에게 “맞는지 확인해 줘”라고 한 번 더 묻는 것만으로 검사를 끝내지 않습니다. 원본 자료와 자신의 답변을 나란히 열고 값마다 직접 표시합니다. 작은 화면에서는 메모에 확인 항목을 적고 두 화면을 번갈아 읽어도 됩니다. 소개 문장보다 일시와 비용부터 확인하면 실수가 바로 드러납니다. 같은 값이 제목과 본문에 두 번 있다면 두 곳을 모두 확인하세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-fact-comparison-date\",\n      \"type\": \"paragraph\",\n      \"text\": \"요일도 날짜와 함께 대조합니다. 이 자료의 기준은 2026년 11월 14일 토요일입니다. “이번 토요일”처럼 읽는 날에 따라 달라지는 표현만 남기지 마세요. 행사 시작은 오후 두 시, 종료는 오후 세 시입니다. 정원 여섯 명과 참가비 무료도 각각 확인합니다. 아래 연습용 표에는 오류가 섞여 있습니다. 오른쪽 답을 보기 전에 자신의 초안에서 같은 항목을 찾아 체크해 보세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-fact-comparison-find-errors\",\n      \"type\": \"table\",\n      \"caption\": \"의도적으로 틀린 문장과 판정\",\n      \"columns\": [\n        \"검사할 문장\",\n        \"원본 대조 결과\"\n      ],\n      \"rows\": [\n        [\n          \"11월 15일(일)에 만나요\",\n          \"불일치: 2026년 11월 14일(토)\"\n        ],\n        [\n          \"14:00~16:00에 진행합니다\",\n          \"불일치: 종료 시각은 15:00\"\n        ],\n        [\n          \"정원은 10명입니다\",\n          \"불일치: 6명\"\n        ],\n        [\n          \"참가비는 5,000원입니다\",\n          \"불일치: 무료\"\n        ],\n        [\n          \"무료 주차를 제공합니다\",\n          \"근거 없음: 주차 정보 미제공\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-fact-comparison-facts-passed\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"행사 이름과 날짜·요일이 원본과 같습니다.\",\n        \"시작 시각과 종료 시각이 모두 같습니다.\",\n        \"정원과 참가비가 같습니다.\",\n        \"제공 재료와 개인 준비물이 뒤바뀌지 않았습니다.\",\n        \"신청 방식이 메시지이며 새 링크나 연락처가 없습니다.\"\n      ]\n    }\n  ]\n}\n","ai-entry-open-the-source":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-open-the-source\",\n  \"pageNumber\": 14,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"출처 링크를 열어 주장 확인하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-open-the-source-source-question\",\n      \"type\": \"paragraph\",\n      \"text\": \"행사 조건은 제공 자료에서 확인하고 앱 기능은 공식 문서에서 확인합니다. 연습 질문은 “Android용 ChatGPT의 공식 게시자는 누구인가”입니다. 검색 답변이 OpenAI라고 말하면 링크를 열어 설치 안내에 같은 내용이 있는지 읽습니다. 링크 제목에 공식이라는 말이 있어도 주소와 발행자를 확인하세요. 인용이 달려 있다는 사실만으로 해당 문장까지 검증된 것은 아닙니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-open-the-source-source-work\",\n      \"type\": \"paragraph\",\n      \"text\": \"공식 검색 안내는 응답의 인용을 선택해 원문을 여는 방법과, 보이는 경우 Sources에서 출처를 보는 방법을 설명합니다. 원문에서는 앱 설치 항목을 찾아 게시자 이름을 읽고 확인한 날짜를 메모합니다. 검색 메뉴가 보이지 않으면 아래 제공한 OpenAI 도움말 링크를 직접 열어도 같은 검사를 수행할 수 있습니다. 가상의 행사장 주소를 찾는 검색으로 질문을 바꾸지 마세요. 이 연습의 확인 대상은 앱 배포 정보입니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-open-the-source-search-prompt\",\n      \"type\": \"template\",\n      \"title\": \"출처 확인 연습 질문\",\n      \"text\": \"Android용 ChatGPT 공식 앱의 게시자가 누구인지 OpenAI 도움말에서 찾아 줘. 그 내용이 적힌 공식 페이지 링크를 함께 보여 줘. 링크를 확인하지 못하면 확인하지 못했다고 말해 줘.\"\n    },\n    {\n      \"blockId\": \"ai-entry-open-the-source-source-path\",\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"검색 선택\",\n          \"text\": \"공식 문서의 경로는 대화 열기 → View all tools → Search → 질문 입력·전송입니다. 입력칸에서 /를 입력해 Search를 고르는 경로도 안내되어 있습니다. 기기에 안 보이면 공식 링크를 직접 엽니다.\",\n          \"output\": \"인용이 포함된 답변 또는 공식 도움말\"\n        },\n        {\n          \"title\": \"원문 읽기\",\n          \"text\": \"응답의 인용 링크를 누릅니다. Sources가 보이면 그 목록에서도 해당 문서를 엽니다.\",\n          \"output\": \"help.openai.com의 앱 설치 안내\"\n        },\n        {\n          \"title\": \"대조 기록\",\n          \"text\": \"문서 제목·발행자·주소·확인 날짜와, 게시자가 OpenAI인지 확인한 결과를 적습니다.\",\n          \"output\": \"주장과 원문이 연결된 짧은 기록\"\n        }\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-open-the-source-source-record\",\n      \"type\": \"callout\",\n      \"title\": \"출처 확인 기록 예시\",\n      \"text\": \"확인할 주장: Android 공식 앱 게시자는 OpenAI다. 원문: ChatGPT iOS and Android app FAQ의 설치 안내. 발행자: OpenAI. 확인일: 2026년 11월 6일. 대조 결과: Google Play 게시자를 OpenAI로 확인하라는 문구가 있어 주장과 일치. 원문 주소는 아래 첫 번째 링크에 보관합니다.\",\n      \"tone\": \"note\"\n    },\n    {\n      \"blockId\": \"ai-entry-open-the-source-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"ChatGPT iOS and Android app FAQ\",\n          \"url\": \"https://help.openai.com/en/articles/8142208-chatgpt-ios-and-android-app-faq\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"Searching the web with ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/9237897-searching-the-web-with-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-repair-wrong-answer":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-repair-wrong-answer\",\n  \"pageNumber\": 15,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"없는 정보와 틀린 답변 고치기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-repair-wrong-answer-repair\",\n      \"type\": \"paragraph\",\n      \"text\": \"오류를 발견하면 답변 전체를 막연히 다시 쓰라고 요청하기보다 틀린 부분과 원래 값을 함께 보냅니다. “정원이 틀렸어”에서 멈추지 말고 “정원은 여섯 명”이라고 알려 주세요. 자료에 없는 주차 정보는 삭제하고, 확인이 필요한 항목으로 옮기게 합니다. 고친 뒤에도 이전 숫자가 다른 문장에 남아 있을 수 있으니 새 응답을 처음부터 다시 읽습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-repair-wrong-answer-unknown\",\n      \"type\": \"paragraph\",\n      \"text\": \"AI가 출처를 열지 못했거나 확실하지 않다고 하면 확인 실패를 그대로 남깁니다. 여러 번 같은 질문을 보내 확신에 찬 답을 받아 내지 마세요. 행사 자료의 값은 직접 적용하면 되고, 외부 정보는 해당 공식 문서를 사람이 열어 확인하면 됩니다. 주차처럼 이번 자료로 확정할 수 없는 내용은 최종본에서 제외합니다. “확인할 정보”와 “확인한 사실”을 섞지 않는 것이 복구의 마지막 단계입니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-repair-wrong-answer-repair-prompt\",\n      \"type\": \"template\",\n      \"title\": \"잘못된 초안을 고치는 요청\",\n      \"text\": \"앞서 쓴 글의 오류를 다음 기준으로 고쳐 줘.\\n1. 정원 10명은 6명으로 바꿔.\\n2. 참가비 5,000원은 무료로 바꿔.\\n3. 일시는 2026년 11월 14일(토) 14:00~15:00으로 정확히 적어.\\n4. 주차 가능, 공방이라는 장소 종류, 예약 링크는 자료에 없으니 삭제해.\\n5. 신청 방법은 계정 메시지로 '책갈피' 보내기야.\\n다른 확정 정보는 유지하고, 실제 모집이 아닌 가상의 자체 기획 실습임을 밝혀 줘.\\n수정한 문장 아래에 무엇을 고쳤는지 짧게 적어 줘.\"\n    },\n    {\n      \"blockId\": \"ai-entry-repair-wrong-answer-repair-record\",\n      \"type\": \"table\",\n      \"caption\": \"수정 기록 예시\",\n      \"columns\": [\n        \"발견한 문제\",\n        \"확정한 수정과 이유\"\n      ],\n      \"rows\": [\n        [\n          \"정원과 비용이 바뀜\",\n          \"6명·무료로 복원. 공통 행사 자료를 기준으로 함\"\n        ],\n        [\n          \"주차와 예약 링크를 추가함\",\n          \"삭제. 제공 자료에 근거가 없음\"\n        ],\n        [\n          \"상대적인 날짜 표현만 있음\",\n          \"연도·날짜·요일·시간을 함께 표기. 읽는 시점에 따른 혼동을 줄임\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-repair-wrong-answer-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Does ChatGPT tell the truth?\",\n          \"url\": \"https://help.openai.com/en/articles/8313428-does-chatgpt-tell-the-truth\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-edit-tone-and-length":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-edit-tone-and-length\",\n  \"pageNumber\": 16,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"사실을 고정하고 문장 다듬기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-edit-tone-and-length-tone\",\n      \"type\": \"paragraph\",\n      \"text\": \"사실 검사가 끝나면 문장의 길이와 말투를 다듬습니다. 한 문장에 활동 소개와 시간, 준비물이 모두 들어 있으면 정보 찾기가 어렵습니다. 소개 문장과 항목 안내를 나누고, 독자가 해야 할 행동을 직접 씁니다. “독창적인 작품 세계를 펼치는 특별한 시간” 같은 표현 대신 무엇으로 무엇을 만드는지 알려 주세요. 행사 성격을 바꿀 만한 연령 조건이나 혜택은 새로 붙이지 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-edit-tone-and-length-limit\",\n      \"type\": \"paragraph\",\n      \"text\": \"수정 범위도 작게 정해 봅니다. 제목과 사실 항목은 그대로 두고 소개 두 문장만 고치게 하면 변경 내용을 비교하기 쉽습니다. 글자 수를 요청했더라도 AI가 정확히 맞췄다고 가정하지 않습니다. 휴대폰 메모에서 직접 읽고 너무 긴 문장을 줄이세요. 특히 “재료는 모두 제공”이라는 말은 읽던 책을 가져오라는 조건을 흐릴 수 있습니다. 제공 재료와 개인 준비물을 구체적으로 남기는 편이 낫습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-edit-tone-and-length-before-after\",\n      \"type\": \"table\",\n      \"caption\": \"같은 사실로 더 분명하게 쓰기\",\n      \"columns\": [\n        \"다듬기 전\",\n        \"다듬은 뒤\"\n      ],\n      \"rows\": [\n        [\n          \"특별한 창작의 즐거움을 만끽해 보세요\",\n          \"연노랑 종이에 파란 펜으로 책갈피를 만들어 봅니다\"\n        ],\n        [\n          \"필요한 재료는 모두 준비되어 있습니다\",\n          \"연노랑 종이와 파란 펜을 제공합니다. 읽던 책 1권을 가져오세요\"\n        ],\n        [\n          \"지금 바로 참여해 보세요\",\n          \"신청 방법 예시: 계정 메시지로 '책갈피' 보내기\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-edit-tone-and-length-tone-prompt\",\n      \"type\": \"template\",\n      \"title\": \"소개 문장만 고치는 요청\",\n      \"text\": \"제목과 날짜·시간·장소·정원·비용·재료·준비물·신청 방식은 그대로 둬. 소개만 차분한 존댓말 두 문장 이내로 고쳐 줘. 무엇으로 무엇을 만드는지 쓰고, 후기는 넣지 마. 가상의 자체 기획 실습이며 실제 모집이 아니라는 표시도 유지해 줘.\"\n    },\n    {\n      \"blockId\": \"ai-entry-edit-tone-and-length-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Prompt engineering best practices for ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/10032626-prompt-engineering-best-practices-for-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-final-notice":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-final-notice\",\n  \"pageNumber\": 17,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"검사를 마친 안내문 완성하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-final-notice-final\",\n      \"type\": \"paragraph\",\n      \"text\": \"이제 안내문 본문만 별도 메모로 옮깁니다. 확인이 필요한 정보 목록과 AI가 덧붙인 설명은 최종 안내문에 섞지 않습니다. 아래 예시는 날짜·시간·장소·정원·비용·준비물을 대조한 완성 형태입니다. 자신의 소개 문장이 달라도 같은 정보를 정확히 전달하면 됩니다. 연습용이라는 표시는 처음과 끝에 남겨, 글 일부를 다른 곳에 옮겨도 실제 모집으로 오해할 여지를 줄입니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-final-notice-read-as-reader\",\n      \"type\": \"paragraph\",\n      \"text\": \"처음 읽는 사람이 되어 세 가지를 찾아보세요. 언제 가는지, 무엇을 가져가는지, 어떻게 신청하는지입니다. 여기서 신청은 예제로만 다룹니다. 실제 계정에 메시지를 보내거나 이 글로 참가자를 모집하지 않습니다. 값이 틀린 곳을 찾으면 “최종”이라는 제목에 얽매이지 말고 바로 고칩니다. 수정한 문장을 다시 읽은 뒤 준비표를 만드는 다음 단계에 사용하세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-final-notice-final-copy\",\n      \"type\": \"template\",\n      \"title\": \"완성 안내문 예시\",\n      \"text\": \"[가상의 자체 기획 실습 · 실제 모집 아님]\\n토요일 책갈피 만들기\\n\\n연노랑 종이에 파란 펜으로 나만의 책갈피를 만들어 봅니다. 읽던 책 한 권을 가져오세요.\\n\\n일시: 2026년 11월 14일(토) 14:00~15:00\\n장소: 부산의 동네 모임 공간(연습용 가상 장소)\\n정원: 6명\\n참가비: 무료\\n제공 재료: 연노랑 종이, 파란 펜\\n준비물: 읽던 책 1권\\n신청 방법 예시: 계정 메시지로 '책갈피' 보내기\\n\\n이 안내문은 연습용입니다. 실제 신청을 받지 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-final-notice-release-check\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"자료표의 모든 확정 값을 대조했습니다.\",\n        \"없는 주소·주차·후기·연락처를 추가하지 않았습니다.\",\n        \"가상의 실습이며 실제 모집이 아니라는 표시가 있습니다.\",\n        \"어떤 표현을 직접 고쳤는지 한 가지 설명할 수 있습니다.\"\n      ]\n    }\n  ]\n}\n","ai-entry-shoot-request":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-shoot-request\",\n  \"pageNumber\": 18,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"안내문을 촬영 준비표로 바꾸기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-shoot-request-bridge\",\n      \"type\": \"paragraph\",\n      \"text\": \"완성한 안내문을 짧은 영상으로 소개하려면 무엇을 보여 줄지 정해야 합니다. 이번에는 책갈피가 만들어지는 순서를 5장면으로 담습니다. 각 장면은 최종 영상에서 6초씩 사용하므로 전체 길이는 30초입니다. 이 길이는 이번 실습의 편집 조건입니다. 영상의 설명문에는 가상 장소임을 포함한 장소 표기를 그대로 적습니다. 화면 전 구간에도 연습용이며 실제 모집이 아니라는 표시를 남깁니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-shoot-request-plan-vs-camera\",\n      \"type\": \"paragraph\",\n      \"text\": \"AI에게는 장면별 동작과 준비물을 정리하게 합니다. 실제 촬영 장소의 밝기와 배경, 책에 적힌 개인 메모는 촬영자가 확인합니다. 표에 “밝은 자리”가 있다고 해서 그 자리가 이미 확보된 것은 아닙니다. 촬영 전 확인할 항목으로 읽으세요. 준비표를 만들 때는 방금 확정한 안내문과 같은 대화를 이어 쓰면 됩니다. 새 대화로 옮겼다면 최종 안내문도 함께 붙여 넣습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-shoot-request-shoot-prompt\",\n      \"type\": \"template\",\n      \"title\": \"촬영 준비표 요청\",\n      \"text\": \"방금 확정한 연습용 안내문을 바탕으로 30초 영상 촬영 준비표를 만들어 줘.\\n영상은 가상의 자체 기획 실습이며 실제 모집이 아니야.\\n순서는 반드시 다음 5장면이고, 최종 편집 분량은 장면마다 6초야.\\n1. 재료 전체\\n2. 잎무늬 그리기\\n3. 짧은 문구\\n4. 책에 꽂기\\n5. 완성 전체\\n장면별 자막도 아래 순서를 유지해 줘.\\n0~6초: 토요일 책갈피 만들기\\n6~12초: 11월 14일(토) 14:00~15:00\\n12~18초: 종이·파란 펜 제공 / 읽던 책 1권 준비\\n18~24초: 정원 6명·참가비 무료\\n24~30초: 신청 안내 문구 연습 / 계정 메시지 '책갈피'\\n전 구간 표시: 연습용·실제 모집 아님\\n영상 설명문에는 “부산의 동네 모임 공간(연습용 가상 장소)”를 그대로 적어 줘.\\n준비물은 연노랑 종이, 파란 펜, 읽던 책 1권, 촬영할 스마트폰이야.\\n각 장면의 보일 동작, 필요한 물건, 촬영 전에 직접 확인할 점을 표로 적어 줘.\\n새 장소·주소·혜택·후기를 만들지 마. 사람 이름이나 연락처가 화면에 들어가지 않게 점검 항목을 넣어 줘.\\n마지막에는 준비물과 파일 확인용 체크리스트를 만들어 줘.\"\n    }\n  ]\n}\n","ai-entry-shot-plan":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-shot-plan\",\n  \"pageNumber\": 19,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"다섯 장면의 준비표 완성예\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-shot-plan-shot-use\",\n      \"type\": \"paragraph\",\n      \"text\": \"아래 표는 요청 조건을 사람이 대조한 준비표 예시입니다. 장면 이름을 읽으면 손을 어떻게 움직여야 하는지 떠올릴 수 있어야 합니다. “예쁘게 촬영”처럼 결과가 모호한 말은 “책에 책갈피를 꽂는 동작”으로 바꿉니다. 화면에 보일 내용과 필요한 물건이 이어지는지도 살펴보세요. 연노랑 종이와 파란 펜은 처음부터 마지막까지 같은 재료를 사용합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-shot-plan-duration\",\n      \"type\": \"paragraph\",\n      \"text\": \"표의 6초는 완성 영상에서 사용할 길이입니다. 촬영 원본을 정확히 6초만 남기면 손이 들어오거나 정리되는 부분을 잘라 낼 여유가 줄어듭니다. 앞뒤에 여유를 두고 찍은 뒤 영상 편집 실습에서 각 장면을 6초로 정리합니다. 전 구간에 “연습용·실제 모집 아님”을 표시하고, 설명문에는 가상 장소를 포함한 전체 장소 표기를 남깁니다. 촬영 여부와 완성 영상의 재생 검사는 이후 실제 파일을 보고 따로 기록해야 합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-shot-plan-shot-table\",\n      \"type\": \"table\",\n      \"caption\": \"30초 영상용 촬영 준비표 · 자체 기획 예시\",\n      \"columns\": [\n        \"구간·장면\",\n        \"보일 동작과 확인점\",\n        \"자막\"\n      ],\n      \"rows\": [\n        [\n          \"0~6초 · 재료 전체\",\n          \"연노랑 종이·파란 펜·책을 놓습니다. 개인 메모와 이름표를 치웁니다.\",\n          \"토요일 책갈피 만들기\"\n        ],\n        [\n          \"6~12초 · 잎무늬 그리기\",\n          \"파란 잎무늬를 그립니다. 손이 무늬를 가리지 않는지 확인합니다.\",\n          \"11월 14일(토) 14:00~15:00\"\n        ],\n        [\n          \"12~18초 · 짧은 문구\",\n          \"“오늘의 한 쪽”을 적습니다. 실습용 창작 문구이며 글씨 크기를 확인합니다.\",\n          \"종이·파란 펜 제공 / 읽던 책 1권 준비\"\n        ],\n        [\n          \"18~24초 · 책에 꽂기\",\n          \"책갈피를 책 사이에 끼웁니다. 손과 책갈피가 화면 안에 머물게 합니다.\",\n          \"정원 6명·참가비 무료\"\n        ],\n        [\n          \"24~30초 · 완성 전체\",\n          \"책과 책갈피를 함께 보여 줍니다. 같은 재료와 개인정보가 없는 배경을 확인합니다.\",\n          \"신청 안내 문구 연습 / 계정 메시지 '책갈피'\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-shot-plan-sum\",\n      \"type\": \"callout\",\n      \"title\": \"길이 확인\",\n      \"text\": \"6초 × 5장면 = 30초입니다. 별도 시작·끝 화면을 추가하면 전체 길이가 늘어납니다. 이 실습에서는 안내 문구를 다섯 장면 안에 배치합니다.\",\n      \"tone\": \"note\"\n    }\n  ]\n}\n","ai-entry-pre-shoot-check":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-pre-shoot-check\",\n  \"pageNumber\": 20,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"촬영 전에 사람이 확인할 것\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-pre-shoot-check-physical\",\n      \"type\": \"paragraph\",\n      \"text\": \"촬영 준비표를 들고 실제 물건을 펼쳐 놓습니다. 종이와 펜이 있다고 표시만 하지 말고 펜으로 작은 선을 그어 보세요. 책갈피를 끼울 책도 직접 가져옵니다. 영상에 이름이나 연락처가 적힌 쪽지가 보이면 치우고, 다른 사람의 손이나 목소리를 담게 된다면 촬영 범위를 미리 정합니다. 이번 과제는 재료와 작업하는 손만 보여 주어도 다섯 장면을 설명할 수 있습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-pre-shoot-check-phone\",\n      \"type\": \"paragraph\",\n      \"text\": \"스마트폰 상태도 글만으로 확정할 수 없습니다. 배터리와 저장 공간을 확인하고 렌즈를 닦은 뒤, 실제로 사용할 자리에서 짧게 찍어 재생해 봅니다. 글씨가 안 읽히면 종이와 카메라 사이의 거리를 바꾸고, 손이 빛을 가리면 물건의 방향을 조정하세요. 기기의 카메라 메뉴와 저장 방식은 모델마다 다를 수 있습니다. 이 준비표는 촬영 성공을 대신 확인해 주지 않으므로 직접 본 결과에만 체크합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-pre-shoot-check-check-diagram\",\n      \"type\": \"image\",\n      \"assetId\": \"ai-before-shoot\",\n      \"alt\": \"사실 카드 대조, 장면과 자막 대조, 현장 직접 확인의 세 가지 촬영 전 점검을 보여주는 직접 제작 도해\",\n      \"caption\": \"AI가 작성한 표를 실제 준비와 연결할 때는 원자료, 장면, 현장을 각각 확인합니다.\",\n      \"width\": 1467,\n      \"height\": 987,\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\"\n    },\n    {\n      \"blockId\": \"ai-entry-pre-shoot-check-practical-check\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"연노랑 종이·파란 펜·읽던 책 1권을 실제로 펼쳤습니다.\",\n        \"펜으로 선을 그어 보고 필요한 면을 준비했습니다.\",\n        \"스마트폰 배터리와 저장 공간을 확인했습니다.\",\n        \"화면 안의 이름·연락처·개인 메모를 치웠습니다.\",\n        \"촬영 장소 사용과 다른 사람의 등장 여부를 확인했습니다.\",\n        \"짧은 시험 촬영을 재생해 글씨와 손의 동작을 확인했습니다.\"\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-pre-shoot-check-physical-record\",\n      \"type\": \"template\",\n      \"title\": \"직접 확인한 결과 기록\",\n      \"text\": \"확인한 날짜:\\n아직 준비되지 않은 물건:\\n시험 촬영에서 잘 안 보인 부분:\\n바꾼 위치나 거리:\\n다시 촬영할 장면:\\n실제 촬영을 하지 않았다면: 촬영 준비표 작성까지만 완료\"\n    }\n  ]\n}\n","ai-entry-recover-and-continue":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-recover-and-continue\",\n  \"pageNumber\": 21,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"멈춘 지점에서 실습 이어가기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-recover-and-continue-recover\",\n      \"type\": \"paragraph\",\n      \"text\": \"문제가 생기면 마지막으로 확인된 상태를 적습니다. 요청문을 보냈는지, 응답이 왔는지, 복사한 글이 메모에 남았는지를 구분하세요. 전송이 끝나지 않았다면 입력문을 보관하고 연결 상태를 확인합니다. 이미 보낸 메시지가 화면에 보이면 같은 대화에서 결과를 기다리거나 안내된 오류를 읽습니다. 내용이 틀린 문제와 앱이 멈춘 문제는 해결 방법이 다릅니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-recover-and-continue-resume\",\n      \"type\": \"paragraph\",\n      \"text\": \"다른 화면으로 옮기기 전에는 행사 자료와 마지막 요청문을 메모에 남깁니다. 앱을 다시 열거나 브라우저에서 이어 할 때 같은 계정인지도 확인하세요. 메뉴가 도움말과 다르면 새로운 경로를 추측해 누르지 말고 앱 버전과 보이는 메뉴 이름을 적습니다. 공식 문서를 다시 확인한 뒤 가능한 단계부터 이어갑니다. 사용 제한이 원인이라면 재설치로 해결하려 하지 않습니다. 공식 안내는 재설치가 한도를 초기화하지 않는다고 설명합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-recover-and-continue-recovery\",\n      \"type\": \"table\",\n      \"caption\": \"상태에 맞는 다음 동작\",\n      \"columns\": [\n        \"상태\",\n        \"이어갈 방법\"\n      ],\n      \"rows\": [\n        [\n          \"응답 내용이 틀림\",\n          \"틀린 문장과 원래 값을 적어 수정 요청. 새 응답을 다시 대조\"\n        ],\n        [\n          \"메뉴가 안 보임\",\n          \"앱 버전과 화면 이름 기록 → 공식 도움말 확인. 출처는 제공 링크로 직접 열기\"\n        ],\n        [\n          \"앱 멈춤·연결 오류\",\n          \"작성 중인 글 보관 → 앱 다시 열기 → 연결 및 업데이트 확인 → 필요하면 웹에서 같은 계정으로 확인\"\n        ],\n        [\n          \"사용 한도 안내\",\n          \"안내된 기능과 재사용 시점 확인. 저장한 초안을 직접 편집하거나 허용 시점에 재개\"\n        ],\n        [\n          \"이전 대화가 안 보임\",\n          \"계정과 대화 목록 확인. 임시·로그아웃 대화였다면 별도 보관한 글로 재개\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-recover-and-continue-sources\",\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Troubleshooting the ChatGPT mobile app\",\n          \"url\": \"https://help.openai.com/en/articles/7910461-troubleshooting-the-chatgpt-mobile-app\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"The ChatGPT home page\",\n          \"url\": \"https://help.openai.com/en/articles/9125172-the-chatgpt-home-page\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"Temporary chat in ChatGPT\",\n          \"url\": \"https://help.openai.com/en/articles/8914046-temporary-chat-in-chatgpt\",\n          \"publisher\": \"OpenAI\"\n        },\n        {\n          \"title\": \"ChatGPT Free Tier FAQ\",\n          \"url\": \"https://help.openai.com/en/articles/9275245-chatgpt-free-tier-faq\",\n          \"publisher\": \"OpenAI\"\n        }\n      ]\n    }\n  ]\n}\n","ai-entry-independent-task":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-independent-task\",\n  \"pageNumber\": 22,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"조건을 바꿔 혼자 완성하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-independent-task-independent\",\n      \"type\": \"paragraph\",\n      \"text\": \"이제 예시 요청문을 그대로 쓰지 않고 같은 모임의 조건을 바꿔 작업합니다. 바뀌는 값은 시간과 정원, 개인 준비물입니다. 나머지 조건은 공통 행사 자료를 유지합니다. 기존 초안의 숫자가 남지 않도록 새 자료 메모를 만든 뒤 시작하세요. 답안 예시를 보기 전에 안내문과 촬영 체크리스트, 수정 기록을 모두 작성합니다. AI가 만든 글을 직접 고쳐도 좋습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-independent-task-transfer\",\n      \"type\": \"paragraph\",\n      \"text\": \"완성할 때는 바뀐 세 값을 빠짐없이 반영했는지, 없는 정보를 보태지 않았는지, 촬영 순서가 유지되는지 확인합니다. 영상 자막의 시간과 정원, 준비물도 같은 새 조건으로 바꿉니다. 촬영에서는 얼굴과 목소리를 사용하지 않고 재료와 손만 보여 준다는 조건을 추가합니다. 실습을 끝내는 데 실제 계정 메시지나 게시가 필요하지 않습니다. 각 결과물에도 연습용이며 실제 모집이 아니라는 표시를 남기세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-independent-task-new-conditions\",\n      \"type\": \"table\",\n      \"caption\": \"독립 과제의 변경 조건 · 가정 예제\",\n      \"columns\": [\n        \"항목\",\n        \"새 조건\"\n      ],\n      \"rows\": [\n        [\n          \"일시\",\n          \"2026년 11월 14일(토) 17:00~18:00\"\n        ],\n        [\n          \"정원\",\n          \"4명\"\n        ],\n        [\n          \"개인 준비물\",\n          \"읽던 책 2권\"\n        ],\n        [\n          \"촬영 조건\",\n          \"얼굴과 목소리 없이 손과 재료만 촬영\"\n        ],\n        [\n          \"나머지\",\n          \"무료, 연노랑 종이·파란 펜 제공, 가상 장소, 메시지 신청 예시, 5장면×6초 유지\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-independent-task-assignment\",\n      \"type\": \"exercise\",\n      \"title\": \"혼자 해 보는 최종 과제\",\n      \"goal\": \"조건이 바뀐 자료로 안내문과 촬영 준비물을 정확히 갱신합니다.\",\n      \"steps\": [\n        \"변경된 자료 메모와 자신의 첫 요청을 작성합니다.\",\n        \"AI 응답을 읽고 원문과 다른 값·없는 정보·누락을 표시합니다.\",\n        \"수정 요청을 한 번 이상 보내거나 직접 편집하고 이유를 두 가지 남깁니다.\",\n        \"완성 안내문과 촬영 체크리스트를 메모에 저장합니다.\",\n        \"공식 앱 게시자 확인에 사용한 원문 제목과 주소, 확인 날짜를 적습니다.\"\n      ],\n      \"expectedOutput\": \"안내문 1편, 촬영 체크리스트 6항목 이상, 수정 이유 2개, 출처 확인 기록 1개\",\n      \"checks\": [\n        \"17:00~18:00·4명·책 2권을 모두 반영했는가\",\n        \"장면은 5개이고 합계 30초인가\",\n        \"얼굴·목소리 제외 조건이 준비표에 있는가\",\n        \"실제 모집이 아닌 연습임을 표시했는가\"\n      ]\n    }\n  ]\n}\n","ai-entry-independent-solution":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-independent-solution\",\n  \"pageNumber\": 23,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"내 결과와 해설 비교하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-independent-solution-solution-guide\",\n      \"type\": \"paragraph\",\n      \"text\": \"아래 안내문은 가능한 답안 중 하나입니다. 소개 문장까지 같을 필요는 없습니다. 시간과 정원, 준비물이 변경 조건과 맞는지 확인하고, 이전 자료의 값이 남았다면 고칩니다. 특히 두 권의 책을 가져오라는 조건이 제공 재료에 섞이지 않았는지 읽으세요. 참가비와 제공 재료는 바뀌지 않았습니다. 조건에 없는 내용을 더 많이 넣었다고 좋은 결과가 되지는 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-independent-solution-explain\",\n      \"type\": \"paragraph\",\n      \"text\": \"촬영 체크리스트에는 책 두 권 준비와 얼굴·목소리 제외가 있어야 합니다. 다섯 장면의 순서를 유지하고 각 장면을 여섯 초로 편집하면 삼십 초 조건도 맞습니다. 수정 기록은 “고쳤다”로 끝내지 말고 원래 값과 바꾼 값을 적습니다. 실제 촬영을 하지 않았다면 준비표까지 작성했다고 표시하세요. 사실 오류나 근거 없는 정보가 하나라도 남았다면 그 항목을 다시 고친 뒤 완료로 판단합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-independent-solution-solution-copy\",\n      \"type\": \"template\",\n      \"title\": \"독립 과제 안내문 예시\",\n      \"text\": \"[가상의 자체 기획 실습 · 실제 모집 아님]\\n토요일 책갈피 만들기\\n연노랑 종이에 파란 펜으로 책갈피를 만들어 봅니다.\\n일시: 2026년 11월 14일(토) 17:00~18:00\\n장소: 부산의 동네 모임 공간(연습용 가상 장소)\\n정원 4명 / 참가비 무료\\n제공 재료: 연노랑 종이, 파란 펜\\n개인 준비물: 읽던 책 2권\\n신청 방법 예시: 계정 메시지로 '책갈피' 보내기\\n연습용 글이며 실제 신청을 받지 않습니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-independent-solution-assessment\",\n      \"type\": \"table\",\n      \"caption\": \"결과를 판정하는 기준\",\n      \"columns\": [\n        \"기준\",\n        \"확인할 증거\"\n      ],\n      \"rows\": [\n        [\n          \"사실\",\n          \"변경된 세 값과 유지할 조건이 모두 맞고 근거 없는 정보가 없음\"\n        ],\n        [\n          \"검사와 수정\",\n          \"문제 두 가지, 고친 값이나 표현, 고친 이유를 기록\"\n        ],\n        [\n          \"촬영 준비\",\n          \"5장면·30초·책 2권·얼굴과 목소리 제외·장비·배경 점검 포함\"\n        ],\n        [\n          \"출처와 기록\",\n          \"공식 원문을 직접 읽은 기록과 다시 열 수 있는 결과물이 있음\"\n        ]\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-independent-solution-solution-checklist\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"연노랑 종이와 파란 펜을 준비하고 펜이 써지는지 확인합니다.\",\n        \"개인 준비물인 읽던 책 2권을 준비합니다.\",\n        \"스마트폰 배터리와 저장 공간을 확인합니다.\",\n        \"이름·연락처·개인 메모가 화면에 없는지 확인합니다.\",\n        \"얼굴은 화면에서 제외하고 영상에 목소리를 사용하지 않습니다.\",\n        \"정해진 5장면을 각 6초로 편집하며, 자막도 17:00~18:00·4명·책 2권으로 바꿉니다.\",\n        \"전 구간 연습용 표시를 남기고, 설명문에 가상 장소를 포함한 전체 장소 표기를 적습니다.\"\n      ]\n    },\n    {\n      \"blockId\": \"ai-entry-independent-solution-answer-notes\",\n      \"type\": \"callout\",\n      \"title\": \"수정 이유 예시\",\n      \"text\": \"“14:00~15:00을 17:00~18:00으로 바꿨다. 독립 과제에서 시간이 변경됐다.” “읽던 책 1권을 2권으로 고쳤다. 안내문과 촬영 준비물이 같은 새 조건을 따라야 한다.”\",\n      \"tone\": \"note\"\n    }\n  ]\n}\n","ai-entry-save-and-reuse":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"ai-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"ai-entry-save-and-reuse\",\n  \"pageNumber\": 24,\n  \"chapterId\": \"first-ai-project\",\n  \"title\": \"최종 글과 수정 이유를 보관하기\",\n  \"blocks\": [\n    {\n      \"blockId\": \"ai-entry-save-and-reuse-save\",\n      \"type\": \"paragraph\",\n      \"text\": \"실습이 끝나면 메모에 세 구역을 만듭니다. 첫 구역에는 안내문, 둘째에는 촬영 준비표, 셋째에는 사용한 요청과 수정 이유를 넣습니다. 파일이나 메모 제목에 행사 이름과 연습용이라는 표시를 붙이면 실제 운영 자료와 구분하기 쉽습니다. 저장한 뒤 목록으로 돌아가 다시 열어 보세요. 제목만 남고 본문이 빠졌거나 표 일부가 잘렸다면 원래 응답에서 필요한 범위를 다시 복사합니다.\"\n    },\n    {\n      \"blockId\": \"ai-entry-save-and-reuse-reuse\",\n      \"type\": \"paragraph\",\n      \"text\": \"다음에 다른 모임이나 동네 가게의 안내문을 쓸 때도 순서는 같습니다. 그 일의 담당자가 확인한 자료를 새로 모으고, 공개할 정보만 입력한 뒤 글과 준비표를 만듭니다. 이번 예제의 무료나 정원을 그대로 가져가면 안 됩니다. 새 작업의 날짜·비용·준비물은 다시 확인해야 합니다. 남겨 둔 요청문은 필요한 항목을 빠뜨리지 않게 돕는 양식으로 사용하고, 완성된 답변은 새 자료와 다시 대조하세요.\"\n    },\n    {\n      \"blockId\": \"ai-entry-save-and-reuse-record-template\",\n      \"type\": \"template\",\n      \"title\": \"내 작업 기록\",\n      \"text\": \"작업 이름: 토요일 책갈피 만들기 · 연습용\\n사용한 조건: 기본 과제 / 독립 과제 중 선택\\n앱·버전·작업 날짜:\\n확정 자료를 보관한 곳:\\n내 첫 요청:\\n발견한 문제 두 가지:\\n수정한 내용과 이유:\\n최종 안내문:\\n촬영 준비표:\\n직접 연 공식 출처·확인 날짜:\\n실행 범위: 글 작성 / 준비표 작성 / 시험 촬영 / 완성 영상 확인 중 실제 수행한 것만 표시\"\n    },\n    {\n      \"blockId\": \"ai-entry-save-and-reuse-finish\",\n      \"type\": \"checklist\",\n      \"items\": [\n        \"저장한 안내문과 준비표를 다시 열었습니다.\",\n        \"원본 자료와 바뀐 조건을 구분할 수 있습니다.\",\n        \"없는 정보가 나오면 삭제하거나 확인 목록으로 남길 수 있습니다.\",\n        \"출처 링크를 열어 어떤 주장을 확인했는지 설명할 수 있습니다.\",\n        \"실제 하지 않은 촬영이나 게시를 완료라고 기록하지 않았습니다.\"\n      ]\n    }\n  ]\n}\n"}};const pageId=decodeURIComponent(location.hash.slice(1));window.reviewReader=PlatformModuleRegistry.mount(document.getElementById('host'),'ebook-reader',{publication,baseUrl:document.baseURI,pageId},{consumer:'export',onReaderNavigate(value){history.replaceState(history.state,'','#'+encodeURIComponent(value.pageId));}});PlatformModuleStyleRuntime?.apply?.('ebook-reader',document.getElementById('host'),{});</script><noscript>교재를 읽으려면 JavaScript를 켜 주세요.</noscript></body></html>
