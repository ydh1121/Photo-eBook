"assets/0a8ad4813609a226a0ae2d87e7add4d00216709cb23b9b6346d45d39f834a2b1.webp","sha256":"0a8ad4813609a226a0ae2d87e7add4d00216709cb23b9b6346d45d39f834a2b1","bytes":42974,"width":1467,"height":987}},"sourceSha256":"790d28bcc46e578c3e25eeca608465f78d23f15086faf65f975b527d27dce064","bodyPageCount":24,"frontMatterExcluded":true},"pages":{"sns-entry.first-result":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.first-result\",\n  \"pageNumber\": 1,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"사진 한 장에서 시작하는 첫 게시물\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"부산의 동네 책모임을 알리는 글을 자체 기획해봅니다. 결과물은 사진 한 장과 설명문, 댓글 답변 세 개, 반응 기록 한 장입니다. 글을 쓰기 전에는 누가 읽을지 정하고, 작성한 뒤에는 독자가 준비물과 신청 방법을 찾아낼 수 있는지 확인합니다.\",\n      \"blockId\": \"sns-entry.first-result.b01\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"교육용 자체 기획\",\n      \"text\": \"‘토요일 책갈피 만들기’는 연습용 가상 행사입니다. 실제 업체 의뢰나 모집을 뜻하지 않습니다. 예시를 복사할 때도 이 표시를 유지하세요.\",\n      \"tone\": \"note\",\n      \"blockId\": \"sns-entry.first-result.b02\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-finished\",\n      \"alt\": \"크림색 책 사이로 연노랑 책갈피가 보이는 완성 예시\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"caption\": \"독자가 무엇을 만드는 모임인지 사진으로 알아볼 수 있어야 합니다.\",\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\",\n      \"blockId\": \"sns-entry.first-result.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진 앱을 열고 메모를 입력할 수 있으면 시작할 수 있습니다. SNS 계정이 없어도 설명문과 대화 연습을 끝낼 수 있습니다. 실제 앱에 게시하는 과정은 별도의 실행 기록으로 남깁니다.\",\n      \"blockId\": \"sns-entry.first-result.b04\"\n    },\n    {\n      \"type\": \"checklist\",\n      \"items\": [\n        \"사진과 글이 같은 활동을 설명한다.\",\n        \"일시·장소·정원·비용·준비물·신청 방법을 찾을 수 있다.\",\n        \"모르는 질문에 추측으로 답하지 않는다.\",\n        \"게시하지 않은 실습과 실제 반응을 구분한다.\"\n      ],\n      \"blockId\": \"sns-entry.first-result.b05\"\n    }\n  ]\n}\n","sns-entry.one-reader":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.one-reader\",\n  \"pageNumber\": 2,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"누가 이 글을 읽을까요\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"‘부산에 사는 모든 사람’이라고 정하면 첫 문장에 넣을 내용이 쉽게 흐려집니다. 이번 독자는 동네에서 짧은 만들기 활동을 해보고 싶은 성인입니다. 긴 수업을 찾는 사람인지, 책과 함께할 작은 활동을 찾는 사람인지 생각하면 필요한 정보가 달라집니다.\",\n      \"blockId\": \"sns-entry.one-reader.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"이번 사례의 독자 메모\",\n      \"columns\": [\n        \"독자의 상황\",\n        \"궁금할 질문\",\n        \"글에서 줄 정보\"\n      ],\n      \"rows\": [\n        [\n          \"처음 참여하는 동네 사람\",\n          \"한 번 가서 무엇을 하나요?\",\n          \"읽던 책에 쓸 종이 책갈피 만들기\"\n        ],\n        [\n          \"준비 시간이 적은 사람\",\n          \"재료를 사야 하나요?\",\n          \"종이·펜 제공, 읽던 책 1권 준비\"\n        ],\n        [\n          \"주말 일정을 정하는 사람\",\n          \"얼마나 걸리나요?\",\n          \"14:00~15:00, 한 시간\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.one-reader.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"위 상황은 독자를 상상하기 위한 기획 가정입니다. 실제 참여자의 인터뷰나 조사 결과로 소개하면 안 됩니다. 나이·직업·소득을 억지로 덧붙이지 않아도 현재의 질문만으로 글을 정리할 수 있습니다.\",\n      \"blockId\": \"sns-entry.one-reader.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"독자 한 문장 쓰기\",\n      \"goal\": \"누구에게 설명할지 한 문장으로 정한다.\",\n      \"steps\": [\n        \"위 세 질문 중 가장 먼저 답할 질문을 고릅니다.\",\n        \"‘이 글은 ○○한 사람이 ○○을 알도록 쓴다’에 맞춰 적습니다.\"\n      ],\n      \"expectedOutput\": \"독자와 정보가 함께 있는 한 문장\",\n      \"checks\": [\n        \"대상만 쓰고 끝내지 않았는가?\",\n        \"읽은 뒤 알게 될 내용이 있는가?\"\n      ],\n      \"solution\": \"이 글은 동네 만들기 모임을 처음 찾는 사람이 준비물과 참여 시간을 알도록 쓴다.\",\n      \"blockId\": \"sns-entry.one-reader.b04\"\n    }\n  ]\n}\n","sns-entry.useful-promise":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.useful-promise\",\n  \"pageNumber\": 3,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"첫 문장이 약속하는 정보\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사람이 게시물을 읽는 이유를 문장 안에 넣어보세요. 이번 모임의 가치는 읽던 책에 쓸 작은 책갈피를 직접 만든다는 데 있습니다. ‘특별한 경험’처럼 넓은 표현은 어떤 활동인지 설명하지 못합니다. 실제로 준비한 활동을 말하면 사진도 고르기 쉬워집니다.\",\n      \"blockId\": \"sns-entry.useful-promise.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"첫 문장 비교\",\n      \"columns\": [\n        \"초안\",\n        \"읽는 사람이 아직 모르는 것\",\n        \"다듬은 문장\"\n      ],\n      \"rows\": [\n        [\n          \"특별한 시간을 선물합니다.\",\n          \"무엇을 하는가\",\n          \"토요일 한 시간, 읽던 책에 꽂을 책갈피를 만들어봅니다.\"\n        ],\n        [\n          \"누구나 전문가가 됩니다.\",\n          \"확인할 수 없는 성과\",\n          \"종이에 무늬를 그리고 짧은 글을 적는 활동을 준비했습니다.\"\n        ],\n        [\n          \"선착순 마감 임박!\",\n          \"실제 신청·마감 근거 없음\",\n          \"정원은 6명으로 설정했습니다. 수업용 기획 예시입니다.\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.useful-promise.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"독자의 다음 행동도 한 가지로 정합니다. 이 사례에서는 신청 방법을 알아보는 것이며, 실제 모집은 진행하지 않습니다. 게시물 아래에 저장·공유·팔로우·문의 요청을 한꺼번에 붙이면 무엇을 해야 하는지 흐려집니다.\",\n      \"blockId\": \"sns-entry.useful-promise.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"약속과 내용 대조\",\n      \"goal\": \"첫 문장을 사진과 사실 카드에 맞춘다.\",\n      \"steps\": [\n        \"첫 문장에서 활동과 시간을 표시합니다.\",\n        \"사진에서 활동을 확인할 수 있는지 대조합니다.\",\n        \"보장할 수 없는 성과 표현을 지웁니다.\"\n      ],\n      \"expectedOutput\": \"활동을 설명하는 첫 문장 한 개\",\n      \"checks\": [\n        \"유명세·매출·조회수를 약속하지 않았는가?\",\n        \"본문이 첫 문장의 약속을 설명하는가?\"\n      ],\n      \"blockId\": \"sns-entry.useful-promise.b04\"\n    }\n  ]\n}\n","sns-entry.fact-card":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.fact-card\",\n  \"pageNumber\": 4,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"문장을 쓰기 전 사실 카드\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"설명문을 여러 번 고치다 보면 날짜나 준비물이 달라질 수 있습니다. 아래 표를 원본으로 두고 문장·이미지 속 글씨·댓글을 대조하세요. 이 장의 숫자와 장소는 모두 교육용 설정입니다. 정보가 없는 항목은 빈칸을 그럴듯하게 채우지 않습니다.\",\n      \"blockId\": \"sns-entry.fact-card.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"모든 예시에 공통으로 적용하는 설정\",\n      \"columns\": [\n        \"항목\",\n        \"확정한 연습 정보\"\n      ],\n      \"rows\": [\n        [\n          \"행사명\",\n          \"토요일 책갈피 만들기\"\n        ],\n        [\n          \"일시\",\n          \"2026-11-14(토) 14:00~15:00\"\n        ],\n        [\n          \"장소\",\n          \"부산의 동네 모임 공간(연습용 가상 장소)\"\n        ],\n        [\n          \"정원·참가비\",\n          \"6명 · 무료\"\n        ],\n        [\n          \"제공 재료\",\n          \"연노랑 종이·파란 펜\"\n        ],\n        [\n          \"개인 준비물\",\n          \"읽던 책 1권\"\n        ],\n        [\n          \"신청 방법\",\n          \"계정 메시지로 ‘책갈피’를 보냄\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.fact-card.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"연락처, 예약 링크, 이용 후기, 주차, 엘리베이터 정보는 주어지지 않았습니다. ‘주차 가능’, ‘역에서 3분’, ‘지난 모임에서 호평’ 같은 문장을 추가하면 근거 없는 안내가 됩니다. 장소 이름을 실제 상호로 바꾸거나 임의 주소를 붙이지 마세요.\",\n      \"blockId\": \"sns-entry.fact-card.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"넣을 정보 고르기\",\n      \"goal\": \"주어진 정보와 미확인 정보를 가른다.\",\n      \"steps\": [\n        \"‘무료’, ‘책 1권’, ‘주차 가능’ 세 표현을 나눕니다.\",\n        \"카드에서 근거가 있는 두 표현만 본문에 옮깁니다.\"\n      ],\n      \"expectedOutput\": \"사용할 정보 두 개와 보류할 정보 한 개\",\n      \"checks\": [\n        \"무료와 준비물을 정확히 옮겼는가?\",\n        \"주차 가능을 보류했는가?\"\n      ],\n      \"solution\": \"무료와 읽던 책 1권은 설정에 있습니다. 주차 정보는 없으므로 확인 전까지 쓰지 않습니다.\",\n      \"blockId\": \"sns-entry.fact-card.b04\"\n    }\n  ]\n}\n","sns-entry.account-post-feed":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.account-post-feed\",\n  \"pageNumber\": 5,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"계정과 게시물은 무엇이 다른가요\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"SNS에 들어가면 내 소개와 여러 사람의 글이 한 화면에 보여 낯설 수 있습니다. 작업 단위를 나눠 생각해보세요. 계정은 내가 활동하는 자리이고, 프로필은 그 자리를 소개하는 부분입니다. 오늘 만드는 사진과 글 한 묶음은 게시물입니다.\",\n      \"blockId\": \"sns-entry.account-post-feed.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"이번 실습에서 만나는 말\",\n      \"columns\": [\n        \"용어\",\n        \"이 사례에서 하는 일\"\n      ],\n      \"rows\": [\n        [\n          \"계정\",\n          \"연습 글을 작성하고 다른 사람과 대화하는 주체\"\n        ],\n        [\n          \"프로필\",\n          \"누가 어떤 주제로 글을 올리는지 설명\"\n        ],\n        [\n          \"게시물\",\n          \"책갈피 사진과 모임 설명문 한 묶음\"\n        ],\n        [\n          \"피드\",\n          \"여러 게시물을 이어서 보는 화면\"\n        ],\n        [\n          \"댓글·답글\",\n          \"게시물에 남긴 질문과 그 질문에 대한 응답\"\n        ],\n        [\n          \"계정 메시지\",\n          \"게시물 댓글과 구분되는 메시지 대화\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.account-post-feed.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"글 한 개를 수정한다고 계정 전체의 소개가 바뀌지는 않습니다. 반대로 프로필을 바꿔도 이미 올린 글의 날짜나 참가비가 자동으로 수정되지는 않습니다. 수정할 대상이 프로필인지 게시물인지 구분하는 습관이 실수를 줄여줍니다.\",\n      \"blockId\": \"sns-entry.account-post-feed.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"수정할 자리 찾기\",\n      \"goal\": \"정보가 속한 작업 단위를 구별한다.\",\n      \"steps\": [\n        \"모임 날짜가 틀렸을 때 고칠 곳을 적습니다.\",\n        \"계정이 다루는 주제가 바뀌었을 때 고칠 곳을 적습니다.\"\n      ],\n      \"expectedOutput\": \"게시물과 프로필을 구분한 답\",\n      \"checks\": [\n        \"두 문제의 수정 대상이 다른가?\"\n      ],\n      \"solution\": \"날짜는 해당 게시물에서, 계정의 주제는 프로필에서 고칩니다. 다른 게시물에 같은 날짜가 있으면 그 글도 따로 대조합니다.\",\n      \"blockId\": \"sns-entry.account-post-feed.b04\"\n    }\n  ]\n}\n","sns-entry.platform-choice":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.platform-choice\",\n  \"pageNumber\": 6,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"같은 모임을 세 플랫폼에서 설명하기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"플랫폼마다 사용할 수 있는 형식이 겹치므로 한 가지 용도로 단정할 필요는 없습니다. 이번 과제에서는 독자가 받을 정보를 기준으로 역할을 나눕니다. 완성 모습을 보여주는 사진, 손의 움직임을 보여주는 동영상, 경험과 질문을 주고받는 글을 각각 준비하는 방식입니다.\",\n      \"blockId\": \"sns-entry.platform-choice.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"이번 사례에서 맡길 역할\",\n      \"columns\": [\n        \"플랫폼\",\n        \"준비할 내용\",\n        \"추가 작업\"\n      ],\n      \"rows\": [\n        [\n          \"Instagram\",\n          \"책갈피 사진 한 장과 모임 조건\",\n          \"사진 선택·설명문·공개 범위 확인\"\n        ],\n        [\n          \"YouTube\",\n          \"책갈피를 만드는 30초 동영상\",\n          \"촬영·편집·제목·영상 재생 검사\"\n        ],\n        [\n          \"Threads\",\n          \"책갈피를 만드는 이유와 독자의 경험 질문\",\n          \"짧은 경험 글·답글 확인\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.platform-choice.b02\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"sns-platform-roles\",\n      \"alt\": \"한 소재를 사진 설명, 30초 동영상, 경험 질문으로 나눈 도해\",\n      \"width\": 1467,\n      \"height\": 987,\n      \"caption\": \"형식별 역할은 이번 수업의 편집 제안입니다. 플랫폼의 기능을 제한하는 뜻은 아닙니다.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"sns-entry.platform-choice.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"Instagram 공식 앱은 피드·사진·짧은 동영상을, Meta는 Threads의 텍스트 공유와 대화를 설명합니다. YouTube 도움말에는 Shorts 제작 안내가 있습니다. 이 자료만으로 특정 형식의 조회수가 더 높다고 결론 내리지는 않습니다.\",\n      \"blockId\": \"sns-entry.platform-choice.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Instagram 공식 Android 앱\",\n          \"url\": \"https://play.google.com/store/apps/details?hl=ko&id=com.instagram.android\",\n          \"publisher\": \"Instagram / Google Play\"\n        },\n        {\n          \"title\": \"Introducing Threads: A New Way to Share With Text\",\n          \"url\": \"https://about.fb.com/news/2023/07/introducing-threads-new-app-text-sharing/\",\n          \"publisher\": \"Meta\"\n        },\n        {\n          \"title\": \"YouTube Shorts 제작 시작하기\",\n          \"url\": \"https://support.google.com/youtube/answer/10059070?hl=ko\",\n          \"publisher\": \"Google / YouTube\"\n        }\n      ],\n      \"blockId\": \"sns-entry.platform-choice.b05\"\n    }\n  ]\n}\n","sns-entry.first-format":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.first-format\",\n  \"pageNumber\": 7,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"첫 결과물은 사진 한 장과 설명문\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이번 장에서는 사진 한 장을 고르고 설명문을 완성합니다. 아직 동영상이 없어도 시작할 수 있기 때문입니다. Instagram용 글을 기준으로 만들고, 같은 정보가 Threads에서는 어떻게 달라지는지 짧게 비교합니다. 세 앱에 동시에 계정을 만들 필요는 없습니다.\",\n      \"blockId\": \"sns-entry.first-format.b01\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"Threads용 문장 연습\",\n      \"text\": \"[연습용 자체 기획 · 실제 모집 아님]\\n읽던 책에 표시를 남기고 싶어서 종이 책갈피 만들기를 기획했어요. 연노랑 종이에 파란 펜으로 무늬와 한 줄을 적는 활동입니다.\\n책갈피에 직접 적는다면 이름과 짧은 문장 중 무엇을 고르시겠어요?\\n이 글은 수업용 예시이며 실제 모임 신청을 받지 않습니다.\",\n      \"blockId\": \"sns-entry.first-format.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"위 문장은 모임 모집 조건을 모두 담은 안내문이 아니라 대화를 시작하는 글입니다. 실제 모집 안내를 겸하려면 일시·장소·정원·비용·준비물·신청 방법도 함께 제공해야 합니다. 문장을 짧게 만들었다고 필요한 정보를 생략해도 되는 것은 아닙니다.\",\n      \"blockId\": \"sns-entry.first-format.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"형식 선택 이유 적기\",\n      \"goal\": \"사진 게시물로 시작하는 이유를 설명한다.\",\n      \"steps\": [\n        \"현재 준비된 자료를 사진·글·동영상으로 나눕니다.\",\n        \"오늘 완성할 형식 하나와 선택 이유를 적습니다.\"\n      ],\n      \"expectedOutput\": \"‘사진과 확인된 정보가 있어 사진 게시물부터 만든다’와 같은 문장\",\n      \"checks\": [\n        \"다른 형식을 못해서 실패했다고 판단하지 않았는가?\",\n        \"자료와 선택 이유가 연결되는가?\"\n      ],\n      \"blockId\": \"sns-entry.first-format.b04\"\n    }\n  ]\n}\n","sns-entry.official-app":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.official-app\",\n  \"pageNumber\": 8,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"앱을 준비할 때 확인할 것\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"Android에서는 아래 공식 Google Play 링크의 앱 이름과 개발사를 확인하세요. 이름은 Instagram, 개발사 표시는 Instagram입니다. 이 장은 광고 집행이나 유료 구독을 실습에 포함하지 않습니다. 스토어에 광고·인앱 구매가 표시되어 있으므로 모든 부가 기능이 무료라고 읽으면 안 됩니다.\",\n      \"blockId\": \"sns-entry.official-app.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"사용할 계정 정하기\",\n          \"text\": \"개인 계정과 운영 계정을 혼동하지 않도록 현재 프로필 이름을 읽습니다. 로그인 정보가 없으면 계정 복구를 진행하거나 글 파일로 연습을 이어갑니다.\",\n          \"output\": \"사용 계정 또는 계정 없이 진행할 계획\"\n        },\n        {\n          \"title\": \"사진 준비하기\",\n          \"text\": \"선택한 책갈피 사진과 작성 메모를 휴대전화에서 열어봅니다. 사진 접근 권한은 업로드에 필요한 범위인지 내용을 읽고 판단합니다.\",\n          \"output\": \"직접 열리는 사진과 메모\"\n        },\n        {\n          \"title\": \"유료 화면 구분하기\",\n          \"text\": \"광고 만들기·구독·결제 화면은 이번 과제의 제출 조건에 들어 있지 않습니다. 표시가 나오면 진행을 멈추고 일반 작성 작업으로 돌아갑니다.\",\n          \"output\": \"결제하지 않은 실습 경로\"\n        }\n      ],\n      \"blockId\": \"sns-entry.official-app.b02\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"메뉴 확인 범위\",\n      \"text\": \"공식 앱 설명은 확인했습니다. 가입·한국어 Android 게시 버튼의 전체 경로는 이 샘플에서 실행으로 검증하지 않았습니다. 앱 버전이나 버튼 위치를 추정해 안내하지 않습니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"sns-entry.official-app.b03\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Instagram 공식 Android 앱\",\n          \"url\": \"https://play.google.com/store/apps/details?hl=ko&id=com.instagram.android\",\n          \"publisher\": \"Instagram / Google Play\"\n        }\n      ],\n      \"blockId\": \"sns-entry.official-app.b04\"\n    }\n  ]\n}\n","sns-entry.profile-introduction":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.profile-introduction\",\n  \"pageNumber\": 9,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"프로필에 계정의 주제 담기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"프로필은 게시물 한 개를 읽고 계정으로 들어온 사람이 다음 글을 예상하는 데 도움을 줍니다. 실제로 올릴 수 있는 주제를 짧게 적으세요. 이 사례의 소개는 동네 모임 콘텐츠를 연습한다는 점을 밝히고, 책갈피 글과 연결되게 씁니다.\",\n      \"blockId\": \"sns-entry.profile-introduction.b01\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"연습 계정 소개문\",\n      \"text\": \"동네 책모임 콘텐츠를 직접 기획하고 기록합니다. 사진·짧은 글·모임 안내문을 연습하는 계정입니다. 이 장의 책갈피 모임은 교육용 예시입니다.\",\n      \"blockId\": \"sns-entry.profile-introduction.b02\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"소개문을 고칠 때\",\n      \"columns\": [\n        \"확인할 점\",\n        \"이번 예시에 적용\"\n      ],\n      \"rows\": [\n        [\n          \"내가 누구인지\",\n          \"동네 모임 콘텐츠를 연습하는 사람\"\n        ],\n        [\n          \"어떤 글을 올릴지\",\n          \"사진·짧은 글·모임 안내문\"\n        ],\n        [\n          \"오해할 정보가 없는지\",\n          \"실제 모임 운영·고객 실적을 주장하지 않음\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.profile-introduction.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"프로필 사진은 본인이 사용해도 되는 사진이나 직접 만든 기호를 고릅니다. 다른 가게의 로고를 넣으면 그 가게의 공식 계정처럼 보일 수 있습니다. 연습 이름과 소개문을 메모에 저장한 뒤, 실제 프로필 수정은 현재 화면에서 항목을 확인하며 진행하세요.\",\n      \"blockId\": \"sns-entry.profile-introduction.b04\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"소개문 줄이기\",\n      \"goal\": \"계정의 주제가 드러나는 두 문장을 쓴다.\",\n      \"steps\": [\n        \"위 예시에서 본인이 계속 올릴 주제를 고릅니다.\",\n        \"직접 운영하지 않는 모임이나 업체를 운영한다고 쓴 부분이 없는지 읽습니다.\"\n      ],\n      \"expectedOutput\": \"사실에 맞는 소개문 두 문장\",\n      \"checks\": [\n        \"오늘 한 번만 올릴 행사를 계정 전체 소개로 쓰지 않았는가?\",\n        \"이름·연락처 등 불필요한 개인 정보를 넣지 않았는가?\"\n      ],\n      \"blockId\": \"sns-entry.profile-introduction.b05\"\n    }\n  ]\n}\n","sns-entry.photo-selection":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.photo-selection\",\n  \"pageNumber\": 10,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"독자의 질문에 답하는 사진\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"‘예쁜 사진’만 기준으로 고르면 활동이 드러나지 않는 장면을 고르기 쉽습니다. 이번 게시물의 질문은 무엇을 만드는 모임인지입니다. 완성 책갈피가 책에 꽂힌 장면은 결과를, 종이와 펜은 준비할 재료를 보여줍니다.\",\n      \"blockId\": \"sns-entry.photo-selection.b01\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"bookmark-finished\",\n      \"alt\": \"책과 완성 책갈피가 함께 보여 쓰임새를 알 수 있는 장면\",\n      \"width\": 1122,\n      \"height\": 1402,\n      \"caption\": \"첫 사진 후보: 책갈피의 완성 모습과 쓰임새가 함께 보입니다.\",\n      \"credit\": \"Personal Edu · AI 생성 학습 이미지\",\n      \"blockId\": \"sns-entry.photo-selection.b02\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"사진 세 종류를 고르는 기준\",\n      \"columns\": [\n        \"후보\",\n        \"잘 보여주는 정보\",\n        \"첫 사진 판단\"\n      ],\n      \"rows\": [\n        [\n          \"재료 전체\",\n          \"종이와 펜을 사용함\",\n          \"준비물 설명에 사용\"\n        ],\n        [\n          \"손이 무늬를 그리는 장면\",\n          \"직접 만드는 활동\",\n          \"과정 소개에 사용\"\n        ],\n        [\n          \"책에 꽂힌 완성품\",\n          \"무엇을 만들고 어디에 쓰는지\",\n          \"이번 첫 게시물에 선택\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.photo-selection.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"제공 이미지는 학습용 제작 예시입니다. 실제 행사 현장 사진이나 참여자 후기처럼 설명하지 않습니다. 직접 촬영한 사진으로 바꿀 때도 같은 질문을 적용하세요. 책갈피가 너무 작아 보이면 책과 책갈피 쪽으로 촬영 범위를 좁힙니다.\",\n      \"blockId\": \"sns-entry.photo-selection.b04\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"선택 근거 붙이기\",\n      \"goal\": \"사진을 고른 이유를 독자의 질문과 연결한다.\",\n      \"steps\": [\n        \"사진 후보 하나를 고릅니다.\",\n        \"‘독자가 ○○을 알 수 있어서’로 이유를 적습니다.\"\n      ],\n      \"expectedOutput\": \"사진 한 장과 선택 이유\",\n      \"checks\": [\n        \"색감만으로 이유를 설명하지 않았는가?\",\n        \"실제로 사진에 보이는 것을 적었는가?\"\n      ],\n      \"blockId\": \"sns-entry.photo-selection.b05\"\n    }\n  ]\n}\n","sns-entry.photo-preparation":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.photo-preparation\",\n  \"pageNumber\": 11,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"잘리는 부분과 불필요한 정보\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"SNS의 미리보기에서는 사진 가장자리가 다르게 보일 수 있습니다. 책갈피가 화면 끝에 붙어 있으면 일부가 잘렸을 때 의미가 약해집니다. 원본을 남겨 두고 편집본을 만든 뒤, 실제 작성 화면에서 책갈피 전체와 책의 관계가 보이는지 확인하세요.\",\n      \"blockId\": \"sns-entry.photo-preparation.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"원본 보관\",\n          \"text\": \"휴대전화 사진 앱에서 원본이 남도록 사본으로 편집합니다. 사본 저장 방법은 기기의 사진 앱에 표시된 설명을 따릅니다.\",\n          \"output\": \"원본과 편집본\"\n        },\n        {\n          \"title\": \"주제 주변 정리\",\n          \"text\": \"책갈피가 분명하게 보이는 범위를 남깁니다. 펜이나 손을 모두 지워야 하는 것은 아닙니다. 활동을 설명하는 부분은 유지합니다.\",\n          \"output\": \"용도가 보이는 사진\"\n        },\n        {\n          \"title\": \"배경 확대 검사\",\n          \"text\": \"책의 본문, 택배 송장, 휴대전화 알림, 다른 사람 얼굴처럼 공개할 필요가 없는 정보가 있는지 확대해 살핍니다.\",\n          \"output\": \"공개할 사진 선택\"\n        }\n      ],\n      \"blockId\": \"sns-entry.photo-preparation.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진에 행사 일시를 크게 적는다면 설명문에도 같은 내용을 써두세요. 이미지 속 글씨만으로 모든 정보를 전달하면 작은 화면에서 놓치거나 사진을 볼 수 없는 독자가 정보를 받기 어렵습니다. 이 장에서는 사진은 활동을 보여주고 본문은 조건을 설명하게 나눕니다.\",\n      \"blockId\": \"sns-entry.photo-preparation.b03\"\n    },\n    {\n      \"type\": \"checklist\",\n      \"items\": [\n        \"원본을 덮어쓰지 않았다.\",\n        \"책갈피의 모양과 쓰임새를 볼 수 있다.\",\n        \"읽을 필요가 없는 개인정보가 보이지 않는다.\",\n        \"작성 화면에서 잘린 부분을 다시 살폈다.\"\n      ],\n      \"blockId\": \"sns-entry.photo-preparation.b04\"\n    }\n  ]\n}\n","sns-entry.caption-structure":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.caption-structure\",\n  \"pageNumber\": 12,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"본문을 네 덩어리로 나누기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"한 번에 멋진 글을 쓰려고 하기보다 독자가 찾을 정보를 순서대로 놓아보세요. 활동 한 문장, 참여 조건, 준비물, 신청 안내가 있으면 초안의 뼈대가 생깁니다. 연습용 표시를 글 맨 앞에 두어 뒤의 안내를 실제 모집으로 오해하지 않게 합니다.\",\n      \"blockId\": \"sns-entry.caption-structure.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"설명문의 역할\",\n      \"columns\": [\n        \"부분\",\n        \"넣을 내용\",\n        \"확인 질문\"\n      ],\n      \"rows\": [\n        [\n          \"활동\",\n          \"읽던 책에 꽂을 책갈피 만들기\",\n          \"사진과 같은 활동인가?\"\n        ],\n        [\n          \"참여 조건\",\n          \"날짜·시간·장소·정원·참가비\",\n          \"참여 여부를 판단할 수 있는가?\"\n        ],\n        [\n          \"준비\",\n          \"종이·파란 펜 제공, 책 1권 지참\",\n          \"제공 재료와 지참 물품이 구분되는가?\"\n        ],\n        [\n          \"다음 행동\",\n          \"계정 메시지로 ‘책갈피’\",\n          \"독자가 보낼 말을 알 수 있는가?\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.caption-structure.b02\"\n    },\n    {\n      \"type\": \"image\",\n      \"assetId\": \"sns-caption-anatomy\",\n      \"alt\": \"본문에서 활동, 참여 조건, 준비물, 신청 안내의 역할을 구분한 도해\",\n      \"width\": 1467,\n      \"height\": 1067,\n      \"caption\": \"연습용 표시는 별도로 유지하고, 네 덩어리가 같은 설명을 반복하지 않게 씁니다.\",\n      \"credit\": \"Personal Edu · 직접 제작 학습 도해 · 실제 앱 화면 아님\",\n      \"blockId\": \"sns-entry.caption-structure.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"초안 작성\",\n      \"goal\": \"사실 카드만 이용해 설명문을 쓴다.\",\n      \"steps\": [\n        \"연습용 표시를 적습니다.\",\n        \"네 덩어리를 순서대로 씁니다.\",\n        \"장소·주차·후기 등 새 사실을 추가하지 않았는지 대조합니다.\"\n      ],\n      \"expectedOutput\": \"사진에 붙일 초안 한 개\",\n      \"checks\": [\n        \"사실 카드의 일시와 일치하는가?\",\n        \"책은 지참 물품으로 적었는가?\",\n        \"실제 모집 아님을 밝혔는가?\"\n      ],\n      \"blockId\": \"sns-entry.caption-structure.b04\"\n    }\n  ]\n}\n","sns-entry.caption-worked-example":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.caption-worked-example\",\n  \"pageNumber\": 13,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"완성 문장과 고친 이유\",\n  \"blocks\": [\n    {\n      \"type\": \"template\",\n      \"title\": \"사진 한 장에 붙일 완성 설명문\",\n      \"text\": \"[연습용 자체 기획 · 실제 모집 아님]\\n토요일 한 시간, 읽던 책에 꽂을 책갈피를 만들어보는 모임을 기획했어요.\\n\\n‘토요일 책갈피 만들기’\\n2026-11-14(토) 14:00~15:00\\n부산의 동네 모임 공간(연습용 가상 장소)\\n정원 6명 · 참가비 무료\\n\\n연노랑 종이와 파란 펜을 제공합니다. 읽던 책 1권을 준비해주세요.\\n신청 안내 문구 연습: 계정 메시지로 ‘책갈피’를 보내주세요.\\n이 게시물은 수업용 예시이며 실제 신청을 받지 않습니다.\",\n      \"blockId\": \"sns-entry.caption-worked-example.b01\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이 글은 사진에서 알 수 없는 일시와 참가 조건을 본문에서 보충합니다. ‘종이·펜 제공’과 ‘책 1권 준비’를 나눠 적어 가져올 물건이 분명합니다. 신청 방법을 보여주면서도 연습 예시라는 사실을 앞뒤에서 밝혀 실제 신청으로 이어지지 않게 했습니다.\",\n      \"blockId\": \"sns-entry.caption-worked-example.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"‘지금 안 하면 후회하는 특별한 모임’이라는 초안이 있었다면 활동과 조건으로 바꾸세요. 이 단계의 기준은 화려한 표현보다도 독자가 필요한 정보를 찾아낼 수 있는지입니다. 익숙한 말투로 고쳐도 날짜·정원·비용·준비물은 그대로 유지합니다.\",\n      \"blockId\": \"sns-entry.caption-worked-example.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"중간 점검\",\n      \"goal\": \"완성 글에서 핵심 정보 여섯 묶음을 찾는다.\",\n      \"steps\": [\n        \"일시, 장소, 정원, 비용, 준비물, 신청 방법에 표시합니다.\",\n        \"사실 카드와 여섯 묶음을 대조합니다.\"\n      ],\n      \"expectedOutput\": \"여섯 묶음이 모두 맞는 게시물\",\n      \"checks\": [\n        \"여섯 묶음 중 빠진 것은 없는가?\",\n        \"연습용 표시가 남아 있는가?\"\n      ],\n      \"solution\": \"여섯 묶음이 모두 맞으면 다음 쪽으로 갑니다. 하나라도 다르면 사실 카드로 돌아가 해당 문장만 고칩니다.\",\n      \"blockId\": \"sns-entry.caption-worked-example.b04\"\n    }\n  ]\n}\n","sns-entry.image-description":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.image-description\",\n  \"pageNumber\": 14,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"사진을 보지 않아도 전해지는 설명\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진의 대체 설명은 사진이 전달하는 정보를 글로 제공합니다. W3C는 이미지가 가진 정보와 문맥에 맞게 대체 텍스트를 작성하도록 설명합니다. 이 사진에서는 책갈피의 모양과 쓰임새가 중요합니다. 카메라 기종이나 모든 물건의 위치를 길게 나열할 필요는 없습니다.\",\n      \"blockId\": \"sns-entry.image-description.b01\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"사진 대체 설명 예시\",\n      \"text\": \"크림색 책 사이에 연노랑 종이 책갈피가 꽂혀 있다. 책 위로 나온 부분에 파란 잎무늬가 보인다. 책갈피 만들기 활동의 완성 예시다.\",\n      \"blockId\": \"sns-entry.image-description.b02\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"본문과 대체 설명의 차이\",\n      \"columns\": [\n        \"본문\",\n        \"사진 대체 설명\"\n      ],\n      \"rows\": [\n        [\n          \"언제, 어디서, 무엇을 준비할지 설명\",\n          \"사진에 보이는 완성 형태와 쓰임새 설명\"\n        ],\n        [\n          \"사진 밖의 행사 조건 포함\",\n          \"사진에 없는 후기·장소 정보를 추측하지 않음\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.image-description.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"Instagram의 대체 텍스트 입력 경로는 현재 한국어 Android 화면으로 확인하지 못했습니다. 해당 항목이 보이면 준비한 설명을 넣고 저장 결과를 점검하세요. 항목을 찾지 못하면 사진 설명을 본문에 덧붙여 전달하고, 메뉴 확인 상태는 미확인으로 남깁니다.\",\n      \"blockId\": \"sns-entry.image-description.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Informative Images\",\n          \"url\": \"https://www.w3.org/WAI/tutorials/images/informative/\",\n          \"publisher\": \"W3C Web Accessibility Initiative\"\n        },\n        {\n          \"title\": \"Instagram 대체 텍스트 도움말 — 원문 확인 대기\",\n          \"url\": \"https://help.instagram.com/503708446705527\",\n          \"publisher\": \"Instagram\"\n        }\n      ],\n      \"blockId\": \"sns-entry.image-description.b05\"\n    }\n  ]\n}\n","sns-entry.posting-preparation":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.posting-preparation\",\n  \"pageNumber\": 15,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"사진과 글을 작성 화면에 옮기기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"실제 앱에서 작업하는 사람은 아래 세 결과를 순서대로 확인합니다. 사진 한 장이 선택되었는지, 설명문이 빠짐없이 들어갔는지, 마지막 게시 동작 전에 미리 볼 수 있는지가 핵심입니다. 현재 버튼 이름과 위치를 이 책의 그림처럼 외우는 방식으로 안내하지 않습니다.\",\n      \"blockId\": \"sns-entry.posting-preparation.b01\"\n    },\n    {\n      \"type\": \"steps\",\n      \"items\": [\n        {\n          \"title\": \"사진 선택 확인\",\n          \"text\": \"현재 앱에서 사진 게시물을 작성하는 기능을 찾습니다. 선택한 사진을 열어 완성 책갈피가 보이는지 살핍니다. 형식이 동영상이나 다른 기능으로 바뀌었다면 사진 선택 단계로 돌아갑니다.\",\n          \"output\": \"선택한 사진 한 장\"\n        },\n        {\n          \"title\": \"설명문 옮기기\",\n          \"text\": \"13쪽 문장을 입력하거나 붙여넣습니다. 첫 줄의 연습용 표시, 시간, 읽던 책 1권이 끝까지 들어갔는지 읽습니다.\",\n          \"output\": \"사진과 설명문이 함께 있는 작성 상태\"\n        },\n        {\n          \"title\": \"사본 남기기\",\n          \"text\": \"작성 중인 글을 메모에도 보관합니다. 앱을 닫아도 초안이 남는다고 가정하지 말고 보관된 메모를 직접 다시 열어봅니다.\",\n          \"output\": \"앱 밖에서도 열리는 본문 사본\"\n        }\n      ],\n      \"blockId\": \"sns-entry.posting-preparation.b02\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"현재 확인된 범위\",\n      \"text\": \"공식 사진 게시 도움말의 본문 조회가 막혀 한국어 Android 전체 메뉴 경로는 확인하지 못했습니다. 위 순서는 작업 결과를 확인하는 안내이며 검증된 버튼 경로가 아닙니다. 막히면 사진과 글 파일로 실습을 마치고 게시 상태를 ‘미실행’으로 기록하세요.\",\n      \"tone\": \"note\",\n      \"blockId\": \"sns-entry.posting-preparation.b03\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Instagram 사진 게시 도움말 — 원문 확인 대기\",\n          \"url\": \"https://help.instagram.com/442418472487929\",\n          \"publisher\": \"Instagram\"\n        }\n      ],\n      \"blockId\": \"sns-entry.posting-preparation.b04\"\n    }\n  ]\n}\n","sns-entry.audience-setting":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.audience-setting\",\n  \"pageNumber\": 16,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"누가 보게 할지 정하기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"사진과 글이 준비되었더라도 공개 범위는 따로 판단해야 합니다. 본인만 보관할지, 허락한 사람에게 보여줄지, 누구에게나 공개할지 의도를 적은 뒤 현재 앱 설정과 맞는지 확인하세요. ‘초안’, ‘비공개 계정’, ‘일부 공개’는 플랫폼마다 같은 뜻이나 기능을 가진 이름이 아닙니다.\",\n      \"blockId\": \"sns-entry.audience-setting.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"이번 연습에서 고를 진행 방식\",\n      \"columns\": [\n        \"방식\",\n        \"남길 결과\",\n        \"기록할 상태\"\n      ],\n      \"rows\": [\n        [\n          \"메모와 사진으로만 연습\",\n          \"완성 설명문·사진·댓글 답변\",\n          \"게시 미실행\"\n        ],\n        [\n          \"직접 확인한 범위로 공유\",\n          \"공유 대상·작성 화면·게시 후 확인\",\n          \"설정과 실제 결과를 기록\"\n        ],\n        [\n          \"일반 공개 예시 게시\",\n          \"실제 모집 아님이 드러나는 게시물\",\n          \"공개 범위와 게시 시각 기록\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.audience-setting.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이 사례를 그대로 공개한다면 사진이나 글을 본 사람이 실제 모집으로 오해하지 않게 연습용 표시를 유지하세요. 실제 행사를 알리고 싶다면 운영자의 허락과 확정 정보를 갖춘 뒤 자신의 사실 카드로 다시 작성해야 합니다.\",\n      \"blockId\": \"sns-entry.audience-setting.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"의도와 설정 맞추기\",\n      \"goal\": \"보여주려는 사람과 실제 공유 범위를 대조한다.\",\n      \"steps\": [\n        \"진행 방식 하나를 고릅니다.\",\n        \"공유하려는 대상을 한 문장으로 적습니다.\",\n        \"현재 설정을 확인할 수 없으면 게시를 보류하고 메모를 보관합니다.\"\n      ],\n      \"expectedOutput\": \"공개 의도와 확인 상태\",\n      \"checks\": [\n        \"확인하지 못한 공개 범위를 추정하지 않았는가?\",\n        \"연습용 행사를 실제 모집처럼 올리지 않았는가?\"\n      ],\n      \"blockId\": \"sns-entry.audience-setting.b04\"\n    },\n    {\n      \"type\": \"sources\",\n      \"items\": [\n        {\n          \"title\": \"Instagram 공개 범위 도움말 — 원문 확인 대기\",\n          \"url\": \"https://help.instagram.com/448523408565555\",\n          \"publisher\": \"Instagram\"\n        }\n      ],\n      \"blockId\": \"sns-entry.audience-setting.b05\"\n    }\n  ]\n}\n","sns-entry.after-posting":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.after-posting\",\n  \"pageNumber\": 17,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"저장한 뒤 다시 읽는 순서\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"작성 화면에서 잘 보였던 글도 실제 게시 화면에서는 접히거나 줄이 달라질 수 있습니다. 게시를 실행했다면 자신의 게시물을 다시 열어 사진, 첫 문장, 날짜, 준비물, 신청 안내를 읽어보세요. 앱에 게시하지 않았다면 메모를 닫았다가 다시 열어 같은 검사를 합니다.\",\n      \"blockId\": \"sns-entry.after-posting.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"오류별 돌아갈 곳\",\n      \"columns\": [\n        \"발견한 문제\",\n        \"고칠 대상\",\n        \"다시 확인할 결과\"\n      ],\n      \"rows\": [\n        [\n          \"책갈피가 잘림\",\n          \"사진 선택·잘라내기\",\n          \"책갈피의 쓰임새가 보임\"\n        ],\n        [\n          \"15:00 대신 16:00으로 적음\",\n          \"해당 설명문\",\n          \"14:00~15:00과 일치\"\n        ],\n        [\n          \"책을 제공한다고 적음\",\n          \"준비물 문장\",\n          \"읽던 책 1권을 지참\"\n        ],\n        [\n          \"연습용 표시가 빠짐\",\n          \"첫 줄·마지막 문장\",\n          \"실제 모집으로 읽히지 않음\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.after-posting.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"실제 게시물의 수정·삭제 경로는 현재 앱 도움말과 화면에서 확인하세요. 버튼이 불분명한 상태에서 같은 글을 반복해서 올리면 중복 게시가 생길 수 있습니다. 이미 공개된 글의 중요한 정보가 틀렸다면 고친 내용과 시점을 기록해 다음 안내에서도 같은 오류가 반복되지 않게 합니다.\",\n      \"blockId\": \"sns-entry.after-posting.b03\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"정정 기록 예시\",\n      \"text\": \"발견: 준비물에 ‘책 제공’이라고 적음\\n수정: ‘읽던 책 1권을 준비해주세요’\\n확인: 사실 카드와 대조 완료\\n실행 상태: 메모 수정 / 실제 앱 수정 여부는 별도 기록\",\n      \"blockId\": \"sns-entry.after-posting.b04\"\n    }\n  ]\n}\n","sns-entry.comment-replies":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.comment-replies\",\n  \"pageNumber\": 18,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"질문에 필요한 만큼 답하기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"댓글은 글에서 빠진 정보를 찾는 단서가 됩니다. 질문을 받은 내용부터 답하고, 필요한 경우 사실 카드의 한 항목을 보충하세요. 아래 대화는 연습용이며 실제 참여자가 남긴 댓글이 아닙니다.\",\n      \"blockId\": \"sns-entry.comment-replies.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"세 가지 질문과 답변 연습\",\n      \"columns\": [\n        \"댓글 예시\",\n        \"답변 예시\",\n        \"답변의 근거\"\n      ],\n      \"rows\": [\n        [\n          \"준비물이 있나요?\",\n          \"연습 설정에서는 읽던 책 1권을 준비합니다. 연노랑 종이와 파란 펜은 제공하는 구성입니다. 실제 모집은 진행하지 않아요.\",\n          \"제공 재료와 지참 물품을 구분\"\n        ],\n        [\n          \"몇 시에 끝나나요?\",\n          \"안내문에 설정한 시간은 14:00~15:00입니다. 한 시간으로 기획한 수업용 예시예요.\",\n          \"일시\"\n        ],\n        [\n          \"신청은 어디로 하나요?\",\n          \"신청 안내 문구는 계정 메시지로 ‘책갈피’를 보내는 방식으로 연습했습니다. 이 예시는 실제 신청을 받지 않습니다.\",\n          \"신청 방식과 사례 성격\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.comment-replies.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"‘본문을 읽어보세요’라고만 답하면 상대가 어떤 부분을 놓쳤는지 알기 어렵습니다. 같은 질문이 반복되면 설명문의 위치나 표현을 손볼 수 있습니다. 준비물 질문이 많다면 ‘개인 준비물: 읽던 책 1권’처럼 눈에 들어오는 문장으로 고쳐보세요.\",\n      \"blockId\": \"sns-entry.comment-replies.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"답변 작성\",\n      \"goal\": \"사실 카드에 근거한 답변 세 개를 만든다.\",\n      \"steps\": [\n        \"위 질문에 자신의 말투로 답합니다.\",\n        \"일시·준비물·실제 모집 아님이 유지되는지 대조합니다.\"\n      ],\n      \"expectedOutput\": \"댓글 답변 세 개\",\n      \"checks\": [\n        \"질문에 바로 답했는가?\",\n        \"알 수 없는 정보를 덧붙이지 않았는가?\"\n      ],\n      \"blockId\": \"sns-entry.comment-replies.b04\"\n    }\n  ]\n}\n","sns-entry.unknown-question":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.unknown-question\",\n  \"pageNumber\": 19,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"모르는 질문을 받았을 때\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"‘주차할 수 있나요?’라는 질문에는 이 자료만으로 답할 수 없습니다. 답변을 빨리 남기려다 주차 가능 여부를 만들어내면 상대의 이동 계획에 영향을 줄 수 있습니다. 확인한 내용과 확인하지 못한 내용을 구분해 말하는 연습을 합니다.\",\n      \"blockId\": \"sns-entry.unknown-question.b01\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"모르는 질문에 대한 답변\",\n      \"text\": \"이 사례에는 주차 정보가 정해져 있지 않습니다. 실제 모집을 진행한다면 장소 운영자에게 확인한 뒤 안내해야 하는 항목입니다. 지금은 교육용 예시로만 봐주세요.\",\n      \"blockId\": \"sns-entry.unknown-question.b02\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"질문에 따라 다음 행동 정하기\",\n      \"columns\": [\n        \"질문\",\n        \"확인할 곳 또는 행동\"\n      ],\n      \"rows\": [\n        [\n          \"주차·엘리베이터가 있나요?\",\n          \"실제 장소가 확정된 뒤 운영자에게 확인\"\n        ],\n        [\n          \"전화로 신청할 수 있나요?\",\n          \"연습 설정에는 연락처가 없으므로 추가하지 않음\"\n        ],\n        [\n          \"지난 참여자 후기가 있나요?\",\n          \"실제 후기 자료가 없으므로 만들어 쓰지 않음\"\n        ],\n        [\n          \"참가비가 무료인가요?\",\n          \"사실 카드에 있으므로 무료라고 답함\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.unknown-question.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"계정 메시지에서 연락처나 주소를 받았더라도 공개 댓글에 옮길 필요는 없습니다. 질문 내용만 적은 작업 메모로 정리하면 다음 게시물의 소재를 찾을 수 있습니다. 개인 이름을 기록해야만 질문을 분류할 수 있는 것은 아닙니다.\",\n      \"blockId\": \"sns-entry.unknown-question.b04\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"답할지 보류할지 판단\",\n      \"goal\": \"세 질문을 확인 가능 여부로 분류한다.\",\n      \"steps\": [\n        \"무료 여부, 주차 여부, 책 준비 여부를 나눕니다.\",\n        \"보류한 질문에는 확인할 대상을 적습니다.\"\n      ],\n      \"expectedOutput\": \"즉시 답변 두 개와 확인 대기 한 개\",\n      \"checks\": [\n        \"주차 정보만 확인 대기로 남겼는가?\"\n      ],\n      \"solution\": \"참가비와 책 준비는 카드에 있으므로 답합니다. 주차는 장소 정보가 없으므로 확인 전 답변을 보류합니다.\",\n      \"blockId\": \"sns-entry.unknown-question.b05\"\n    }\n  ]\n}\n","sns-entry.reaction-meaning":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.reaction-meaning\",\n  \"pageNumber\": 20,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"좋아요와 신청은 다른 기록\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"좋아요가 늘었다고 모임 신청이 늘었다고 볼 수는 없습니다. 각각 어떤 행동을 센 것인지 기록하세요. 이 장에서는 반응의 크기로 점수를 매기지 않습니다. 게시물과 질문을 읽고, 다음 글에서 무엇을 고칠지 설명할 수 있는지가 목표입니다.\",\n      \"blockId\": \"sns-entry.reaction-meaning.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"반응을 읽는 기초\",\n      \"columns\": [\n        \"항목\",\n        \"기록할 내용\",\n        \"바로 결론 내리지 않을 것\"\n      ],\n      \"rows\": [\n        [\n          \"좋아요\",\n          \"화면에 표시된 좋아요 수와 확인 시각\",\n          \"참가 확정 인원\"\n        ],\n        [\n          \"댓글\",\n          \"댓글 수와 반복된 질문의 내용\",\n          \"댓글마다 서로 다른 사람이라고 가정\"\n        ],\n        [\n          \"저장·조회\",\n          \"본인 화면에서 제공되는 항목만 이름 그대로\",\n          \"안 보이는 값을 0으로 입력\"\n        ],\n        [\n          \"계정 메시지\",\n          \"해당 글을 보고 왔는지 확인한 문의 내용\",\n          \"메시지를 받았다는 사실만으로 신청 완료\"\n        ],\n        [\n          \"참가 확정\",\n          \"실제 모집에서 정한 확인 절차의 결과\",\n          \"연습 기록을 실제 실적으로 소개\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.reaction-meaning.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"조회수의 집계 방식은 서비스와 형식에 따라 다릅니다. 같은 단어가 보여도 다른 플랫폼의 수치를 그대로 비교하지 마세요. 저장수나 분석 메뉴가 보이지 않으면 ‘확인 불가’라고 적습니다. 유료 기능이나 계정 전환을 해야만 이 입문 과제를 통과하는 구조로 만들지 않습니다.\",\n      \"blockId\": \"sns-entry.reaction-meaning.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"0과 미확인 구분\",\n      \"goal\": \"기록의 의미를 정확히 적는다.\",\n      \"steps\": [\n        \"댓글이 실제로 없을 때와 저장수 화면을 못 봤을 때를 구분합니다.\"\n      ],\n      \"expectedOutput\": \"댓글 0 / 저장수 확인 불가\",\n      \"checks\": [\n        \"모르는 값을 0으로 바꾸지 않았는가?\"\n      ],\n      \"blockId\": \"sns-entry.reaction-meaning.b04\"\n    }\n  ]\n}\n","sns-entry.reaction-log":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.reaction-log\",\n  \"pageNumber\": 21,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"같은 시간 간격으로 기록하기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"게시 직후와 이틀 뒤의 수치를 같은 기준으로 비교하면 시간이 더 지난 글에 유리합니다. 연습에서는 작성 당일과 24시간 뒤처럼 확인할 시점을 정해둡니다. 24시간은 이 과제에서 정한 관찰 간격이며 성과를 보장하는 운영 규칙이 아닙니다.\",\n      \"blockId\": \"sns-entry.reaction-log.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"설명용 가상 반응 기록 — 실제 계정 실적 아님\",\n      \"columns\": [\n        \"항목\",\n        \"게시 직후\",\n        \"24시간 뒤\"\n      ],\n      \"rows\": [\n        [\n          \"게시 상태\",\n          \"연습용 가정\",\n          \"연습용 가정\"\n        ],\n        [\n          \"좋아요\",\n          \"0\",\n          \"4\"\n        ],\n        [\n          \"댓글\",\n          \"0\",\n          \"2\"\n        ],\n        [\n          \"저장수\",\n          \"확인 불가\",\n          \"확인 불가\"\n        ],\n        [\n          \"댓글 내용\",\n          \"없음\",\n          \"준비물 질문 1건·시간 질문 1건\"\n        ],\n        [\n          \"수정할 점\",\n          \"아직 판단 보류\",\n          \"준비물을 별도 줄로 표시\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.reaction-log.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"댓글 2개를 참가 신청 2명으로 계산하지 않습니다. 누가 무엇을 물었는지 보면 안내문을 고칠 근거가 생깁니다. 반응이 모두 0이어도 날짜와 준비물이 읽히는지 스스로 점검하고, 이해하기 어려운 문장 하나를 고쳐 기록할 수 있습니다.\",\n      \"blockId\": \"sns-entry.reaction-log.b03\"\n    },\n    {\n      \"type\": \"template\",\n      \"title\": \"내 기록에 남길 항목\",\n      \"text\": \"게시물 파일명 또는 링크:\\n실제 게시 / 메모 연습:\\n게시 시각과 확인 시각:\\n화면에서 확인한 항목과 값:\\n반복된 질문 또는 스스로 발견한 문제:\\n다음에 고칠 한 문장:\",\n      \"blockId\": \"sns-entry.reaction-log.b04\"\n    },\n    {\n      \"type\": \"callout\",\n      \"title\": \"가상 수치의 용도\",\n      \"text\": \"위 0·4·2는 기록 방법을 설명하기 위해 만든 값입니다. 실제 성과·예상 반응·이 수업의 효과로 인용하지 않습니다.\",\n      \"tone\": \"note\",\n      \"blockId\": \"sns-entry.reaction-log.b05\"\n    }\n  ]\n}\n","sns-entry.one-revision":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.one-revision\",\n  \"pageNumber\": 22,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"다음 글에서 한 가지 고치기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"한 번에 사진, 첫 문장, 게시 시간까지 모두 바꾸면 무엇 때문에 읽기 쉬워졌는지 설명하기 어렵습니다. 이번에는 준비물 문장만 고칩니다. 관찰한 질문과 수정한 부분이 연결되는지 보세요.\",\n      \"blockId\": \"sns-entry.one-revision.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"반응에서 수정으로\",\n      \"columns\": [\n        \"확인한 내용\",\n        \"수정 전\",\n        \"수정 후\"\n      ],\n      \"rows\": [\n        [\n          \"준비물을 묻는 질문이 있음\",\n          \"종이와 펜을 제공해요. 책과 함께 만나요.\",\n          \"제공 재료: 연노랑 종이·파란 펜\\n개인 준비물: 읽던 책 1권\"\n        ],\n        [\n          \"모임 시간을 다시 물음\",\n          \"토요일 오후에 만나요.\",\n          \"2026-11-14(토) 14:00~15:00\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.one-revision.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"위 두 수정안을 동시에 적용할 수는 있지만, 비교 연습을 한다면 한 가지를 골라 이유를 남기세요. 반응이 좋아졌더라도 글 한두 개만으로 원인을 확정하지 않습니다. ‘준비물 문장을 찾기 쉬워졌다’는 문장 점검과 ‘신청이 늘었다’는 결과 주장은 필요한 근거가 다릅니다.\",\n      \"blockId\": \"sns-entry.one-revision.b03\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"수정 이유 한 줄\",\n      \"goal\": \"문제와 수정 행동을 연결한다.\",\n      \"steps\": [\n        \"위 수정안 중 하나를 선택합니다.\",\n        \"‘○○을 물어봐서 ○○ 문장을 고쳤다’로 적습니다.\",\n        \"사실 카드의 값은 그대로인지 확인합니다.\"\n      ],\n      \"expectedOutput\": \"수정문과 이유 한 줄\",\n      \"checks\": [\n        \"주차 등 새 사실을 덧붙이지 않았는가?\",\n        \"숫자의 증가만으로 성공을 단정하지 않았는가?\"\n      ],\n      \"solution\": \"준비물을 물어봐서 제공 재료와 지참 물품을 두 줄로 나눴다.\",\n      \"blockId\": \"sns-entry.one-revision.b04\"\n    }\n  ]\n}\n","sns-entry.independent-practice":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.independent-practice\",\n  \"pageNumber\": 23,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"예시를 덮고 한 번 더 만들기\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"이제 13쪽 완성문을 보지 않고 사진과 사실 카드만 이용해 게시물을 다시 만듭니다. 같은 뜻을 다른 문장으로 적어도 됩니다. 이번 독자에게 필요한 정보를 빠뜨리지 않는지 확인하는 과제입니다.\",\n      \"blockId\": \"sns-entry.independent-practice.b01\"\n    },\n    {\n      \"type\": \"exercise\",\n      \"title\": \"첫 게시물 묶음 완성\",\n      \"goal\": \"사진·본문·댓글·기록을 한 묶음으로 남긴다.\",\n      \"steps\": [\n        \"완성 책갈피 사진을 고르고 선택 이유를 한 문장으로 적습니다.\",\n        \"사실 카드의 정보로 본문을 다시 쓰고 연습용 표시를 넣습니다.\",\n        \"준비물·시간·주차 질문에 각각 답합니다.\",\n        \"실제 게시 또는 메모 연습 중 실행한 방식을 표시합니다.\",\n        \"확인한 반응 또는 가상 기록을 구분해 적고 수정문 하나를 남깁니다.\"\n      ],\n      \"expectedOutput\": \"사진 1장, 설명문 1개, 답변 3개, 기록표 1개, 수정문 1개\",\n      \"checks\": [\n        \"사진과 본문이 같은 활동을 보여준다.\",\n        \"필수 정보 여섯 묶음이 사실 카드와 맞는다.\",\n        \"주차 질문을 확인 대기로 처리했다.\",\n        \"실제 게시하지 않았다면 그 사실을 기록했다.\"\n      ],\n      \"blockId\": \"sns-entry.independent-practice.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"도움이 필요하면 12쪽의 네 덩어리 표만 펼쳐보세요. 빠르게 끝냈다면 독자를 ‘바쁜 직장인’으로 바꿨을 때 첫 문장에서 어떤 정보를 앞에 둘지 설명해봅니다. 새로운 대상이 생겼다고 운영 시간을 임의로 바꾸지는 않습니다.\",\n      \"blockId\": \"sns-entry.independent-practice.b03\"\n    },\n    {\n      \"type\": \"checklist\",\n      \"items\": [\n        \"사진 원본과 편집본을 구분해 보관했다.\",\n        \"완성 본문을 앱 밖에서도 다시 열 수 있다.\",\n        \"틀린 정보가 발견되면 사실 카드로 돌아갈 수 있다.\"\n      ],\n      \"blockId\": \"sns-entry.independent-practice.b04\"\n    }\n  ]\n}\n","sns-entry.assessment-solutions":"{\n  \"schemaVersion\": 1,\n  \"bookId\": \"sns-entry\",\n  \"editionId\": \"sample-20261106-v1\",\n  \"pageId\": \"sns-entry.assessment-solutions\",\n  \"pageNumber\": 24,\n  \"chapterId\": \"first-bookmark-post\",\n  \"title\": \"완성 기준과 풀이\",\n  \"blocks\": [\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"아래 표는 이 샘플의 학습 점검 기준입니다. 네 항목이 모두 ‘완료’에 해당하면 사진·글·대화·기록의 한 사이클을 마친 것입니다. 실제 앱 게시를 하지 않았다면 콘텐츠 준비 완료와 게시 미실행을 함께 기록합니다. 팔로워나 좋아요 수는 점수에 넣지 않습니다.\",\n      \"blockId\": \"sns-entry.assessment-solutions.b01\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"첫 게시물 묶음 평가\",\n      \"columns\": [\n        \"기준\",\n        \"완료\",\n        \"수정 후 재확인\",\n        \"아직 없음\"\n      ],\n      \"rows\": [\n        [\n          \"정보 전달\",\n          \"사진과 필수 정보 여섯 묶음이 일치\",\n          \"정보가 하나 이상 빠지거나 사진과 다름\",\n          \"본문 또는 사진이 없음\"\n        ],\n        [\n          \"사실 구분\",\n          \"연습 표시·확정 정보·미확인을 구분\",\n          \"주차·후기 등 추측이 섞임\",\n          \"사실 카드와 대조하지 않음\"\n        ],\n        [\n          \"대화\",\n          \"세 질문에 근거대로 답함\",\n          \"모르는 질문에 단정하여 답함\",\n          \"답변을 만들지 않음\"\n        ],\n        [\n          \"회고\",\n          \"실행 상태·기록 시점·수정 이유가 있음\",\n          \"가상 수치와 실제 반응이 섞임\",\n          \"기록이나 수정문이 없음\"\n        ]\n      ],\n      \"blockId\": \"sns-entry.assessment-solutions.b02\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"풀이 1. 저장수가 보이지 않을 때는 ‘확인 불가’입니다. 0은 실제로 0임을 확인했을 때만 씁니다. 풀이 2. 주차 질문에는 정보가 없다고 답하고 확인할 대상을 적습니다. 풀이 3. 첫 사진을 완성품으로 고른 이유는 무엇을 만들고 어디에 쓰는지 한눈에 전하기 위해서입니다.\",\n      \"blockId\": \"sns-entry.assessment-solutions.b03\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"다음 작업에서는 같은 사실 카드로 영상 원고를 만들 수 있습니다. 영상 편집 입문 샘플의 다섯 장면을 참고하되, 사진 게시물의 필수 정보를 영상 설명문에서도 다시 확인하세요. 이번 24쪽은 입문 샘플 한 장이며 400쪽 정규 교재의 완성본을 뜻하지 않습니다.\",\n      \"blockId\": \"sns-entry.assessment-solutions.b04\"\n    }\n  ]\n}\n"}};const pageId=decodeURIComponent(location.hash.slice(1));window.reviewReader=PlatformModuleRegistry.mount(document.getElementById('host'),'ebook-reader',{publication,baseUrl:document.baseURI,pageId},{consumer:'export',onReaderNavigate(value){history.replaceState(history.state,'','#'+encodeURIComponent(value.pageId));}});PlatformModuleStyleRuntime?.apply?.('ebook-reader',document.getElementById('host'),{});</script><noscript>교재를 읽으려면 JavaScript를 켜 주세요.</noscript></body></html>
