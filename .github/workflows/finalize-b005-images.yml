name: Finalize b005 images
on:
  push:
    paths: ['image-upload-staging/finalize-b005.json']
permissions:
  contents: write
jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify repository assets and runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          cfg=json.load(open('image-upload-staging/finalize-b005.json'))
          for s in cfg['slots']:
              p=Path(s['repo_path']); b=p.read_bytes()
              assert len(b)==s['size'],(p,len(b),s['size'])
              assert b[:4]==b'RIFF' and b[8:12]==b'WEBP',p
              assert hashlib.sha256(b).hexdigest()==s['sha256'],p
          rt=Path('public/assets/image-slots-v1.js').read_text()
          for s in cfg['slots']:
              line=next((x for x in rt.splitlines() if f"'{s['slot_id']}':{{" in x),None)
              assert line and 'ready:true' in line and "rev:'b005'" in line,(s['slot_id'],line)
          idx=Path('public/index.html').read_text()
          assert '/assets/image-slots-v1.js?v=5' in idx
          PY
      - name: Verify Cloudflare deployment bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          cfg=json.load(open('image-upload-staging/finalize-b005.json'))
          base='https://photo-ebook.pages.dev'
          pending={s['slot_id']:s for s in cfg['slots']}
          last={}
          for attempt in range(36):
              for sid,s in list(pending.items()):
                  url=base+s['repo_path'].removeprefix('public')+'?v=b005'
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'photo-ebook-deploy-check'})
                      with urllib.request.urlopen(req,timeout=20) as r: b=r.read()
                      digest=hashlib.sha256(b).hexdigest(); last[sid]=(r.status,len(b),digest)
                      if r.status==200 and len(b)==s['size'] and digest==s['sha256']: pending.pop(sid,None)
                  except Exception as e: last[sid]=str(e)
              if not pending: break
              time.sleep(10)
          if pending: raise SystemExit(f'live assets not ready: {pending.keys()} / {last}')
          with urllib.request.urlopen(base+'/assets/image-slots-v1.js?v=5',timeout=20) as r: rt=r.read().decode()
          for s in cfg['slots']:
              line=next((x for x in rt.splitlines() if f"'{s['slot_id']}':{{" in x),None)
              assert line and 'ready:true' in line and "rev:'b005'" in line,(s['slot_id'],line)
          PY
      - name: Record applied state
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import datetime,json,subprocess
          cfg=json.load(open('image-upload-staging/finalize-b005.json'))
          image_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          p=Path('content/image-prompts/v1/applied-status.json')
          try: data=json.loads(p.read_text())
          except Exception: data={}
          data.setdefault('batches',{})['b005']={
              'status':'applied','image_commit':image_commit,'runtime_revision':'b005','runtime_script_version':5,
              'deployment':'https://photo-ebook.pages.dev','verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'slots':[{'slot_id':s['slot_id'],'repo_path':s['repo_path'],'sha256':s['sha256'],'size':s['size']} for s in cfg['slots']]
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          status=Path('content/image-prompts/v1/deployment-status-b005.json')
          status.write_text(json.dumps(data['batches']['b005'],ensure_ascii=False,indent=2)+'\n')
          log=Path('content/image-prompts/v1/generation-failure-log.md')
          text=log.read_text() if log.exists() else '# Generation failure log\n'
          marker='## b005 resolved'
          if marker not in text:
              text += f"\n\n{marker}\n- portfolio-food-store: resolved and deployed\n- skill-portrait-retouch: resolved with Korean adult subjects and deployed\n- skill-product-retouch: resolved with Korean adult retoucher and deployed\n- verified production image commit: `{image_commit}`\n"
          log.write_text(text)
          PY
      - name: Commit verification state
        run: |
          set -euo pipefail
          rm -rf image-upload-staging
          git config user.name photo-ebook-image-bot
          git config user.email actions@users.noreply.github.com
          git add content/image-prompts/v1/applied-status.json content/image-prompts/v1/deployment-status-b005.json content/image-prompts/v1/generation-failure-log.md image-upload-staging
          git commit -m 'Record verified b005 image deployment'
          git push origin HEAD:main
