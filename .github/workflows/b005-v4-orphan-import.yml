name: One-shot b005-v4 image import

on:
  push:
    paths:
      - 'image-upload-staging/b005-v4-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild, verify, activate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, re, tarfile, urllib.request

          shas = [
            'eb2c59567680e69645e65cef007579189d4418f1','80f78be662184034c8596cf850221f92bec5cfdf','f15eb277d5a9920d425f370824aae62245ca1b8e','b93e9285d37fc856cbed8a853ccb1890e6c48843','56139faf15f8db81a5abccb910066cca6a491157','866e67a806e5d35014ace2e35458099b486f4e1a','7878435f1340f731f9282b85a2dda80762b81b01','1caf092b3539c38513cf87a67d15830eeeb094bf','40574a7697b2684da4adc041da35c40253405fd5','a3d16d733084fa90fb50e907d9f4161003d853bc','ef892bd114670c866f7acb67435b5c80d84b3bec','623e74c43108896e966d9304ed78f663345d58c2','1ff3071f1de5612170b2641c0b61a6f1f0b18bd4','a5c09c7d9a2cbc897913ac49d888c3b8a31a1028','017af0bdc599e8cd1124ab5f8e138bf8f96b7882','dd6affa722b75b17e0828f49bb6ee74ca324a12e','ba7846029e9a8af72c67a3d28ffae4de1def2d70','abb4151a1739fc46ae91f896c76fba26e3816d5e','8b541ebaf110242ade0c458c398e104710d59254','e385973b6307675c34069287e19a93b0ddfb6fe1','277a228c4f6aaeea79212b128662828f28b727bb','ddbe839590fe57eb370b9f71a190299058076e2c','040d1035284190bb185863093854b0792fd5189a','9c0a78af4c88614c2eb508b18d4577f3892fd6ce','a1e9f97c1382c49d8f3ee93c429051529956385f','f3976412de9353f51860de38259c9be30a4123d2','832c1fc17e98c7ac75476f0f264112d8478916aa','87901af55434a167f2156bc89167df1023f71532','53d03c0a60699d4eecbb9026bdac0207dd2effac','2f596de03b091d3a8a7a441bc56af28164276855','a15b4cf76d8e69ac289bd49cc95c8b7c5cb020f4','01e51e4a32b75e099f08700317fd8a07c64d7c60','41279ef56e4cf656c6a1573181eaf505809e3c0c'
          ]
          slots = [
            ('portfolio-product-brand','public/assets/images/generated/v1/portfolio/product-brand.webp',22172,'12ed25275657bb9c05d2222eeb2e211d699a02c77ebcc591eb1858a79fc5391c'),
            ('portfolio-professional-profile','public/assets/images/generated/v1/portfolio/professional-profile.webp',21472,'440b35c7e95d5aaa59d31c96b61eced2dae31b5998410185d5467e7ce9b6d533'),
            ('portfolio-studio-process','public/assets/images/generated/v1/portfolio/studio-process.webp',39118,'100f4960d67be683416264f3afb5b3a478bad8b58bbaf11ce4d7b248d9c98483'),
            ('portfolio-food-store','public/assets/images/generated/v1/portfolio/food-store.webp',46088,'8b29bd931cec10119bc4d4b4897b632b73f0668fb4ea7cc0d3b02be85763478a'),
            ('skill-portrait-retouch','public/assets/images/generated/v1/skills/portrait-retouch.webp',33022,'e7c9907689474f210548885890060e87114c73e178d60df86c38334018caab1e'),
            ('skill-product-retouch','public/assets/images/generated/v1/skills/product-retouch.webp',29938,'2c7726ccdafdbf3d512acb831231a2801f815451ad8f970f1881b93c8abcd25e')
          ]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          texts = []
          for sha in shas:
            req = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req) as r: data=json.load(r)
            raw=base64.b64decode(data['content'])
            texts.append(raw.decode('utf-8'))
          archive=base64.b64decode(''.join(texts), validate=True)
          expected='ac91ce77f5d89daf057b5a26918deca3d583b04615f1a55f56647b6f65b9fb64'
          actual=hashlib.sha256(archive).hexdigest()
          if actual != expected: raise SystemExit(f'archive sha mismatch {actual} != {expected}')
          p=Path('/tmp/b005.tar.gz'); p.write_bytes(archive)
          with tarfile.open(p,'r:gz') as tf: tf.extractall('.')
          for slot_id,path,size,sha256 in slots:
            f=Path(path)
            if not f.is_file() or f.stat().st_size != size: raise SystemExit(f'bad size {path}')
            b=f.read_bytes()
            if b[:4] != b'RIFF' or b[8:12] != b'WEBP': raise SystemExit(f'not webp {path}')
            if hashlib.sha256(b).hexdigest()!=sha256: raise SystemExit(f'bad sha {path}')

          ids={x[0] for x in slots}
          runtime=Path('public/assets/image-slots-v1.js')
          lines=runtime.read_text().splitlines(); out=[]; seen=set()
          for line in lines:
            matched=next((sid for sid in ids if f"'{sid}':{{" in line),None)
            if matched:
              seen.add(matched); line=line.replace('ready:false','ready:true')
              if re.search(r"rev:'[^']+'",line): line=re.sub(r"rev:'[^']+'","rev:'b005'",line)
              else:
                pos=line.rfind('}'); line=line[:pos]+",rev:'b005'"+line[pos:]
            out.append(line)
          if seen != ids: raise SystemExit(f'missing runtime ids {ids-seen}')
          runtime.write_text('\n'.join(out)+'\n')

          mp=Path('content/image-prompts/v1/manifest.json'); m=json.loads(mp.read_text()); seen=set()
          for s in m['slots']:
            if s['slot_id'] in ids: s['ready']=True; seen.add(s['slot_id'])
          if seen != ids: raise SystemExit(f'missing manifest ids {ids-seen}')
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')

          idx=Path('public/index.html'); t=idx.read_text(); t,n=re.subn(r'/assets/image-slots-v1\.js\?v=\d+','/assets/image-slots-v1.js?v=5',t,count=1)
          if n!=1: raise SystemExit('image-slots script tag missing')
          idx.write_text(t)
          PY

      - name: Commit verified b005 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf image-upload-staging
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/images/generated/v1 public/assets/image-slots-v1.js public/index.html content/image-prompts/v1/manifest.json image-upload-staging
          if git diff --cached --quiet; then
            echo 'b005 already applied; nothing to commit'
            exit 0
          fi
          git commit -m 'Apply generated portfolio and retouch image batch b005'
          git pull --rebase origin main
          git push origin HEAD:main
