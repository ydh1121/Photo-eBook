name: Finalize simplified image pipeline
on:
  push:
    paths: [b007-cleanup-trigger.txt]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('AGENTS.md'); t=p.read_text()
          old='`본문/slot 확인 → 생성 → QA → WebP → Drive mirror → Git binary → ready:true → Prompt Queue applied → 배포 검증`'
          new='`본문/slot 확인 → slot별 독립 prompt → 고화질 PNG 생성 → QA → Drive PNG 보관 → 결정론적 WebP 변환 → Drive WebP 보관 → Git 최종 WebP → ready:true → Prompt Queue applied → 배포 검증`'
          if old in t: t=t.replace(old,new)
          marker='실제 generation은 slot별 독립 call을 연속 수행한다. 여러 slot을 한 canvas에 합치는 multi-image 요청은 금지한다.'
          extra='\n\n신규 작업에서 tar/base64/blob staging/orphan blob 복구를 정상 파이프라인으로 사용하지 않는다. 한 slot의 실패는 그 slot에서만 멈추고 다른 완료 slot은 보존한다.'
          if extra.strip() not in t: t=t.replace(marker,marker+extra)
          p.write_text(t)
          PY
          rm -rf image-upload-staging
          rm -f b007-cleanup-trigger.txt drive-webp-import-trigger.txt
          rm -f scripts/image/activate-b007-core.py scripts/image/activate-b007-status.py
          rm -f .github/workflows/b005-v4-orphan-import.yml .github/workflows/b006-blob-presence.yml .github/workflows/b006-recovery-diagnostic.yml .github/workflows/b006-recovery-import.yml .github/workflows/drive-webp-import-b007.yml .github/workflows/finalize-b005-images.yml .github/workflows/image-binary-import.yml .github/workflows/image-blob-import.yml .github/workflows/image-blob-import-v2.yml .github/workflows/image-blob-import-v3.yml .github/workflows/b007-legacy-import.yml .github/workflows/b007-activate.yml .github/workflows/b007-live-verify.yml .github/workflows/b007-cleanup.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Finalize slot-based image pipeline'
          git push
