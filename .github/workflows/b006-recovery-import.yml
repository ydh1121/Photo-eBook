name: Recover verified b006 image batch

on:
  push:
    paths:
      - 'image-upload-staging/b006-recovery-trigger.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild orphan archive and verify final WebPs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, re, tarfile, urllib.request

          stage = Path('image-upload-staging')
          cfg = json.loads((stage / 'ready.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']

          chunks = []
          for i, sha in enumerate(cfg['blob_shas']):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              if data.get('encoding') != 'base64':
                  raise SystemExit(f'blob {i} unexpected encoding: {data.get("encoding")}')
              raw = base64.b64decode(data['content'])
              chunks.append(raw.decode('utf-8'))
              print(f'blob {i:02d} ok {sha} chars={len(raw)}')

          encoded = ''.join(chunks)
          archive = base64.b64decode(encoded, validate=True)
          actual_archive_sha = hashlib.sha256(archive).hexdigest()
          print(f'archive sha256={actual_archive_sha}')
          print(f'legacy expected={cfg.get("archive_sha256")}')

          archive_path = Path('/tmp/b006-recovery.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as tf:
              tf.extractall('.')

          for slot in cfg['slots']:
              p = Path(slot['repo_path'])
              if not p.is_file():
                  raise SystemExit(f'missing asset: {p}')
              b = p.read_bytes()
              if len(b) != slot['size']:
                  raise SystemExit(f'size mismatch: {p} {len(b)} != {slot["size"]}')
              if len(b) < 12 or b[:4] != b'RIFF' or b[8:12] != b'WEBP':
                  raise SystemExit(f'not webp: {p}')
              digest = hashlib.sha256(b).hexdigest()
              if digest != slot['sha256']:
                  raise SystemExit(f'asset sha mismatch: {p}: {digest} != {slot["sha256"]}')
              print(f'asset ok {slot["slot_id"]} {len(b)} {digest}')

          slot_ids = {x['slot_id'] for x in cfg['slots']}
          rev = 'b006'
          runtime = Path('public/assets/image-slots-v1.js')
          lines = runtime.read_text().splitlines()
          out, seen = [], set()
          for line in lines:
              matched = next((sid for sid in slot_ids if f"'{sid}':{{" in line), None)
              if matched:
                  seen.add(matched)
                  line = line.replace('ready:false', 'ready:true')
                  if re.search(r"rev:'[^']+'", line):
                      line = re.sub(r"rev:'[^']+'", f"rev:'{rev}'", line)
                  else:
                      pos = line.rfind('}')
                      if pos < 0:
                          raise SystemExit(f'cannot set rev for {matched}')
                      line = line[:pos] + f",rev:'{rev}'" + line[pos:]
              out.append(line)
          if seen != slot_ids:
              raise SystemExit(f'runtime slots missing: {sorted(slot_ids-seen)}')
          runtime.write_text('\n'.join(out) + '\n')

          manifest_path = Path('content/image-prompts/v1/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest_seen = set()
          for slot in manifest['slots']:
              if slot['slot_id'] in slot_ids:
                  slot['ready'] = True
                  manifest_seen.add(slot['slot_id'])
          if manifest_seen != slot_ids:
              raise SystemExit(f'manifest slots missing: {sorted(slot_ids-manifest_seen)}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          index = Path('public/index.html')
          text = index.read_text()
          text, count = re.subn(
              r'/assets/image-slots-v1\.js\?v=\d+',
              '/assets/image-slots-v1.js?v=6',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('image-slots runtime script tag not found')
          index.write_text(text)

          batch_path = Path('content/image-prompts/v1/batch-status-002.json')
          batch = json.loads(batch_path.read_text())
          drive_ids = {
              'portfolio-product-brand':'1GygnwNtz6MMbcjtoErkncx5693V2oBCb',
              'portfolio-professional-profile':'1tmnNyw3y_AtZy76CH_1tQsLXj8b7K2VH',
              'portfolio-studio-process':'1SvCvQkyg13v88XIIjfpTcDdT4bRcGzzH',
              'portfolio-food-store':'1wjoajbBJQmcwo9CAsVJgAJheHMvkSuVQ',
              'skill-portrait-retouch':'1sYtpjjD0MyeR9yL96X0YIyk-fqTzmqDp',
              'skill-product-retouch':'1XgqTD1hxLuk11jixXjiRlLApKZ0Dp7Nt',
          }
          batch['status'] = 'applied'
          batch['runtime_revision'] = 'b006'
          batch['recovery_from'] = 'b005-v4-import-failure'
          for slot in batch['slots']:
              if slot['slot_id'] in slot_ids:
                  slot['status'] = 'applied'
                  slot['drive_file_id'] = drive_ids[slot['slot_id']]
                  slot['ready'] = True
                  slot.pop('failure_code', None)
          batch_path.write_text(json.dumps(batch, ensure_ascii=False, indent=2) + '\n')

          applied_dir = Path('content/image-prompts/v1/applied')
          applied_dir.mkdir(parents=True, exist_ok=True)
          applied = {
              'batch_id':'b006-recovery',
              'status':'applied',
              'replaces_false_record':'b005-v4',
              'runtime_revision':'b006',
              'runtime_script_version':6,
              'legacy_archive_sha256':cfg.get('archive_sha256'),
              'reconstructed_archive_sha256':actual_archive_sha,
              'slots':[
                  {
                      'slot_id':s['slot_id'],
                      'path':'/' + s['repo_path'].removeprefix('public/'),
                      'size':s['size'],
                      'sha256':s['sha256'],
                      'drive_file_id':drive_ids[s['slot_id']],
                      'ready':True,
                      'status':'applied',
                  }
                  for s in cfg['slots']
              ],
          }
          (applied_dir / 'b006-recovery.json').write_text(json.dumps(applied, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit verified binaries and activation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf image-upload-staging
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/images/generated/v1 \
                  public/assets/image-slots-v1.js \
                  public/index.html \
                  content/image-prompts/v1/manifest.json \
                  content/image-prompts/v1/batch-status-002.json \
                  content/image-prompts/v1/applied/b006-recovery.json \
                  image-upload-staging
          git commit -m 'Recover and apply verified image batch b006'
          git pull --rebase origin main
          git push origin HEAD:main
