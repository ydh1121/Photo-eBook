name: Import original Drive WebPs PR b009

on:
  pull_request:
    branches: [main]
    paths:
      - 'drive-pr-trigger-b009.txt'

permissions:
  contents: write

jobs:
  import-originals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download and verify Drive originals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, http.cookiejar, json, re

          config = json.loads(Path('content/image-status/v1/drive-import-b009.json').read_text())
          assets = config['assets']
          if len(assets) != 40:
              raise SystemExit(f'expected 40 replacement assets, found {len(assets)}')

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          by_name = {}
          for item in assets:
              file_id = item['drive_id']
              errors = []
              data = None
              for url in (
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  f'https://drive.google.com/uc?export=download&id={file_id}',
              ):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                      with opener.open(req, timeout=45) as response:
                          candidate = response.read()
                      if len(candidate) == item['bytes'] and candidate[:4] == b'RIFF' and candidate[8:12] == b'WEBP':
                          data = candidate
                          break
                      errors.append(f'{url}: bytes={len(candidate)} head={candidate[:12]!r}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              if data is None:
                  raise SystemExit(f"download failed {item['name']}: " + ' | '.join(errors))
              sha = hashlib.sha256(data).hexdigest()
              if sha != item['sha256']:
                  raise SystemExit(f"sha mismatch {item['name']}: {sha} != {item['sha256']}")
              path = Path(item['repo_path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              by_name[item['name']] = item
              print(f"verified {item['name']} {len(data)} {sha}")

          runtime = Path('public/assets/image-slots-v1.js')
          lines = runtime.read_text().splitlines()
          updated = []
          count = 0
          for line in lines:
              if re.match(r"\s*'[^']+':\{path:", line):
                  count += 1
                  line = re.sub(r'ready:(?:true|false)', 'ready:true', line)
                  if re.search(r"rev:'[^']+'", line):
                      line = re.sub(r"rev:'[^']+'", "rev:'b009'", line)
                  else:
                      line = re.sub(r'\}(,?)$', lambda m: ",rev:'b009'}" + m.group(1), line)
              updated.append(line)
          if count != 46:
              raise SystemExit(f'expected 46 runtime slots, found {count}')
          runtime.write_text('\n'.join(updated) + '\n')

          index = Path('public/index.html')
          html = index.read_text()
          html, changed = re.subn(r'/assets/image-slots-v1\.js\?v=\d+', '/assets/image-slots-v1.js?v=9', html, count=1)
          if changed != 1:
              raise SystemExit('image slot script tag not found')
          index.write_text(html)

          manifest_path = Path('content/image-prompts/v1/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if len(manifest.get('slots', [])) != 46:
              raise SystemExit(f"expected 46 manifest slots, found {len(manifest.get('slots', []))}")
          for slot in manifest['slots']:
              slot['ready'] = True
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          status_names = {
              'skill-space-correction':'skill-space-correction.webp',
              'skill-raw-culling':'skill-raw-culling.webp',
              'skill-batch-basic-edit':'skill-batch-basic-edit.webp',
              'skill-tether-shooting':'skill-tether-shooting.webp',
              'skill-portfolio-building':'skill-portfolio-building.webp',
              'skill-delivery-process':'skill-delivery-process.webp',
          }
          for slot_id, name in status_names.items():
              status_path = Path(f'content/image-status/v1/{slot_id}.json')
              status = json.loads(status_path.read_text())
              item = by_name[name]
              status['status'] = 'ready'
              status['ready'] = True
              status.setdefault('webp', {})
              status['webp'].update({
                  'status':'ready',
                  'drive_file_id':item['drive_id'],
                  'repo_path':item['repo_path'],
                  'bytes':item['bytes'],
                  'sha256':item['sha256'],
              })
              status['updated_at'] = '2026-08-18T15:05:00+09:00'
              status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')

          queue_path = Path('content/image-status/v1/next-generation-queue.json')
          queue = json.loads(queue_path.read_text())
          queue['status'] = 'completed'
          for item in queue.get('slots', []):
              item['status'] = 'ready'
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + '\n')

          runtime_paths = re.findall(r"path:'([^']+\.webp)'", runtime.read_text())
          if len(runtime_paths) != 46:
              raise SystemExit(f'expected 46 runtime image paths, found {len(runtime_paths)}')
          for runtime_path in runtime_paths:
              file_path = Path('public') / runtime_path.removeprefix('/')
              if not file_path.exists():
                  raise SystemExit(f'missing {file_path}')
              binary = file_path.read_bytes()
              if binary[:4] != b'RIFF' or binary[8:12] != b'WEBP':
                  raise SystemExit(f'not webp {file_path}')
          print('all 46 production image paths verified')
          PY

      - name: Commit originals to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/images/generated/v1 public/assets/image-slots-v1.js public/index.html content/image-prompts/v1/manifest.json content/image-status/v1
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Replace production images with original Drive WebPs b009'
          git push origin "HEAD:${HEAD_REF}"
