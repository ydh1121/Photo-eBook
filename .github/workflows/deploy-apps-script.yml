name: Deploy Apps Script backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbzBVn9oXNWbBVCKV46t_0j5qRJ26ao1gNJneIHIA1nm9EyNnYW-_Wa8FX_JI10_O1E6

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: config
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          if [[ -n "$APPS_SCRIPT_ID" && -n "$CLASPRC_JSON" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apps Script auto-deploy is waiting for APPS_SCRIPT_ID and CLASPRC_JSON repository secrets."
          fi

      - name: Set up Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.config.outputs.ready == 'true'
        run: npm install --global @google/clasp@latest

      - name: Configure clasp
        if: steps.config.outputs.ready == 'true'
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "rootDir": "apps-script"
          }
          EOF

      - name: Push Apps Script source
        if: steps.config.outputs.ready == 'true'
        run: clasp push --force

      - name: Update existing web app deployment
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          clasp update-deployment "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "GitHub ${GITHUB_SHA::7}"

      - name: Summary
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          echo "### Apps Script deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Updated the existing deployment, so the /exec URL stays unchanged." >> "$GITHUB_STEP_SUMMARY"
