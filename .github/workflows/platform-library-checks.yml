name: Platform Library Checks

on:
  push:
    branches: [main]
    paths:
      - 'public/_routes.json'
      - 'public/_redirects'
      - 'public/_headers'
      - 'public/404.html'
      - 'public/data/block-registry/**'
      - 'public/data/block-styles/**'
      - 'public/data/ui-capabilities/**'
      - 'public/data/qa/**'
      - 'public/qa/**'
      - 'public/staging/**'
      - 'public/ui-dashboard/**'
      - 'public/assets/js/blocks/**'
      - 'public/assets/js/block-lab/**'
      - 'public/assets/js/editor-lab/**'
      - 'public/assets/js/ui-capabilities/**'
      - 'public/assets/js/ui-dashboard/**'
      - 'public/assets/js/qa-page/**'
      - 'public/assets/js/public-snapshot/**'
      - 'public/assets/styles/blocks/**'
      - 'public/assets/styles/block-lab/**'
      - 'public/assets/styles/editor-lab/**'
      - 'public/assets/styles/ui-capabilities/**'
      - 'public/assets/styles/ui-dashboard/**'
      - 'public/assets/styles/public-snapshot/**'
      - 'functions/*.js'
      - 'functions/api/editor/**'
      - 'functions/api/public/**'
      - 'functions/lib/**'
      - 'scripts/check-block-registry-sync.mjs'
      - 'scripts/check-block-variant-sync.mjs'
      - 'scripts/check-ui-capability-sync.mjs'
      - 'scripts/check-platform-qa-seed.mjs'
      - 'scripts/check-public-route-v2.mjs'
      - 'scripts/check-ui-dashboard-browser.mjs'
      - 'scripts/check-ui-dashboard-browser-v2.mjs'
      - 'scripts/check-ui-dashboard-browser-v3.mjs'
      - 'scripts/check-platform-admin-browser-v1.mjs'
      - 'scripts/debug-chip-cascade.mjs'
      - 'docs/workstreams/platform-library-v1/qa/**'
      - '.github/workflows/platform-library-checks.yml'
  pull_request:
    paths:
      - 'public/_routes.json'
      - 'public/_redirects'
      - 'public/_headers'
      - 'public/404.html'
      - 'public/data/block-registry/**'
      - 'public/data/block-styles/**'
      - 'public/data/ui-capabilities/**'
      - 'public/data/qa/**'
      - 'public/qa/**'
      - 'public/staging/**'
      - 'public/ui-dashboard/**'
      - 'public/assets/js/blocks/**'
      - 'public/assets/js/block-lab/**'
      - 'public/assets/js/editor-lab/**'
      - 'public/assets/js/ui-capabilities/**'
      - 'public/assets/js/ui-dashboard/**'
      - 'public/assets/js/qa-page/**'
      - 'public/assets/js/public-snapshot/**'
      - 'public/assets/styles/blocks/**'
      - 'public/assets/styles/block-lab/**'
      - 'public/assets/styles/editor-lab/**'
      - 'public/assets/styles/ui-capabilities/**'
      - 'public/assets/styles/ui-dashboard/**'
      - 'public/assets/styles/public-snapshot/**'
      - 'functions/*.js'
      - 'functions/api/editor/**'
      - 'functions/api/public/**'
      - 'functions/lib/**'
      - 'scripts/check-block-registry-sync.mjs'
      - 'scripts/check-block-variant-sync.mjs'
      - 'scripts/check-ui-capability-sync.mjs'
      - 'scripts/check-platform-qa-seed.mjs'
      - 'scripts/check-public-route-v2.mjs'
      - 'scripts/check-ui-dashboard-browser.mjs'
      - 'scripts/check-ui-dashboard-browser-v2.mjs'
      - 'scripts/check-ui-dashboard-browser-v3.mjs'
      - 'scripts/check-platform-admin-browser-v1.mjs'
      - 'scripts/debug-chip-cascade.mjs'
      - 'docs/workstreams/platform-library-v1/qa/**'
      - '.github/workflows/platform-library-checks.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser/server Registry sync
        run: node scripts/check-block-registry-sync.mjs
      - name: Check browser/server variant sync
        run: node scripts/check-block-variant-sync.mjs
      - name: Check browser/server UI capability sync
        run: node scripts/check-ui-capability-sync.mjs
      - name: Check first non-photography QA page seed
        run: node scripts/check-platform-qa-seed.mjs
      - name: Check canonical Snapshot V2 HTML
        run: node scripts/check-public-route-v2.mjs
      - name: Check platform JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/assets/js/blocks public/assets/js/block-lab public/assets/js/editor-lab public/assets/js/ui-capabilities public/assets/js/ui-dashboard public/assets/js/qa-page public/assets/js/public-snapshot functions/api/editor functions/api/public functions/lib -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find functions -maxdepth 1 -type f -name '*.js' -print0)
          node --check scripts/check-block-registry-sync.mjs
          node --check scripts/check-block-variant-sync.mjs
          node --check scripts/check-ui-capability-sync.mjs
          node --check scripts/check-platform-qa-seed.mjs
          node --check scripts/check-public-route-v2.mjs
          node --check scripts/check-ui-dashboard-browser.mjs
          node --check scripts/check-ui-dashboard-browser-v2.mjs
          node --check scripts/check-ui-dashboard-browser-v3.mjs
          node --check scripts/check-platform-admin-browser-v1.mjs
          node --check scripts/debug-chip-cascade.mjs
      - name: Install browser QA dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Run browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public >/tmp/photo-ebook-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ui-dashboard/ >/dev/null; then
              ready=1
              break
            fi
            sleep .3
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/photo-ebook-http.log || true
            exit 1
          fi
          export UI_DASHBOARD_BASE_URL=http://127.0.0.1:4173
          node scripts/debug-chip-cascade.mjs
          node scripts/check-ui-dashboard-browser-v3.mjs
          node scripts/check-platform-admin-browser-v1.mjs
      - name: Upload UI Dashboard browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-dashboard-browser-qa
          path: artifacts/ui-dashboard-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload management browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-admin-browser-qa
          path: artifacts/platform-admin-browser
          if-no-files-found: ignore
          retention-days: 7
