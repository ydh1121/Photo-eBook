name: Activate verified b007 assets
on:
  push:
    paths: [image-upload-staging/b007-activate-trigger.txt]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/image/activate-b007-core.py && python scripts/image/activate-b007-status.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add content/image-prompts/v1 content/image-status/v1 public/assets/image-slots-v1.js public/index.html
          git commit -m 'Activate verified b007 image slots'
          git push
