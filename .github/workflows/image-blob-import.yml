name: Import generated WebP blobs
on:
  push:
    paths: ['image-upload-staging/blob-ready.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Rebuild and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,tarfile,urllib.request
          cfg=json.load(open('image-upload-staging/blob-ready.json'))
          chunks=[]
          for sha in cfg['blob_shas']:
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r: data=json.load(r)
              chunks.append(base64.b64decode(data['content']))
          archive=base64.b64decode(b''.join(chunks),validate=True)
          actual=hashlib.sha256(archive).hexdigest()
          if actual!=cfg['archive_sha256']: raise SystemExit(f'archive sha mismatch {actual}')
          ap=Path('/tmp/batch.tar.gz'); ap.write_bytes(archive)
          with tarfile.open(ap,'r:gz') as tf: tf.extractall('.')
          for s in cfg['slots']:
              p=Path(s['repo_path']); b=p.read_bytes()
              if len(b)!=s['size']: raise SystemExit(f'size mismatch {p}')
              if b[:4]!=b'RIFF' or b[8:12]!=b'WEBP': raise SystemExit(f'not webp {p}')
              if hashlib.sha256(b).hexdigest()!=s['sha256']: raise SystemExit(f'asset sha mismatch {p}')
          PY
      - name: Activate slots
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          cfg=json.load(open('image-upload-staging/blob-ready.json')); ids={s['slot_id'] for s in cfg['slots']}; rev=cfg['runtime_revision']
          p=Path('public/assets/image-slots-v1.js'); lines=p.read_text().splitlines(); seen=set(); out=[]
          for line in lines:
              hit=next((x for x in ids if f"'{x}':{{" in line),None)
              if hit:
                  seen.add(hit); line=line.replace('ready:false','ready:true')
                  line=re.sub(r"rev:'[^']+'",f"rev:'{rev}'",line) if "rev:'" in line else line[:line.rfind('}')]+f",rev:'{rev}'"+line[line.rfind('}'):]
              out.append(line)
          if seen!=ids: raise SystemExit(f'runtime slots missing {ids-seen}')
          p.write_text('\n'.join(out)+'\n')
          mp=Path('content/image-prompts/v1/manifest.json'); m=json.loads(mp.read_text()); ms=set()
          for s in m['slots']:
              if s['slot_id'] in ids: s['ready']=True; ms.add(s['slot_id'])
          if ms!=ids: raise SystemExit(f'manifest slots missing {ids-ms}')
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          ip=Path('public/index.html'); t=ip.read_text(); t,n=re.subn(r'/assets/image-slots-v1\.js\?v=\d+',f"/assets/image-slots-v1.js?v={cfg['runtime_script_version']}",t,count=1)
          if n!=1: raise SystemExit('image-slots script tag missing')
          ip.write_text(t)
          PY
      - name: Commit verified batch
        run: |
          msg=$(python -c "import json;print(json.load(open('image-upload-staging/blob-ready.json'))['commit_message'])")
          rm -rf image-upload-staging
          git config user.name photo-ebook-image-bot
          git config user.email actions@users.noreply.github.com
          git add public/assets/images/generated/v1 public/assets/image-slots-v1.js public/index.html content/image-prompts/v1/manifest.json image-upload-staging
          git commit -m "$msg"
          git push origin HEAD:main
