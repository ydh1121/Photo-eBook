name: Import original Drive WebPs b009

on:
  push:
    paths:
      - 'drive-original-webp-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify original Drive WebPs
