name: Import original Drive WebPs b009

on:
  push:
    paths:
      - 'drive-original-webp-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified original WebPs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, time, urllib.request

          cfg = json.loads(Path('content/image-status/v1/drive-import-b009.json').read_text())
          for asset in cfg['assets']:
              url = f"https://photo-ebook.pages.dev/drive-transfer-auth/{asset['drive_id']}"
              data = None
              errors = []
              for attempt in range(24):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          candidate = r.read()
                      digest = hashlib.sha256(candidate).hexdigest()
                      if (len(candidate) == asset['bytes'] and candidate[:4] == b'RIFF' and candidate[8:12] == b'WEBP' and digest == asset['sha256']):
                          data = candidate
                          break
                      errors.append(f"attempt {attempt+1}: bytes={len(candidate)} sha={digest} head={candidate[:12]!r}")
                  except Exception as e:
                      errors.append(f"attempt {attempt+1}: {e!r}")
                  time.sleep(10)
              if data is None:
                  raise SystemExit(f"failed {asset['name']}: " + ' | '.join(errors[-3:]))
              p = Path(asset['repo_path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print(f"verified {asset['name']}: {len(data)} {asset['sha256']}")
          PY

      - name: Commit original WebPs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/images/generated/v1
          git commit -m 'Replace generated images with original Drive WebPs b009'
          git pull --rebase origin main
          git push origin HEAD:main
