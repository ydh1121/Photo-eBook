name: Finalize original Drive WebPs b009

on:
  push:
    paths:
      - 'drive-original-webp-trigger.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-verify repository originals against Drive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, time, urllib.request

          cfg = json.loads(Path('content/image-status/v1/drive-import-b009.json').read_text())
          for asset in cfg['assets']:
              url = f"https://photo-ebook.pages.dev/drive-transfer-auth/{asset['drive_id']}"
              data = None
              errors = []
              for attempt in range(24):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          candidate = r.read()
                      digest = hashlib.sha256(candidate).hexdigest()
                      if (len(candidate) == asset['bytes'] and candidate[:4] == b'RIFF' and candidate[8:12] == b'WEBP' and digest == asset['sha256']):
                          data = candidate
                          break
                      errors.append(f"attempt {attempt+1}: bytes={len(candidate)} sha={digest} head={candidate[:12]!r}")
                  except Exception as e:
                      errors.append(f"attempt {attempt+1}: {e!r}")
                  time.sleep(10)
              if data is None:
                  raise SystemExit(f"Drive verify failed {asset['name']}: " + ' | '.join(errors[-3:]))
              p = Path(asset['repo_path'])
              local = p.read_bytes()
              local_sha = hashlib.sha256(local).hexdigest()
              if len(local) != asset['bytes'] or local_sha != asset['sha256'] or local != data:
                  raise SystemExit(f"repository mismatch {asset['name']}: bytes={len(local)} sha={local_sha}")
              print(f"repo=drive {asset['name']}: {len(local)} {local_sha}")
          print('repository original verification complete:', len(cfg['assets']))
          PY

      - name: Verify b009 on production
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, time, urllib.request

          base = 'https://photo-ebook.pages.dev'
          cfg = json.loads(Path('content/image-status/v1/drive-import-b009.json').read_text())
          stamp = str(int(time.time()))

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read()

          ready = False
          errors = []
          for attempt in range(36):
              try:
                  html = get(f'{base}/?verify=b009-{stamp}-{attempt}').decode('utf-8','replace')
                  js = get(f'{base}/assets/image-slots-v1.js?v=9&verify={stamp}-{attempt}').decode('utf-8','replace')
                  if 'image-slots-v1.js?v=9' in html and js.count("rev:'b009'") == 40 and "'gear-product-sony-a7-iii':{path:'/assets/images/generated/v1/gear/sony-a7-iii.webp',ready:true,rev:'b009'}" in js:
                      ready = True
                      break
                  errors.append(f'attempt {attempt+1}: html_v9={"image-slots-v1.js?v=9" in html} b009_count={js.count("rev:\'b009\'")}')
              except Exception as e:
                  errors.append(f'attempt {attempt+1}: {e!r}')
              time.sleep(10)
          if not ready:
              raise SystemExit('production runtime b009 not ready: ' + ' | '.join(errors[-4:]))

          for asset in cfg['assets']:
              ok = False
              errs = []
              for attempt in range(12):
                  try:
                      data = get(f"{base}{asset['repo_path'].replace('public','',1)}?v=b009&verify={stamp}-{attempt}")
                      digest = hashlib.sha256(data).hexdigest()
                      if len(data) == asset['bytes'] and digest == asset['sha256'] and data[:4] == b'RIFF' and data[8:12] == b'WEBP':
                          ok = True
                          break
                      errs.append(f'bytes={len(data)} sha={digest}')
                  except Exception as e:
                      errs.append(repr(e))
                  time.sleep(5)
              if not ok:
                  raise SystemExit(f"production mismatch {asset['name']}: " + ' | '.join(errs[-3:]))
              print(f"production verified {asset['name']}: {asset['bytes']} {asset['sha256']}")
          print('production original verification complete:', len(cfg['assets']))
          PY

      - name: Record applied b009 and clean transfer plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json, subprocess

          import_path = Path('content/image-status/v1/drive-import-b009.json')
          manifest_path = Path('content/image-prompts/v1/manifest.json')
          cfg = json.loads(import_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          imported_paths = {a['repo_path'].replace('public','',1) for a in cfg['assets']}
          path_to_slot = {}
          for slot in manifest.get('slots', []):
              path = slot.get('path')
              if path in imported_paths:
                  slot['ready'] = True
                  path_to_slot[path] = slot['slot_id']
          missing = imported_paths - set(path_to_slot)
          if missing:
              raise SystemExit(f'manifest paths missing: {sorted(missing)}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          asset_commit = subprocess.check_output(['git','log','--format=%H','-1','--','public/assets/images/generated/v1']).decode().strip()
          now = datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0).isoformat()
          applied = {
              'batch_id': 'b009',
              'status': 'applied',
              'runtime_revision': 'b009',
              'runtime_script_version': 9,
              'deployment': 'https://photo-ebook.pages.dev',
              'deployment_verified': True,
              'asset_commit_sha': asset_commit,
              'slots': [
                  {
                      'slot_id': path_to_slot[a['repo_path'].replace('public','',1)],
                      'path': a['repo_path'].replace('public','',1),
                      'drive_file_id': a['drive_id'],
                      'sha256': a['sha256'],
                      'bytes': a['bytes']
                  }
                  for a in cfg['assets']
              ],
              'deployment_verified_at': now
          }
          out = Path('content/image-prompts/v1/applied/b009.json')
          out.write_text(json.dumps(applied, ensure_ascii=False, indent=2) + '\n')
          print('recorded b009:', len(applied['slots']), 'asset commit', asset_commit)
          PY

          rm -f 'functions/drive-transfer-auth/[[id]].js'
          rm -f 'drive-original-webp-trigger.txt'
          rm -f 'content/image-status/v1/drive-import-b009.json'
          rm -f '.github/workflows/import-drive-original-webps-b009.yml'

          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize original image rollout b009'
          git pull --rebase origin main
          git push origin HEAD:main
