            ('fallback-video-general.webp','1Z-E1QvvHlDk5dkBEMLQHO7SF7HNJnKEP','public/assets/images/generated/v1/fallback/video-general.webp',80266,'51e70fcdb395cfad5d342cf5ae792b05fb0941fbd6199d19aba884dedec6f597'),
            ('hero-main.webp','1wZq1S1jxVPOhNgk68VzzZb-LPWUaaohk','public/assets/images/generated/v1/hero/hero-main.webp',48382,'0de4925222ee05f76a71ab7910d4b62ead70a1b044f25334e2045df3cc8461ec'),
            ('education.webp','14vrntf1cThfcoL_krxeCaciXHCPYG9UJ','public/assets/images/generated/v1/chapter/education.webp',41760,'f7e5076842d875832f9fd051087067fdced02cffb208f990d0e09e62d2f8de61'),
            ('portfolio.webp','1OpfsI4Iskrojob8DgDcYed20mhBoxGqO','public/assets/images/generated/v1/chapter/portfolio.webp',55644,'0c24b1079dc1ddae260ed7234ef936a61693c161453e1397adf60808c3f05c8e'),
            ('product-commerce.webp','15rYsYg_XQ0UQ14hYu1c82l1KdqDiotWS','public/assets/images/generated/v1/market/product-commerce.webp',44756,'04ac1b09ba75c577e274b7af75e2933c75f402268bc26f2eff5ebdc13426342d'),
            ('corporate-profile.webp','17ChLOCp8E0ttKY6Abl1edvN0o7A6u-S1','public/assets/images/generated/v1/market/corporate-profile.webp',28166,'790b81bbf7f80c9bc127f39a527d5e89ecab17f16bd2c8d3acccb908c71ec326'),
            ('food-space.webp','1Lkyr10UytKvm6-ETruBrOvVK6g1BO-xR','public/assets/images/generated/v1/market/food-space.webp',49676,'a17568204f1bd3854345fabe59905e4aad03d68e02205210e83690d51913c9ff')
          ]

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )

          for name, file_id, repo_path, expected_size, expected_sha in assets:
              urls = [
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  f'https://drive.google.com/uc?export=download&id={file_id}',
              ]
              data = None
              errors = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                      with opener.open(req, timeout=45) as r:
                          candidate = r.read()
                      if (
                          len(candidate) == expected_size
                          and candidate[:4] == b'RIFF'
                          and candidate[8:12] == b'WEBP'
                      ):
                          data = candidate
                          break
                      errors.append(f'{url}: size={len(candidate)} head={candidate[:12]!r}')
                  except Exception as e:
                      errors.append(f'{url}: {e!r}')

              if data is None:
                  raise SystemExit(f'Drive download failed for {name}: ' + ' | '.join(errors))

              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'SHA mismatch for {name}: {actual_sha} != {expected_sha}')

              p = Path(repo_path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print(f'verified {name}: {len(data)} bytes {actual_sha} -> {repo_path}')

          runtime = Path('public/assets/image-slots-v1.js')
          lines = runtime.read_text().splitlines()
          out = []
          slot_count = 0
          for line in lines:
              if re.match(r"\s*'[^']+':\{path:", line):
                  slot_count += 1
                  line = re.sub(r'ready:(?:true|false)', 'ready:true', line)
                  if re.search(r"rev:'[^']+'", line):
                      line = re.sub(r"rev:'[^']+'", "rev:'b009'", line)
                  else:
                      line = re.sub(r'\}(,?)$', ",rev:'b009'}\\1", line)
              out.append(line)
          if slot_count != 46:
              raise SystemExit(f'expected 46 runtime slots, found {slot_count}')
          runtime.write_text('\n'.join(out) + '\n')

          mp = Path('content/image-prompts/v1/manifest.json')
          manifest = json.loads(mp.read_text())
          if len(manifest.get('slots', [])) != 46:
              raise SystemExit(f"expected 46 manifest slots, found {len(manifest.get('slots', []))}")
          for slot in manifest['slots']:
              slot['ready'] = True
          mp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          by_name = {a[0]: a for a in assets}
          status_map = {
              'skill-space-correction': 'skill-space-correction.webp',
              'skill-raw-culling': 'skill-raw-culling.webp',
              'skill-batch-basic-edit': 'skill-batch-basic-edit.webp',
              'skill-tether-shooting': 'skill-tether-shooting.webp',
              'skill-portfolio-building': 'skill-portfolio-building.webp',
              'skill-delivery-process': 'skill-delivery-process.webp',
          }
          for slot_id, file_name in status_map.items():
              sp = Path(f'content/image-status/v1/{slot_id}.json')
              if not sp.exists():
                  continue
              status = json.loads(sp.read_text())
              _, drive_id, repo_path, size, sha = by_name[file_name]
              status['status'] = 'ready'
              status['ready'] = True
              status.setdefault('webp', {})
              status['webp']['status'] = 'ready'
              status['webp']['drive_file_id'] = drive_id
              status['webp']['repo_path'] = repo_path
              status['webp']['bytes'] = size
              status['webp']['sha256'] = sha
              status['updated_at'] = '2026-08-18T14:40:00+09:00'
              sp.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')

          queue = Path('content/image-status/v1/next-generation-queue.json')
          if queue.exists():
              q = json.loads(queue.read_text())
              q['status'] = 'completed'
              for item in q.get('slots', []):
                  item['status'] = 'ready'
              queue.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n')

          index = Path('public/index.html')
          text = index.read_text()
          text, n = re.subn(
              r'/assets/image-slots-v1\.js\?v=\d+',
              '/assets/image-slots-v1.js?v=9',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('image-slots script tag not found')
          index.write_text(text)

          slot_paths = re.findall(r"path:'([^']+\.webp)'", runtime.read_text())
          missing = []
          for path in slot_paths:
              p = Path('public') / path.removeprefix('/')
              if not p.exists():
                  missing.append(str(p))
                  continue
              data = p.read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'not a WebP: {p}')
          if missing:
              raise SystemExit('missing production assets: ' + ', '.join(missing))
          print(f'production asset check passed: {len(slot_paths)} slots')
          PY

      - name: Commit original WebPs and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/import-drive-original-webps-b009.yml drive-original-webp-trigger.txt
          git add -A
          git commit -m 'Replace production images with original Drive WebPs b009'
          git pull --rebase origin main
          git push origin HEAD:main
