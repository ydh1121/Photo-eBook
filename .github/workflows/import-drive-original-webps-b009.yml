            ('iphone-preset-cafe-food.webp','1_vZeZIOOtzZjPe_8RScmtOMdxjkFP7VW','public/assets/images/generated/v1/iphone/presets/cafe-food.webp',205738,'6617a1dc7ce40e815f7c5e19f7fd071326ccc04ec6a91ce49b7be6897c882698'),
