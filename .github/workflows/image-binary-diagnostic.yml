name: Diagnose V1 WebP assets

on:
  push:
    paths:
      - 'image-diagnostic-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository WebP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            public/assets/images/generated/v1/hero/hero-main.webp
            public/assets/images/generated/v1/chapter/education.webp
            public/assets/images/generated/v1/chapter/portfolio.webp
            public/assets/images/generated/v1/market/product-commerce.webp
            public/assets/images/generated/v1/market/corporate-profile.webp
            public/assets/images/generated/v1/market/food-space.webp
          )
          expected=(7492 7336 9404 8152 5158 8098)
          for i in "${!files[@]}"; do
            f="${files[$i]}"
            echo "=== repo:$f ==="
            size=$(wc -c < "$f")
            echo "size=$size expected=${expected[$i]}"
            test "$size" -eq "${expected[$i]}"
            file "$f" | grep -qi 'Web/P image'
          done
      - name: Inspect Cloudflare Pages responses
        shell: bash
        run: |
          set -euo pipefail
          base='https://photo-ebook.pages.dev'
          paths=(
            '/assets/images/generated/v1/hero/hero-main.webp?v=b003'
            '/assets/images/generated/v1/chapter/education.webp?v=b003'
            '/assets/images/generated/v1/chapter/portfolio.webp?v=b003'
            '/assets/images/generated/v1/market/product-commerce.webp?v=b003'
            '/assets/images/generated/v1/market/corporate-profile.webp?v=b003'
            '/assets/images/generated/v1/market/food-space.webp?v=b003'
          )
          expected=(7492 7336 9404 8152 5158 8098)
          for i in "${!paths[@]}"; do
            p="${paths[$i]}"
            out="/tmp/deployed-$i.webp"
            headers="/tmp/h-$i"
            echo "=== deployed:$p ==="
            code=$(curl -sS -L --retry 3 --retry-delay 2 -D "$headers" -o "$out" -w '%{http_code}' "$base$p")
            echo "http=$code"
            test "$code" = '200'
            size=$(wc -c < "$out")
            echo "size=$size expected=${expected[$i]}"
            test "$size" -eq "${expected[$i]}"
            file "$out" | grep -qi 'Web/P image'
          done
          echo '=== deployed runtime ==='
          slots=$(curl -fsSL --retry 3 "$base/assets/image-slots-v1.js?v=3")
          printf '%s' "$slots" | grep -q "rev:'b003'"
          printf '%s' "$slots" | grep -q 'photoImageSlotPath'
          binder=$(curl -fsSL --retry 3 "$base/assets/image-slot-binder-v1.js?v=3")
          printf '%s' "$binder" | grep -q 'photoImageSlotPath'
