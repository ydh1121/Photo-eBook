name: Import Drive intro smoke
on:
  push:
    paths:
      - 'drive-intro-smoke-trigger.txt'
permissions:
  contents: write
jobs:
  import-intro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Cloudflare Drive service account identity
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            email="$(curl -fsS --max-time 20 'https://photo-ebook.pages.dev/drive-transfer-auth/_identity' || true)"
            if printf '%s' "$email" | grep -Eq '^[^[:space:]@]+@[^[:space:]@]+$'; then
              printf '%s\n' "$email" > tmp-drive-service-account.txt
              exit 0
            fi
            sleep 10
          done
          echo 'service account identity endpoint not ready' >&2
          exit 1
      - name: Commit temporary identity record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp-drive-service-account.txt
          git commit -m 'Record temporary Drive service account identity'
          git push
