name: Import approved gear binaries

on:
  push:
    paths:
      - 'image-upload-staging/ready.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify approved Drive WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          manifest = json.loads(pathlib.Path('image-upload-staging/ready.json').read_text())
          for item in manifest['files']:
              file_id = item['drive_file_id']
              url = f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t'
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()

              if len(data) != item['size']:
                  raise SystemExit(f"size mismatch for {item['target']}: {len(data)} != {item['size']}")
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f"sha256 mismatch for {item['target']}: {digest}")
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f"not a WebP: {item['target']}")

              target = pathlib.Path(item['target'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(item['target'], len(data), digest)
          PY

      - name: Commit verified production assets and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf image-upload-staging .github/workflows/image-binary-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/images/generated/v1/gear image-upload-staging .github/workflows/image-binary-import.yml
          git commit -m 'Apply approved gear product WebP assets'
          git push origin HEAD:main
