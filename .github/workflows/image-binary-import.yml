name: Import image binaries

on:
  push:
    paths:
      - 'image-upload-staging/ready.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify binaries
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('image-upload-staging/ready.json').read_text())
          for item in manifest['files']:
              encoded = ''.join(pathlib.Path(part).read_text().strip() for part in item['parts'])
              data = base64.b64decode(encoded, validate=True)
              if len(data) != item['size']:
                  raise SystemExit(f"size mismatch for {item['target']}")
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f"sha256 mismatch for {item['target']}: {digest}")
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f"not a WebP: {item['target']}")
              target = pathlib.Path(item['target'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(item['target'], len(data), digest)
          PY
      - name: Commit verified production assets
        shell: bash
        run: |
          rm -rf image-upload-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/images/generated/v1/gear image-upload-staging
          git commit -m 'Apply approved gear product images'
          git push origin HEAD:main
