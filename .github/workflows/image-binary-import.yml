name: Import staged WebP batch

on:
  push:
    paths:
      - 'image-upload-staging/ready.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, tarfile

          stage = Path('image-upload-staging')
          cfg = json.loads((stage / 'ready.json').read_text())
          parts = sorted(stage.glob('part-*.txt'))
          if not parts:
              raise SystemExit('no staged parts')

          encoded = ''.join(p.read_text() for p in parts)
          archive = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          expected = cfg['archive_sha256']
          if actual != expected:
              raise SystemExit(f'archive sha mismatch: {actual} != {expected}')

          archive_path = Path('/tmp/image-batch.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as tf:
              tf.extractall('.')

          for slot in cfg['slots']:
              p = Path(slot['repo_path'])
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing asset: {p}')
              head = p.read_bytes()[:12]
              if len(head) < 12 or head[:4] != b'RIFF' or head[8:12] != b'WEBP':
                  raise SystemExit(f'not webp: {p}')
              if p.stat().st_size != slot['size']:
                  raise SystemExit(f'size mismatch: {p} {p.stat().st_size} != {slot["size"]}')
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              if digest != slot['sha256']:
                  raise SystemExit(f'asset sha mismatch: {p}: {digest} != {slot["sha256"]}')
          PY

      - name: Activate slots and refresh cache revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          cfg = json.loads(Path('image-upload-staging/ready.json').read_text())
          slot_ids = {x['slot_id'] for x in cfg['slots']}
          rev = cfg['runtime_revision']
          script_version = str(cfg['runtime_script_version'])

          runtime = Path('public/assets/image-slots-v1.js')
          lines = runtime.read_text().splitlines()
          out = []
          seen = set()
          for line in lines:
              matched = next((slot_id for slot_id in slot_ids if f"'{slot_id}':{{" in line), None)
              if matched:
                  seen.add(matched)
                  line = line.replace('ready:false', 'ready:true')
                  if re.search(r"rev:'[^']+'", line):
                      line = re.sub(r"rev:'[^']+'", f"rev:'{rev}'", line)
                  else:
                      pos = line.rfind('}')
                      if pos < 0:
                          raise SystemExit(f'cannot add revision for {matched}')
                      line = line[:pos] + f",rev:'{rev}'" + line[pos:]
              out.append(line)
          missing = slot_ids - seen
          if missing:
              raise SystemExit(f'runtime slots missing: {sorted(missing)}')
          runtime.write_text('\n'.join(out) + '\n')

          manifest_path = Path('content/image-prompts/v1/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest_seen = set()
          for slot in manifest['slots']:
              if slot['slot_id'] in slot_ids:
                  slot['ready'] = True
                  manifest_seen.add(slot['slot_id'])
          missing = slot_ids - manifest_seen
          if missing:
              raise SystemExit(f'manifest slots missing: {sorted(missing)}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          index = Path('public/index.html')
          text = index.read_text()
          text, count = re.subn(
              r'/assets/image-slots-v1\.js\?v=\d+',
              f'/assets/image-slots-v1.js?v={script_version}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('image-slots script tag not found')
          index.write_text(text)
          PY

      - name: Commit verified assets and activation
        shell: bash
        run: |
          set -euo pipefail
          message=$(python - <<'PY'
          import json
          print(json.load(open('image-upload-staging/ready.json')).get('commit_message', 'Apply verified generated image batch'))
          PY
          )
          rm -rf image-upload-staging
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/images/generated/v1 public/assets/image-slots-v1.js public/index.html content/image-prompts/v1/manifest.json image-upload-staging
          git commit -m "$message"
          git push origin HEAD:main
