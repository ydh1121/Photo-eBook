name: Import staged WebP batch

on:
  push:
    paths:
      - 'image-upload-staging/ready.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          test -f image-upload-staging/manifest.json
          test -n "$(find image-upload-staging -maxdepth 1 -name 'part-*.txt' -print -quit)"
          cat image-upload-staging/part-*.txt | base64 -d > /tmp/image-batch.tar.gz
          python - <<'PY'
          import hashlib, json, pathlib, sys
          meta=json.loads(pathlib.Path('image-upload-staging/manifest.json').read_text())
          archive=pathlib.Path('/tmp/image-batch.tar.gz').read_bytes()
          actual=hashlib.sha256(archive).hexdigest()
          expected=meta['archive_sha256']
          print('archive sha256', actual)
          if actual != expected:
              raise SystemExit(f'archive sha mismatch: {actual} != {expected}')
          if not meta.get('files'):
              raise SystemExit('manifest files is empty')
          for item in meta['files']:
              path=item['path']
              if not path.startswith('public/assets/images/generated/v1/') or not path.endswith('.webp'):
                  raise SystemExit(f'unsafe image path: {path}')
          PY
          tar -xzf /tmp/image-batch.tar.gz

      - name: Verify extracted WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/image-files.txt
          import hashlib, json, pathlib
          meta=json.loads(pathlib.Path('image-upload-staging/manifest.json').read_text())
          for item in meta['files']:
              p=pathlib.Path(item['path'])
              if not p.is_file() or p.stat().st_size <= 0:
                  raise SystemExit(f'missing/empty asset: {p}')
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              expected=item['sha256']
              if actual != expected:
                  raise SystemExit(f'asset sha mismatch: {p}: {actual} != {expected}')
              print(str(p))
          PY
          while IFS= read -r f; do
            file "$f" | grep -qi 'Web/P image'
          done < /tmp/image-files.txt

      - name: Commit verified binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          while IFS= read -r f; do
            git add -- "$f"
          done < /tmp/image-files.txt
          rm -rf image-upload-staging
          git add -A image-upload-staging
          message=$(python - <<'PY'
          import json, pathlib
          meta=json.loads(pathlib.Path('/tmp/image-import-manifest.json').read_text()) if pathlib.Path('/tmp/image-import-manifest.json').exists() else None
          print((meta or {}).get('commit_message','Import verified generated WebP assets'))
          PY
          )
          # staging manifest is removed before commit; preserve it temporarily for message metadata
          if git diff --cached --quiet; then
            echo 'No binary changes to commit.'
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:main
