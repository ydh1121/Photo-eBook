name: Import verified Drive WebPs b007

on:
  push:
    paths:
      - 'drive-webp-import-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify six Drive WebPs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, http.cookiejar, re, json

          assets = [
            ('portfolio-product-brand','1GygnwNtz6MMbcjtoErkncx5693V2oBCb','public/assets/images/generated/v1/portfolio/product-brand.webp',22172,'12ed25275657bb9c05d2222eeb2e211d699a02c77ebcc591eb1858a79fc5391c'),
            ('portfolio-professional-profile','1tmnNyw3y_AtZy76CH_1tQsLXj8b7K2VH','public/assets/images/generated/v1/portfolio/professional-profile.webp',21472,'440b35c7e95d5aaa59d31c96b61eced2dae31b5998410185d5467e7ce9b6d533'),
            ('portfolio-studio-process','1SvCvQkyg13v88XIIjfpTcDdT4bRcGzzH','public/assets/images/generated/v1/portfolio/studio-process.webp',39118,'100f4960d67be683416264f3afb5b3a478bad8b58bbaf11ce4d7b248d9c98483'),
            ('portfolio-food-store','1wjoajbBJQmcwo9CAsVJgAJheHMvkSuVQ','public/assets/images/generated/v1/portfolio/food-store.webp',46088,'8b29bd931cec10119bc4d4b4897b632b73f0668fb4ea7cc0d3b02be85763478a'),
            ('skill-portrait-retouch','1sYtpjjD0MyeR9yL96X0YIyk-fqTzmqDp','public/assets/images/generated/v1/skills/portrait-retouch.webp',33022,'e7c9907689474f210548885890060e87114c73e178d60df86c38334018caab1e'),
            ('skill-product-retouch','1XgqTD1hxLuk11jixXjiRlLApKZ0Dp7Nt','public/assets/images/generated/v1/skills/product-retouch.webp',29938,'2c7726ccdafdbf3d512acb831231a2801f815451ad8f970f1881b93c8abcd25e'),
          ]

          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          for slot_id, file_id, repo_path, expected_size, expected_sha in assets:
            urls = [
              f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
              f'https://drive.google.com/uc?export=download&id={file_id}',
            ]
            data = None
            errors = []
            for url in urls:
              try:
                req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                with opener.open(req, timeout=30) as r:
                  candidate = r.read()
                if len(candidate) == expected_size and candidate[:4] == b'RIFF' and candidate[8:12] == b'WEBP':
                  data = candidate
                  break
                errors.append(f'{url}: size={len(candidate)} head={candidate[:12]!r}')
              except Exception as e:
                errors.append(f'{url}: {e!r}')
            if data is None:
              raise SystemExit(f'Drive download failed for {slot_id}: ' + ' | '.join(errors))
            actual_sha = hashlib.sha256(data).hexdigest()
            if actual_sha != expected_sha:
              raise SystemExit(f'SHA mismatch for {slot_id}: {actual_sha} != {expected_sha}')
            p = Path(repo_path)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_bytes(data)
            print(f'verified {slot_id}: {len(data)} bytes {actual_sha}')

          ids = {a[0] for a in assets}
          runtime = Path('public/assets/image-slots-v1.js')
          lines = runtime.read_text().splitlines()
          out=[]; seen=set()
          for line in lines:
            matched=next((sid for sid in ids if f"'{sid}':{{" in line),None)
            if matched:
              seen.add(matched)
              line=line.replace('ready:false','ready:true')
              if re.search(r"rev:'[^']+'",line):
                line=re.sub(r"rev:'[^']+'","rev:'b007'",line)
              else:
                pos=line.rfind('}')
                line=line[:pos]+",rev:'b007'"+line[pos:]
            out.append(line)
          if seen != ids:
            raise SystemExit(f'missing runtime ids: {sorted(ids-seen)}')
          runtime.write_text('\n'.join(out)+'\n')

          mp=Path('content/image-prompts/v1/manifest.json')
          manifest=json.loads(mp.read_text())
          seen=set()
          for slot in manifest['slots']:
            if slot['slot_id'] in ids:
              slot['ready']=True
              seen.add(slot['slot_id'])
          if seen != ids:
            raise SystemExit(f'missing manifest ids: {sorted(ids-seen)}')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          index=Path('public/index.html')
          text=index.read_text()
          text,n=re.subn(r'/assets/image-slots-v1\.js\?v=\d+','/assets/image-slots-v1.js?v=7',text,count=1)
          if n != 1:
            raise SystemExit('image-slots script tag not found')
          index.write_text(text)
          PY

      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/images/generated/v1 public/assets/image-slots-v1.js public/index.html content/image-prompts/v1/manifest.json
          git commit -m 'Apply six verified Drive image assets b007'
          git pull --rebase origin main
          git push origin HEAD:main
