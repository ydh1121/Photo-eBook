name: Normalize image generation rules
on:
  push:
    paths: ['image-rule-normalize-trigger.txt']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Write canonical image workflow rules
        run: |
          python - <<'PY'
          from pathlib import Path
          canonical='''

## Canonical image generation override — 2026-08-17
This section supersedes any earlier repository instruction that says image generation must stop in the current ChatGPT project, move to another project, or treat project-level context as a hard blocker.

### Required batch behavior
- One user instruction starts one automatic batch. Do not require one user message per image.
- Default batch size is 4–8 semantic slots when enough pending slots exist.
- Internally, generate each semantic slot as its own independent image-generation call/result. Do not use one multi-slot prompt to request a dashboard, grid, contact sheet, mood board, or collage.
- `n > 1` must not be used to represent different semantic slots if the generator may merge them into one canvas. Prefer repeated independent calls within the same assistant turn/workflow.
- Before each generation call, use the exact slot prompt from `content/image-prompts/v1/` and the slot's body context. Generation-stage instructions must describe the desired image, not Git/Drive/deployment progress.
- People default to Korean adults for this Korean photography-business product unless the source content explicitly requires another identity/context. If a generated human is not Korean without a source reason, QA fails and that slot is regenerated/edited before application.
- A generated collage/dashboard/UI is a QA failure by default. Deterministic panel extraction is allowed only when each panel is a complete 1:1 match to a single slot, contains no UI/text/borders after crop, and passes the same final QA as a native independent image.

### Required automatic transaction
For every accepted batch continue without asking for another user instruction:
1. generate independent slot images
2. QA against prompt + body context
3. convert accepted results to production WebP
4. mirror the exact production WebP bytes to Google Drive
5. commit verified binary bytes to the reserved Git path
6. set runtime + manifest `ready:true` and increment cache revision
7. mark applied tracking state
8. verify the deployed Cloudflare URL returns HTTP 200 and the exact expected image bytes
9. only then report the batch as applied

### Binary Git transport
- Never trust a binary upload merely because the Git API call returned success.
- Verify image byte size, RIFF/WEBP signature, SHA-256 and deployed SHA-256.
- When connector binary transport is unreliable, use the SHA-verified Git-blob importer: WebP → tar.gz → base64 text chunks → Git blob objects → small trigger JSON → GitHub Actions reassembly → archive SHA-256 → per-image SHA-256 → commit.
- The importer may recover a damaged/missing chunk only by selecting a candidate that reproduces the exact predeclared archive SHA-256. Never apply an unverified candidate.

### Failure history is diagnostic, not a work-avoidance rule
Past dashboard/collage regressions remain recorded in `generation-failure-log.md`, but they must not be used as a reason to stop the requested work or tell the user to start another project. Correct the invocation, regenerate/repair the failed slots, and continue the automatic transaction.
'''
          p=Path('AGENTS.md'); txt=p.read_text() if p.exists() else '# AGENTS.md\n'
          marker='## Canonical image generation override — 2026-08-17'
          if marker in txt: txt=txt[:txt.index(marker)].rstrip()+canonical
          else: txt=txt.rstrip()+canonical
          p.write_text(txt+'\n')

          op=Path('content/image-prompts/v1/02-generation-operation-rules.md')
          old=op.read_text() if op.exists() else '# Image generation operation rules\n'
          note='''\n\n## 2026-08-17 canonical correction\n- Same-project conversation history is not a reason to refuse or defer image generation.\n- Batch orchestration means several independent generation calls under one user instruction, not one composited canvas.\n- Keep prompt/body-context content immediately dominant during each call; keep Git/Drive/status text out of the generation description itself.\n- Korean adults are the default human subjects for this Korean-market photography eBook unless source context says otherwise.\n- Continue automatically through QA → WebP → Drive → Git → ready/applied → deployment verification.\n'''
          if '## 2026-08-17 canonical correction' not in old: old=old.rstrip()+note
          op.parent.mkdir(parents=True,exist_ok=True); op.write_text(old+'\n')

          iso=Path('docs/spec-v1/19-image-generator-context-isolation.md')
          it=iso.read_text() if iso.exists() else '# Image generator context isolation\n'
          deprec='''\n\n## Status correction — 2026-08-17\nThis document is retained as failure-analysis history only. Its earlier recommendation to leave the current project or create a fresh project is **not an active production rule**. Current canonical behavior is to use exact per-slot prompts, separate generation calls inside one batch, QA failures, and continue the automatic application pipeline in the current work context.\n'''
          if '## Status correction — 2026-08-17' not in it: it=it.rstrip()+deprec
          iso.parent.mkdir(parents=True,exist_ok=True); iso.write_text(it+'\n')

          log=Path('content/image-prompts/v1/generation-failure-log.md')
          lt=log.read_text() if log.exists() else '# Generation failure log\n'
          corr='''\n\n## 2026-08-17 invocation correction\n- Root operational failure: different semantic slots were sometimes sent as one generation composition or generation prompts were mixed with project-status/dashboard language.\n- Do not treat the current project itself as the root cause.\n- Correct recovery: exact prompt-library slot → independent generation call → slot QA → continue batch automatically.\n- Korean-market human imagery defaults to Korean adults.\n- Dashboard/collage outputs are never applied without deterministic independent-panel extraction and full slot QA.\n'''
          if '## 2026-08-17 invocation correction' not in lt: lt=lt.rstrip()+corr
          log.write_text(lt+'\n')
          PY
      - name: Commit canonical rules
        run: |
          rm -f image-rule-normalize-trigger.txt
          git config user.name photo-ebook-image-bot
          git config user.email actions@users.noreply.github.com
          git add AGENTS.md content/image-prompts/v1/02-generation-operation-rules.md content/image-prompts/v1/generation-failure-log.md docs/spec-v1/19-image-generator-context-isolation.md image-rule-normalize-trigger.txt
          git commit -m 'Normalize automatic image generation workflow rules'
          git push origin HEAD:main
