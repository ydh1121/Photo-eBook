name: Enable Drive API PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'enable-drive-api-trigger.txt'
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Show Drive API enable response
        shell: bash
        run: |
          set +e
          curl -sS -i 'https://photo-ebook.pages.dev/enable-drive-api'
          exit 1
