name: Import final Sony FE 85mm WebP

on:
  push:
    paths:
      - 'image-upload-staging/drive-ready-final.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify final centered WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import time
          import urllib.request

          target_path = 'public/assets/images/generated/v1/gear/sony-fe-85-f18.webp'
          expected_size = 79518
          expected_sha = '729b98da92e0307454c789ec087d069c62b09e33287b93e456d55a8a96b61628'
          url = 'https://photo-ebook.pages.dev/api/gear-asset?name=sony-fe-85-f18'

          last = None
          for attempt in range(40):
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Photo-eBook-Gear-Importer/2.0',
                      'Cache-Control': 'no-cache'
                  })
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                  digest = hashlib.sha256(data).hexdigest()
                  if (
                      len(data) == expected_size
                      and digest == expected_sha
                      and data.startswith(b'RIFF')
                      and data[8:12] == b'WEBP'
                  ):
                      target = pathlib.Path(target_path)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      print(target_path, len(data), digest)
                      break
                  last = f'size={len(data)} sha={digest}'
              except Exception as exc:
                  last = repr(exc)
              print(f'waiting for deployed proxy attempt {attempt + 1}/40: {last}')
              time.sleep(15)
          else:
              raise SystemExit(f'final WebP never became available: {last}')
          PY

      - name: Commit final production asset and clean transfer helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf image-upload-staging
          rm -f functions/api/gear-asset.js
          rm -f .github/workflows/import-approved-drive-gear-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Resize and center Sony FE 85mm product WebP'
          git pull --rebase origin main
          git push origin HEAD:main
