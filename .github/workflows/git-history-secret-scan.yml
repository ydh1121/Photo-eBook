name: Git History Secret Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/git-history-secret-scan.yml'

permissions:
  contents: read

jobs:
  full-history-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/go/bin/gitleaks" git . --redact --exit-code 1 --no-banner
