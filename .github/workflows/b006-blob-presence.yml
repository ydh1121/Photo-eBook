name: Check b006 orphan blob presence

on:
  push:
    paths:
      - 'image-upload-staging/b006-presence-trigger.txt'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all configured blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, urllib.request, urllib.error
          cfg=json.loads(Path('image-upload-staging/ready.json').read_text())
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          result={'total':len(cfg['blob_shas']),'present':[],'missing':[]}
          for i,sha in enumerate(cfg['blob_shas']):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req) as r: data=json.load(r)
                  result['present'].append({'index':i,'sha':sha,'size':data.get('size')})
              except urllib.error.HTTPError as e:
                  result['missing'].append({'index':i,'sha':sha,'http':e.code})
          result['present_count']=len(result['present']); result['missing_count']=len(result['missing'])
          Path('image-upload-staging/b006-presence-result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Commit presence result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'photo-ebook-image-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add image-upload-staging/b006-presence-result.json
          git commit -m 'Record b006 orphan blob presence'
          git pull --rebase origin main
          git push origin HEAD:main
