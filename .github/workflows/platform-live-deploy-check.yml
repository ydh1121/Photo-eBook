name: Platform Live Deploy Check

on:
  push:
    branches: [main]
    paths:
      - 'public/ui-dashboard/**'
      - 'public/assets/js/ui-dashboard/**'
      - 'public/assets/styles/ui-dashboard/**'
      - 'scripts/check-live-ui-dashboard-deploy.mjs'
      - '.github/workflows/platform-live-deploy-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deploy script syntax
        run: node --check scripts/check-live-ui-dashboard-deploy.mjs
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Verify Cloudflare Pages deployment
        env:
          UI_DASHBOARD_LIVE_URL: https://photo-ebook.pages.dev
          LIVE_DEPLOY_ATTEMPTS: '90'
          LIVE_DEPLOY_INTERVAL_MS: '4000'
        run: node scripts/check-live-ui-dashboard-deploy.mjs
      - name: Record successful live deployment
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/workstreams/platform-library-v1/qa
          node <<'NODE'
          const fs=require('node:fs');
          const source='artifacts/platform-live-deploy/report.json';
          const target='docs/workstreams/platform-library-v1/qa/live-deploy-status.json';
          const report=JSON.parse(fs.readFileSync(source,'utf8'));
          const status={
            ...report,
            sourceSha:process.env.GITHUB_SHA,
            sourceRef:process.env.GITHUB_REF_NAME,
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunNumber:process.env.GITHUB_RUN_NUMBER,
            recordedAt:new Date().toISOString()
          };
          fs.writeFileSync(target,JSON.stringify(status,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/workstreams/platform-library-v1/qa/live-deploy-status.json
          if git diff --cached --quiet; then
            echo 'Live deployment status is unchanged.'
          else
            git commit -m 'Record live Pages verification [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-live-deploy
          path: artifacts/platform-live-deploy
          if-no-files-found: ignore
          retention-days: 7
