name: Platform Live Deploy Check

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/_routes.json'
      - 'public/_redirects'
      - 'public/block-lab/**'
      - 'public/editor-lab/**'
      - 'public/qa/**'
      - 'public/ui-dashboard/**'
      - 'public/data/ui-capabilities/**'
      - 'public/data/block-registry/**'
      - 'public/assets/js/admin/**'
      - 'public/assets/js/collection/**'
      - 'public/assets/js/platform-modules/**'
      - 'public/assets/js/ui-dashboard/**'
      - 'public/assets/js/editor-lab/**'
      - 'public/assets/js/blocks/**'
      - 'public/assets/js/desktop/**'
      - 'public/assets/js/navigation/**'
      - 'public/assets/js/ui/**'
      - 'public/assets/styles/admin/**'
      - 'public/assets/styles/block-lab/**'
      - 'public/assets/styles/platform-modules/**'
      - 'public/assets/styles/ui-dashboard/**'
      - 'public/assets/styles/editor-lab/**'
      - 'public/assets/styles/desktop/**'
      - 'public/assets/styles/navigation/**'
      - 'public/assets/styles/ui/**'
      - 'scripts/check-live-ui-dashboard-deploy.mjs'
      - 'scripts/check-top-nav-runtime-parity.mjs'
      - 'scripts/check-library-runtime-feedback-v1.mjs'
      - 'scripts/check-library-module-family-controls-v1.mjs'
      - 'scripts/check-ui-visual-matrix-v1.mjs'
      - 'scripts/check-block-lab-mobile-controls-v1.mjs'
      - '.github/workflows/platform-live-deploy-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deploy script syntax
        run: |
          node --check scripts/check-live-ui-dashboard-deploy.mjs
          node --check scripts/check-top-nav-runtime-parity.mjs
          node --check scripts/check-library-runtime-feedback-v1.mjs
          node --check scripts/check-library-module-family-controls-v1.mjs
          node --check scripts/check-ui-visual-matrix-v1.mjs
          node --check scripts/check-block-lab-mobile-controls-v1.mjs
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Verify Cloudflare Pages canonical module pipeline
        env:
          UI_DASHBOARD_LIVE_URL: https://photo-ebook.pages.dev
          LIVE_DEPLOY_ATTEMPTS: '90'
          LIVE_DEPLOY_INTERVAL_MS: '4000'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-live-ui-dashboard-deploy.mjs

          parity_status=pass
          if ! UI_DASHBOARD_BASE_URL="$UI_DASHBOARD_LIVE_URL" node scripts/check-top-nav-runtime-parity.mjs; then
            parity_status=fail
          fi

          feedback_status=pass
          if ! UI_DASHBOARD_BASE_URL="$UI_DASHBOARD_LIVE_URL" node scripts/check-library-runtime-feedback-v1.mjs; then
            feedback_status=fail
          fi

          family_status=pass
          if ! UI_DASHBOARD_BASE_URL="$UI_DASHBOARD_LIVE_URL" node scripts/check-library-module-family-controls-v1.mjs; then
            family_status=fail
          fi

          matrix_status=pass
          if ! UI_DASHBOARD_BASE_URL="$UI_DASHBOARD_LIVE_URL" node scripts/check-block-lab-mobile-controls-v1.mjs; then
            matrix_status=fail
          fi
          if ! UI_DASHBOARD_BASE_URL="$UI_DASHBOARD_LIVE_URL" node scripts/check-ui-visual-matrix-v1.mjs; then
            matrix_status=fail
          fi

          TOP_NAV_PARITY_STATUS="$parity_status" LIBRARY_FEEDBACK_STATUS="$feedback_status" LIBRARY_FAMILY_STATUS="$family_status" UI_VISUAL_MATRIX_STATUS="$matrix_status" node <<'NODE'
          const fs=require('node:fs');
          const target='artifacts/platform-live-deploy/report.json';
          const report=JSON.parse(fs.readFileSync(target,'utf8'));
          const parityOk=process.env.TOP_NAV_PARITY_STATUS==='pass';
          const feedbackOk=process.env.LIBRARY_FEEDBACK_STATUS==='pass';
          const familyOk=process.env.LIBRARY_FAMILY_STATUS==='pass';
          const matrixOk=process.env.UI_VISUAL_MATRIX_STATUS==='pass';
          report.checks=Array.isArray(report.checks)?report.checks:[];
          report.checks.push({
            name:'live top-nav runtime parity',
            status:parityOk?'pass':'fail',
            detail:parityOk
              ?'Photography/Public and Library share canonical liquid owner, native pan, remount recovery, and Breeze easing'
              :'focused Photography/Public ↔ Library runtime parity failed'
          });
          report.checks.push({
            name:'live Library runtime feedback gate',
            status:feedbackOk?'pass':'fail',
            detail:feedbackOk
              ?'top-nav family skin, filter horizontal drag/pan, preview frame, rail content preservation and primitive controls passed on live Pages'
              :'focused Library runtime feedback checks failed on live Pages'
          });
          report.checks.push({
            name:'live Library module family gate',
            status:familyOk?'pass':'fail',
            detail:familyOk
              ?'grouped accordion/popup tabs, standalone screen mode, portable rail fade/drag, bottom-sheet shell parity and filter outer paint passed on live Pages'
              :'grouped Library module family checks failed on live Pages'
          });
          report.checks.push({
            name:'live UI visual matrix gate',
            status:matrixOk?'pass':'fail',
            detail:matrixOk
              ?'10 Library modules × desktop/mobile × light/dark plus Editor/Block Lab/QA responsive theme states and Block Lab mobile control rail passed on live Pages'
              :'UI visual matrix or Block Lab mobile control rail failed on live Pages'
          });
          if(!parityOk||!feedbackOk||!familyOk||!matrixOk){
            report.status='fail';
            report.error=[
              report.error,
              !parityOk?'live top-nav runtime parity failed':'',
              !feedbackOk?'live Library runtime feedback gate failed':'',
              !familyOk?'live Library module family gate failed':'',
              !matrixOk?'live UI visual matrix gate failed':''
            ].filter(Boolean).join('\n');
          }
          report.finishedAt=new Date().toISOString();
          fs.writeFileSync(target,JSON.stringify(report,null,2)+'\n');
          NODE

          test "$parity_status" = pass
          test "$feedback_status" = pass
          test "$family_status" = pass
          test "$matrix_status" = pass
      - name: Record live deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs/workstreams/platform-library-v1/qa
          node <<'NODE'
          const fs=require('node:fs');
          const source='artifacts/platform-live-deploy/report.json';
          const target='docs/workstreams/platform-library-v1/qa/live-deploy-status.json';
          let report={
            status:'fail',
            error:'live deploy report was not created',
            base:'https://photo-ebook.pages.dev',
            startedAt:null,
            finishedAt:new Date().toISOString(),
            attempts:[],
            checks:[]
          };
          if(fs.existsSync(source))report=JSON.parse(fs.readFileSync(source,'utf8'));
          const status={
            ...report,
            sourceSha:process.env.GITHUB_SHA,
            sourceRef:process.env.GITHUB_REF_NAME,
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunNumber:process.env.GITHUB_RUN_NUMBER,
            recordedAt:new Date().toISOString()
          };
          fs.writeFileSync(target,JSON.stringify(status,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/workstreams/platform-library-v1/qa/live-deploy-status.json
          if git diff --cached --quiet; then
            echo 'Live deployment status is unchanged.'
          else
            git commit -m 'Record live Pages verification [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-live-deploy
          path: |
            artifacts/platform-live-deploy
            artifacts/library-runtime-feedback-v1
            artifacts/library-module-family-controls-v1
            artifacts/ui-visual-matrix-v1
            artifacts/block-lab-mobile-controls-v1
          if-no-files-found: ignore
          retention-days: 7
