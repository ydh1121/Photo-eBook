name: Import centered Sony FE 85mm WebP

on:
  push:
    paths:
      - 'image-upload-staging/drive-ready-2.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify centered WebP through authenticated proxy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import urllib.request

          target_path = 'public/assets/images/generated/v1/gear/sony-fe-85-f18.webp'
          expected_size = 148766
          expected_sha = '85b9c2eeb83aaff41b9ba4996f529852529a0b5bee6cbf6b915272d78d49a8b9'
          url = 'https://photo-ebook.pages.dev/api/gear-asset?name=sony-fe-85-f18'

          req = urllib.request.Request(url, headers={'User-Agent': 'Photo-eBook-Gear-Importer/1.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = response.read()

          if len(data) != expected_size:
              raise SystemExit(f'size mismatch: {len(data)} != {expected_size}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f'sha256 mismatch: {digest} != {expected_sha}')
          if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
              raise SystemExit('downloaded bytes are not RIFF/WEBP')

          target = pathlib.Path(target_path)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(target_path, len(data), digest)
          PY

      - name: Commit centered production asset and clean temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf image-upload-staging
          rm -f functions/api/gear-asset.js
          rm -f .github/workflows/import-approved-drive-gear.yml
          rm -f .github/workflows/import-approved-drive-gear-retry.yml
          rm -f .github/workflows/image-binary-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Center Sony FE 85mm product WebP'
          git pull --rebase origin main
          git push origin HEAD:main
