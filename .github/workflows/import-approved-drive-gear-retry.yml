name: Import approved Drive gear WebP assets retry

on:
  push:
    paths:
      - 'image-upload-staging/drive-ready-2.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify approved Drive WebP asset
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import urllib.request

          files = [
              ('1znMegDMAJyB0UH_DaFvtpGoEbdG9xVKx', 'public/assets/images/generated/v1/gear/sony-fe-85-f18.webp', 148766, '85b9c2eeb83aaff41b9ba4996f529852529a0b5bee6cbf6b915272d78d49a8b9'),
          ]

          for file_id, target_path, expected_size, expected_sha in files:
              url = f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if len(data) != expected_size:
                  raise SystemExit(f'size mismatch for {target_path}: {len(data)} != {expected_size}')
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected_sha:
                  raise SystemExit(f'sha256 mismatch for {target_path}: {digest}')
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f'not a WebP: {target_path}')
              target = pathlib.Path(target_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(target_path, len(data), digest)
          PY

      - name: Commit verified production asset and clean temporary importers
        shell: bash
        run: |
          rm -rf image-upload-staging
          rm -f .github/workflows/image-binary-import.yml
          rm -f .github/workflows/import-approved-drive-gear.yml
          rm -f .github/workflows/import-approved-drive-gear-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Center Sony FE 85mm product WebP'
          git push origin HEAD:main
