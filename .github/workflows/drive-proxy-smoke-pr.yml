name: Drive proxy smoke PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'drive-proxy-smoke-trigger.txt'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify proxied original WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, urllib.request
          url='https://photo-ebook.pages.dev/drive-transfer/1cqELYtiDdXDiNNcPD081_oT_l-4hrTt9'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=45).read()
          assert len(data)==117242, (len(data), data[:100])
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert hashlib.sha256(data).hexdigest()=='a8f71a5d0992c106aac7d1a3b1f2c61faf71fd2b86415283cc81a5f042d62c4b'
          print('proxy original verified', len(data))
          PY
